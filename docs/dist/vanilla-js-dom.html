\u003c/td>\u003ctd>aria-describedby로 연결한 입력 안내\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003cp>이름은 입력한 값과도 다릅니다. 이름이 “별명”인 입력에 “민지”를 적으면 이름은 계속 “별명”이고 현재 값이 “민지”가 됩니다. 안내 문장을 설명으로 연결하면 짧은 이름을 유지하면서 필요한 정보를 보탤 수 있습니다. placeholder는 입력 중 사라질 수 있으므로 보이는 label을 대신하는 용도로 의존하지 않습니다.\u003c/p>\n\u003cp>버튼에 보이는 글자가 이미 충분한 이름을 제공한다면 같은 내용을 aria-label로 중복 작성할 필요가 없습니다. aria-label은 기존 이름을 덮어쓸 수 있으므로 화면의 글자와 다른 이름을 만들지 않도록 주의합니다.\u003c/p>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/practices/names-and-descriptions/\">WAI · 접근 가능한 이름과 설명\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"native-and-aria\">\u003ch2>HTML은 기본 동작을 제공하고, ARIA는 의미를 보충합니다\u003c/h2>\n\u003cp>\u003ccode>&lt;button&gt;\u003c/code>에는 버튼의 의미와 키보드 활성화가 함께 있습니다. 따라서 일반적인 버튼은 click 리스너 하나로 마우스와 키보드로 발생한 활성화를 처리할 수 있습니다. checkbox는 Space로 선택 상태가 바뀌고, 연결한 label도 조작에 사용할 수 있습니다. 필요한 행동을 이미 가진 요소부터 고르면 직접 맞춰야 할 책임이 줄어듭니다.\u003c/p>\n\u003cpre>\u003ccode>&lt;button type=\"button\"&gt;실행하기&lt;/button&gt;\n&lt;!-- role=\"button\"을 추가할 필요가 없습니다. --&gt;\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>ARIA는 동작 코드를 설치하지 않습니다.\u003c/strong> div에 role=\"button\"을 적어도 Tab 이동이나 Enter·Space 활성화가 자동으로 생기지 않습니다. aria-expanded=\"true\"를 적어도 패널이 저절로 보이지 않습니다. 개발자는 의미로 약속한 상태와 실제 동작을 맞춰야 합니다.\u003c/p>\n\u003cp>단순한 펼침 영역에는 \u003ccode>&lt;details&gt;\u003c/code>와 \u003ccode>&lt;summary&gt;\u003c/code>도 사용할 수 있습니다. 아래 예제는 상태의 연결 원리를 관찰하기 위해 button, aria-expanded, hidden을 직접 연결합니다. 구현의 출발점은 언제나 목적에 맞는 기본 HTML 요소입니다.\u003c/p>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/practices/read-me-first/\">WAI · ARIA의 역할은 동작에 대한 약속\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"focus-and-feedback\">\u003ch2>변화를 알리는 일과 포커스를 옮기는 일은 다릅니다\u003c/h2>\n\u003cp>\u003cstrong>포커스\u003c/strong>는 현재 키보드 입력이 향하는 위치입니다. 체크박스의 \u003cstrong>선택 상태\u003c/strong>와는 별개이므로 Tab으로 체크박스에 도착했다고 체크되는 것은 아닙니다. 선택을 바꾼 뒤 다른 요소로 이동해도 체크 상태는 남습니다. 키보드 사용자는 포커스 테두리로 현재 위치를 확인하므로 이를 보이지 않게 지우지 않아야 합니다.\u003c/p>\n\u003cp>저장 완료 같은 짧은 결과를 알릴 때마다 포커스를 결과 문장으로 옮기면 사용자의 다음 동작이 끊깁니다. \u003ccode>role=\"status\"\u003c/code>는 현재 작업을 크게 방해하지 않는 상태 메시지에 사용합니다. 기본적으로 polite 알림과 전체 메시지를 읽는 의미를 가지며, 브라우저와 보조 기술이 갱신 내용을 전달할 수 있게 합니다. 메시지 영역을 먼저 문서에 두고 이후 내용을 바꿉니다.\u003c/p>\n\u003cp>모든 DOM 변경을 live region으로 만들 필요는 없습니다. 체크박스의 기본 상태처럼 이미 전달되는 정보를 다시 알리면 중복될 수 있습니다. 일반적인 결과 안내는 짧은 상태 메시지로, 새 화면으로 이동하는 경우는 새 맥락에 맞는 포커스 관리로 구분해서 설계합니다. 낭독 여부와 시점은 브라우저·보조 기술·설정에 따라 확인해야 합니다.\u003c/p>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/practices/keyboard-interface/\">WAI · 키보드 인터페이스\u003c/a>, \u003ca href=\"https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html\">WAI · 상태 메시지\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Roles/status_role\">MDN · status 역할\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection id=\"observation\">\u003ch2>한 번에 한 가지씩 관찰하기\u003c/h2>\u003cp>각 예제는 독립적입니다. 먼저 예상한 뒤 조작하고, 화면의 결과와 의미·포커스가 함께 맞는지 확인하세요. 본문의 코드는 핵심 연결만 발췌했으며 \u003ca href=\"main.js\">전체 JavaScript\u003c/a>에는 예제별 구현이 있습니다.\u003c/p>\n\u003cnav class=\"sample-links\" aria-label=\"접근성 예제 바로가기\">\u003ca href=\"#sample-native-keyboard\">9-1 · 기본 키보드 동작\u003c/a>\u003ca href=\"#sample-accessible-name\">9-2 · 이름과 설명\u003c/a>\u003ca href=\"#sample-disclosure\">9-3 · 펼침 상태\u003c/a>\u003ca href=\"#sample-live-status\">9-4 · 결과 알림\u003c/a>\u003c/nav>\n\n\u003csection class=\"demo sample\" id=\"sample-native-keyboard\" aria-labelledby=\"native-sample-title\">\n\u003cp class=\"sample-meta\">예제 9-1 · 네이티브 요소와 키보드\u003c/p>\u003ch3 id=\"native-sample-title\">click 리스너 하나로 키보드 활성화도 받을 수 있을까?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기\u003c/strong> · Tab으로 버튼에 도착한 뒤 Enter 또는 Space를 누르면 실행 횟수가 바뀔까요? 다음 체크박스로 이동하기만 해도 체크될까요?\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton type=\"button\" id=\"native-run\">한 번 실행하기\u003c/button>\u003cbutton type=\"button\" id=\"native-reset\">횟수 초기화\u003c/button>\u003c/div>\n\u003cp id=\"native-result\" role=\"status\">실행 횟수: 0회\u003c/p>\n\u003clabel class=\"control\" for=\"native-news\">\u003cinput type=\"checkbox\" id=\"native-news\">이메일 소식 받기\u003c/label>\n\u003cpre>\u003ccode>button.addEventListener(\"click\", () =&gt; {\n  count += 1;\n  result.textContent = `실행 횟수: ${count}회`;\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과\u003c/strong> · 버튼은 Enter·Space로 한 번씩 실행됩니다. 체크박스는 포커스만 받아서는 바뀌지 않고 Space로 선택이 바뀝니다. keydown 리스너는 작성하지 않았습니다. 네이티브 버튼에 같은 동작의 keydown까지 더하면 중복 실행될 수 있습니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"demo sample\" id=\"sample-accessible-name\" aria-labelledby=\"name-sample-title\">\n\u003cp class=\"sample-meta\">예제 9-2 · 이름, 설명, 현재 값\u003c/p>\u003ch3 id=\"name-sample-title\">입력값을 바꾸어도 입력의 이름은 그대로일까?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기\u003c/strong> · “별명”이라는 글자를 클릭한 뒤 이름을 적어보세요. 화면의 레이블, 안내, 입력한 값 중 어떤 것이 이 요소의 이름일까요?\u003c/p>\n\u003clabel class=\"stack\" for=\"accessible-nickname\">별명\u003cinput id=\"accessible-nickname\" type=\"text\" name=\"nickname\" aria-describedby=\"nickname-hint\" autocomplete=\"off\" value=\"민지\">\u003c/label>\n\u003cp id=\"nickname-hint\">다른 학습자에게 보여줄 이름을 적으세요. 실제 이름일 필요는 없습니다.\u003c/p>\n\u003cpre>\u003ccode>&lt;label for=\"accessible-nickname\"&gt;별명&lt;/label&gt;\n&lt;input id=\"accessible-nickname\" type=\"text\"\n  aria-describedby=\"nickname-hint\" value=\"민지\"&gt;\n&lt;p id=\"nickname-hint\"&gt;다른 학습자에게 보여줄 이름을 적으세요.&lt;/p&gt;\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과\u003c/strong> · 레이블을 클릭하면 입력에 포커스가 갑니다. 입력값을 바꿔도 이름은 “별명”으로 유지됩니다. 개발자 도구의 접근성 패널에서 이름과 설명을 따로 확인하세요. 위 코드는 설명 문장을 줄인 발췌이며, 이 연결에는 JavaScript가 필요하지 않습니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"demo sample\" id=\"sample-disclosure\" aria-labelledby=\"disclosure-sample-title\">\n\u003cp class=\"sample-meta\">예제 9-3 · 표시 상태와 접근성 상태\u003c/p>\u003ch3 id=\"disclosure-sample-title\">패널을 펼칠 때 함께 바꿔야 할 정보는 무엇일까?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기\u003c/strong> · 버튼을 눌러 내용을 펼치고 다시 접어보세요. hidden과 aria-expanded는 각각 어떤 값을 가져야 할까요?\u003c/p>\n\u003cbutton type=\"button\" id=\"help-toggle\" aria-expanded=\"false\" aria-controls=\"help-panel\">학습 도움말\u003c/button>\n\u003cdiv id=\"help-panel\" hidden>\u003cp>먼저 결과를 예상하고, 실행한 뒤 코드의 어느 줄이 상태를 바꾸었는지 찾아보세요.\u003c/p>\u003cp>\u003ca href=\"../02-dom/\">DOM 개념 다시 읽기\u003c/a>\u003c/p>\u003c/div>\n\u003cp id=\"disclosure-result\">aria-expanded=\"false\" · hidden=true\u003c/p>\n\u003cpre>\u003ccode>button.addEventListener(\"click\", () =&gt; {\n  const expanded = button.getAttribute(\"aria-expanded\") === \"true\";\n  button.setAttribute(\"aria-expanded\", String(!expanded));\n  panel.hidden = expanded;\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과\u003c/strong> · 펼치면 aria-expanded=\"true\", hidden=false입니다. 키보드로 활성화한 뒤 포커스는 버튼에 남고, 다음 Tab으로 열린 패널의 링크에 갈 수 있습니다. 접은 상태에서는 그 링크가 Tab 순서에 나타나지 않습니다. aria-controls는 관계를 설명하고 실제 표시 변경은 JavaScript가 수행합니다.\u003c/p>\n\u003cp class=\"muted\">패턴 참고: \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/\">WAI · 펼침 영역(Disclosure)\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"demo sample\" id=\"sample-live-status\" aria-labelledby=\"status-sample-title\">\n\u003cp class=\"sample-meta\">예제 9-4 · 포커스를 유지하는 결과 안내\u003c/p>\u003ch3 id=\"status-sample-title\">결과를 알리기 위해 반드시 포커스를 옮겨야 할까?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기\u003c/strong> · 아래 버튼을 키보드로 실행하세요. 결과 문장이 바뀔 때 포커스는 어디에 남아 있어야 다음 실행을 이어가기 쉬울까요?\u003c/p>\n\u003cbutton type=\"button\" id=\"record-practice\">연습 완료 기록하기\u003c/button>\n\u003cp id=\"practice-status\" role=\"status\">\u003c/p>\n\u003cp class=\"muted\">이 기록은 현재 예제의 메모리에만 남습니다. 페이지를 다시 열면 0회에서 시작합니다.\u003c/p>\n\u003cpre>\u003ccode>&lt;p id=\"practice-status\" role=\"status\"&gt;&lt;/p&gt;\n\nbutton.addEventListener(\"click\", () =&gt; {\n  completed += 1;\n  status.textContent = `연습 ${completed}회를 기록했습니다.`;\n  // focus()를 호출하지 않습니다.\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과\u003c/strong> · 기록 횟수가 증가하고 버튼의 키보드 포커스가 유지됩니다. 스크린 리더에서는 현재 작업을 방해하지 않는 시점에 결과 알림이 전달되는지 확인합니다. 화면의 문구가 바뀌었다는 것만으로 실제 낭독까지 검증한 것은 아닙니다.\u003c/p>\n\u003c/section>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"manual-check\">\u003ch2>같은 기능을 세 가지 관점에서 확인합니다\u003c/h2>\n\u003cp>한 가지 도구만으로 접근성을 모두 확인할 수는 없습니다. 여기서는 아래 순서로 작은 기능의 계약을 확인합니다. 실제 음성 문구와 순서는 스크린 리더, 브라우저, 언어와 설정에 따라 달라질 수 있습니다.\u003c/p>\n\u003col>\u003cli>\u003cstrong>키보드\u003c/strong> · Tab·Shift+Tab으로 조작 사이를 오가며 포커스 위치가 보이는지 확인합니다. 버튼은 Enter·Space, 체크박스는 Space로 조작합니다. 버튼을 Tab으로 찾을 수 없다면 운영체제와 브라우저의 전체 키보드 탐색 설정도 확인합니다.\u003c/li>\u003cli>\u003cstrong>DOM과 접근성 패널\u003c/strong> · 레이블이 입력과 연결되는지, 이름·역할·현재 상태가 맞는지 봅니다. 펼침 예제에서는 aria-expanded와 hidden을 나란히 비교합니다. 이 패널은 정보 확인 수단이며 실제 스크린 리더 동작 전체를 대신하지 않습니다.\u003c/li>\u003cli>\u003cstrong>스크린 리더\u003c/strong> · 입력의 이름과 설명, 체크박스의 선택 상태, 펼침 버튼의 상태를 구별할 수 있는지 확인합니다. 마지막 예제는 포커스를 옮기지 않고 결과를 들을 수 있는지 확인합니다. 조작할 때는 사용하는 도구의 탐색 모드와 폼 조작 모드도 고려합니다.\u003c/li>\u003c/ol>\n\u003cp class=\"note\">접근성은 이 장의 기능만으로 끝나지 않습니다. 제목 구조, 이미지의 대체 텍스트, 색 대비, 확대와 작은 화면에서의 읽기 흐름도 함께 다뤄야 합니다. 이 장에서는 JavaScript로 동작을 연결할 때 직접 영향을 주는 의미와 포커스에 집중했습니다.\u003c/p>\n\u003c/section>\n\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 화면과 의미의 연결 설명하기\u003c/summary>\u003cp>펼침 예제의 두 변경 줄을 문장으로 설명해보세요. aria-expanded는 무엇을 알리고, hidden은 무엇을 바꾸나요? 두 값이 서로 맞지 않는다면 사용자는 어떤 정보를 받게 될까요?\u003c/p>\u003cp>다음으로 도움말을 \u003ccode>&lt;details&gt;&lt;summary&gt;학습 도움말&lt;/summary&gt;…&lt;/details&gt;\u003c/code>로 표현해보세요. 브라우저가 대신 맡아주는 상태와 동작을 비교할 수 있습니다.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../10-focus-forms/\">← 이전 · 폼과 포커스\u003c/a>\u003ca href=\"../07-headless/\">다음 · 동작을 재사용하는 구조 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>\n","11-accessibility/main.js":"// 예제 9-1: 기본 버튼은 마우스와 키보드 활성화를 모두 click으로 전달합니다.\nconst nativeButton = document.querySelector(\"#native-run\");\nconst nativeResult = document.querySelector(\"#native-result\");\nlet executionCount = 0;\n\nnativeButton.addEventListener(\"click\", () => {\n  executionCount += 1;\n  nativeResult.textContent = `실행 횟수: ${executionCount}회`;\n});\n\ndocument.querySelector(\"#native-reset\").addEventListener(\"click\", () => {\n  executionCount = 0;\n  nativeResult.textContent = \"실행 횟수: 0회\";\n});\n\n// 예제 9-2: label과 aria-describedby의 연결에는 JavaScript가 필요하지 않습니다.\n\n// 예제 9-3: 한 번의 활성화에서 표시 상태와 접근성 상태를 함께 변경합니다.\nconst helpButton = document.querySelector(\"#help-toggle\");\nconst helpPanel = document.querySelector(\"#help-panel\");\nconst disclosureResult = document.querySelector(\"#disclosure-result\");\n\nhelpButton.addEventListener(\"click\", () => {\n  const expanded = helpButton.getAttribute(\"aria-expanded\") === \"true\";\n  helpButton.setAttribute(\"aria-expanded\", String(!expanded));\n  helpPanel.hidden = expanded;\n  disclosureResult.textContent = `aria-expanded=\"${!expanded}\" · hidden=${expanded}`;\n  // 키보드로 누른 버튼의 포커스를 패널로 강제로 이동하지 않습니다.\n});\n\n// 예제 9-4: 미리 존재하는 status의 내용을 변경하고 포커스는 유지합니다.\nconst recordButton = document.querySelector(\"#record-practice\");\nconst practiceStatus = document.querySelector(\"#practice-status\");\nlet completed = 0;\n\nrecordButton.addEventListener(\"click\", () => {\n  completed += 1;\n  practiceStatus.textContent = `연습 ${completed}회를 기록했습니다.`;\n});\n","07-headless/index.html":"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>10장 · 동작을 재사용하는 구조\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript type=\"module\" src=\"main.js\">\u003c/script>\u003c/head>\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">10장 · 동작을 재사용하는 구조\u003c/p>\u003ch1>동작은 어떻게\u003cbr>여러 모습에 재사용될까\u003c/h1>\u003cp class=\"intro\">값을 기억하는 코드, 문서를 바꾸는 코드, 모습을 정하는 코드의 책임을 구분합니다. 바닐라 JavaScript와 DOM이 헤드리스 구현으로 이어지는 지점입니다.\u003c/p>\u003c/header>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 내용\">\u003ch2>이 장의 내용\u003c/h2>\u003col>\u003cli>\u003ca href=\"#meaning\">헤드리스와 프레임워크 독립\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#state-owner\">상태를 소유하는 객체\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#small-code\">작은 저장소를 줄마다 읽기\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#subscription\">변경을 알리는 구독\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#binding\">DOM을 연결하는 경계\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#example\">설명한 구조의 실행 예제\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n\u003csection class=\"concept\" id=\"meaning\">\u003ch2>헤드리스는 무엇을 분리하는가\u003c/h2>\n\u003cp>이메일 알림을 켜고 끄는 기능을 생각해봅시다. 설정 화면에서는 작은 체크박스이고, 소개 화면에서는 둥근 스위치일 수 있습니다. 둘의 색과 크기가 달라도 “켜짐 또는 꺼짐을 기억한다”, “사용자 조작에 따라 값이 바뀐다”는 규칙은 같습니다. 이 규칙을 특정한 시각 디자인과 분리해 제공하는 방식을 \u003cstrong>헤드리스\u003c/strong>라고 부릅니다.\u003c/p>\n\u003cp>헤드리스 코드는 아무 HTML이나 써도 접근성이 자동 완성되는 마법이 아닙니다. 버튼·입력·레이블 사이의 관계, 키보드 조작, 포커스, 상태를 보조 기술에 전달하는 방식은 여전히 필요합니다. 자유롭게 바꿀 수 있는 시각 표현과, 기능을 제대로 사용하기 위해 지켜야 하는 의미·행동의 규칙을 구분하는 것이 중요합니다.\u003c/p>\n\u003cp>\u003cstrong>프레임워크 독립\u003c/strong>은 또 다른 구분입니다. 특정 프레임워크의 함수나 실행 방식이 없어도 코드를 사용할 수 있다는 뜻입니다. DOM은 브라우저의 기본 API이므로, DOM을 사용하는 코드도 특정 프레임워크에 독립적일 수 있습니다. 상태 계산을 DOM 없이 만들고, 요소를 조작하는 부분을 별도로 두면 두 종류의 코드를 각각 재사용하고 검사하기 쉽습니다.\u003c/p>\n\u003cp>따라서 “바닐라 JavaScript로 태그를 조작했다”는 사실만으로 분리가 이루어지지는 않습니다. 클릭 함수 안에 값 계산, 특정 요소 찾기, 색 지정이 모두 섞여 있다면 다른 모습에 사용할 때 그 함수를 함께 고쳐야 합니다. 어떤 변경이 어떤 코드에 영향을 주어야 하는지를 생각하며 경계를 정합니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"state-owner\">\u003ch2>상태를 소유한다는 말의 의미\u003c/h2>\n\u003cp>6장에서 상태는 현재 화면이 표현할 데이터라고 설명했습니다. 여러 입력이 같은 설정을 보여줄 때 각각의 DOM에서 값을 따로 읽으면 어느 값이 기준인지 모호해집니다. 한쪽은 켜져 있고 다른 쪽은 꺼져 있을 수도 있습니다. 그래서 공유할 값의 기준을 한 곳에 두고, 나머지 요소는 그 값을 표현하게 만들 수 있습니다.\u003c/p>\n\u003cp>이 기준값과 값을 읽고 바꾸는 기능을 묶어 놓은 객체를 여기서는 \u003cstrong>저장소(store)\u003c/strong>라고 부릅니다. 저장소는 언어에 내장된 특별한 종류가 아닙니다. 우리가 만든 일반 객체입니다. 중요한 점은 이름이 아니라, 값의 변경을 어디서 결정하는지가 드러난다는 데 있습니다.\u003c/p>\n\u003cp>저장소를 사용하는 쪽은 어떤 DOM 요소가 있는지 저장소에 설명할 필요가 없습니다. 저장소에 true를 전달하면 저장소의 선택 상태가 바뀝니다. 그 결과를 두 개의 입력에 보여줄지, 문구 하나로 보여줄지는 연결하는 코드가 정합니다. 이렇게 공개한 함수의 이름과 입력·출력·동작 약속을 \u003cstrong>API의 계약\u003c/strong>이라고 생각할 수 있습니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"small-code\">\u003ch2>작은 저장소를 한 줄씩 읽기\u003c/h2>\n\u003cp>먼저 변경 알림도 없는 가장 작은 형태를 보겠습니다. 이 코드는 DOM에 접근하지 않으며, 값 하나를 보관하는 원리만 담습니다.\u003c/p>\n\u003cpre>\u003ccode>function createToggle(initial) {\n  let checked = initial;\n  return {\n    getChecked() { return checked; },\n    setChecked(next) { checked = next; }\n  };\n}\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>\u003cstrong>첫 줄:\u003c/strong> 함수를 호출할 때 초기값을 initial이라는 매개변수로 받습니다. 함수를 정의하는 것만으로 상태가 생기지는 않습니다.\u003c/li>\u003cli>\u003cstrong>둘째 줄:\u003c/strong> 이번 호출에서 사용할 지역 변수 checked를 만듭니다. 이 변수에 현재 선택 상태를 보관합니다.\u003c/li>\u003cli>\u003cstrong>셋째 줄:\u003c/strong> 바깥에서 사용할 객체를 반환합니다. 객체 안에 적은 두 메서드는 모두 이번 호출의 checked에 접근합니다.\u003c/li>\u003cli>\u003cstrong>넷째 줄:\u003c/strong> getChecked를 호출하면 현재 값을 읽어 반환합니다. 호출한 시점의 값이며, 변수 자체를 외부로 건네는 것은 아닙니다.\u003c/li>\u003cli>\u003cstrong>다섯째 줄:\u003c/strong> setChecked를 호출하면 전달받은 next를 지역 변수에 대입합니다. 아직 문서를 바꾸거나 다른 함수를 호출하지는 않습니다.\u003c/li>\u003c/ol>\n\u003cp>createToggle의 실행이 끝나도 두 메서드는 checked에 접근할 수 있습니다. 1장에서 설명한 클로저가 이 관계를 유지합니다. \u003ccode>createToggle(false)\u003c/code>를 두 번 호출하면 서로 다른 지역 변수를 가진 저장소가 생깁니다. 반대로 같은 저장소 객체를 두 곳에 전달하면 같은 값을 공유합니다.\u003c/p>\n\u003cp>실제 예제의 \u003ccode>createSwitchStore\u003c/code>는 이 구조에 입력값 검사, 변경 알림, 초기값으로 되돌리기를 더합니다. 먼저 값을 숨겨 두고 함수로 읽고 바꾸는 이 작은 원리를 이해하면, 추가된 기능이 어느 부분을 확장하는지 따라갈 수 있습니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"subscription\">\u003ch2>구독은 “바뀌면 호출할 함수”를 등록하는 일\u003c/h2>\n\u003cp>작은 저장소의 setChecked는 값만 바꿉니다. 화면을 자동으로 바꿀 이유가 없고, 화면이 있는지도 모릅니다. 이때 저장소를 사용하는 쪽이 “값이 바뀌면 이 함수를 불러달라”고 요청할 수 있습니다. 이런 등록을 \u003cstrong>구독(subscription)\u003c/strong>이라고 부릅니다.\u003c/p>\n\u003cp>함수를 인수로 전달한다는 점에서는 이벤트 리스너와 같은 JavaScript 개념을 사용합니다. 차이는 누가 함수를 보관하고 호출하느냐입니다. DOM 리스너는 브라우저의 이벤트 시스템에 등록하지만, 이 저장소의 구독은 Set에 함수 객체를 보관합니다. Set은 중복되지 않는 값을 모아 두는 JavaScript 내장 컬렉션입니다. 값 변경 후 그 함수들을 직접 호출합니다. 여기서 호출은 동기적으로 이루어지며 별도의 타이머를 예약하지 않습니다.\u003c/p>\n\u003cpre>\u003ccode>const stop = store.subscribe(showState);\nstore.setChecked(true);\nstop();\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>\u003cstrong>등록:\u003c/strong> showState라는 함수를 전달합니다. 지금 실행한 결과를 전달하는 \u003ccode>showState()\u003c/code>와 다릅니다. 반환된 stop은 등록을 해제하는 함수입니다.\u003c/li>\u003cli>\u003cstrong>변경:\u003c/strong> 값이 실제로 달라지면 저장소가 구독 중인 showState를 호출합니다. 화면 갱신은 showState가 맡습니다.\u003c/li>\u003cli>\u003cstrong>해제:\u003c/strong> stop을 실행하면 해당 구독만 제거합니다. 저장소나 다른 구독을 모두 없애는 것은 아닙니다.\u003c/li>\u003c/ol>\n\u003cp>언제 알림을 보낼지도 계약의 일부입니다. 이 예제는 같은 값을 다시 넣으면 알림을 생략하고, 구독 직후에는 함수를 호출하지 않습니다. 따라서 화면의 최초 표시는 한 번 직접 실행해야 합니다. “구독”이라는 단어만 보고 이런 세부 규칙까지 정해져 있다고 가정하면 처음 화면이나 변경 횟수를 잘못 이해하게 됩니다.\u003c/p>\n\u003cp>저장소의 getState는 상태 객체를 반환합니다. 이 예제에서는 변경 시 새 객체를 만들고 Object.freeze로 속성 변경을 막습니다. 읽은 객체를 직접 고쳐 변경 알림을 우회하지 않도록 하는 장치입니다. freeze는 얕게 적용되므로 중첩 객체까지 자동으로 고정하지는 않습니다. 현재 예제는 boolean 하나만 보관합니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"binding\">\u003ch2>DOM 연결 코드는 두 방향을 이어줍니다\u003c/h2>\n\u003cp>\u003cstrong>바인딩(binding)\u003c/strong>은 여기서 저장소와 DOM 요소 사이에 값을 전달하는 연결을 뜻합니다. 입력에서 일어난 change를 저장소에 전달하는 방향과, 저장소에서 바뀐 값을 DOM에 반영하는 방향이 있습니다. 둘을 명확하게 정하면 한 요소의 모양이 달라져도 상태 규칙을 다시 작성하지 않아도 됩니다.\u003c/p>\n\u003cpre>\u003ccode>function render() {\n  const { checked } = store.getState();\n  input.checked = checked;\n  input.dataset.state = checked ? \"checked\" : \"unchecked\";\n}\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>\u003cstrong>상태 읽기:\u003c/strong> 저장소 객체에서 현재 checked를 꺼냅니다. 객체에서 같은 이름의 속성을 변수로 꺼내는 구조 분해 문법입니다.\u003c/li>\u003cli>\u003cstrong>기능 상태 반영:\u003c/strong> input.checked를 설정해 실제 입력의 현재 선택 상태를 맞춥니다. 사용자가 키보드나 폼으로 다루는 입력의 상태입니다.\u003c/li>\u003cli>\u003cstrong>표현할 상태 전달:\u003c/strong> dataset.state를 문자열로 설정해 data-state 속성을 만듭니다. CSS는 이 값을 조건으로 색이나 모양을 정할 수 있습니다.\u003c/li>\u003c/ol>\n\u003cp>반대 방향에서는 change 리스너가 \u003ccode>store.setChecked(input.checked)\u003c/code>를 호출합니다. 프로그램이 checked에 값을 대입한다고 change가 자동 발생하지 않으므로, 저장소에서 DOM으로 반영하는 작업이 곧바로 change를 다시 발생시키지는 않습니다. 사용자 입력과 프로그램의 값 대입을 구분한 4장과 6장의 개념이 여기에서 쓰입니다.\u003c/p>\n\u003cp>브라우저의 체크박스는 클릭과 Space 조작을 이미 제공합니다. 이 예제는 그 기본 동작을 사용하고 바뀐 결과를 읽습니다. 기본 요소를 사용하지 않는 형태로 바꿀 때는 그 요소가 제공하던 키보드·포커스·폼의 계약을 어떻게 유지할지 별도로 설계해야 합니다. 스타일만 없앤 코드와 접근성을 갖춘 재사용 가능한 동작은 같은 완성 수준을 뜻하지 않습니다.\u003c/p>\n\u003cfigure class=\"concept-figure\">\u003cfigcaption>이 예제의 한 번의 변경\u003c/figcaption>\u003cdiv class=\"flow\">\u003cspan>사용자 입력\u003c/span> → \u003cspan>change에서 값 읽기\u003c/span> → \u003cspan>저장소 변경\u003c/span> → \u003cspan>구독 함수 호출\u003c/span> → \u003cspan>각 DOM 갱신\u003c/span>\u003c/div>\u003cp>CSS는 갱신된 data-state를 보고 모습을 결정합니다. 저장소는 색이나 요소 선택자를 알지 못합니다.\u003c/p>\u003c/figure>\n\u003c/section>\n\u003csection class=\"concept\" id=\"example\">\u003ch2>설명한 구조의 실행 예제\u003c/h2>\u003cp>아래 두 입력은 같은 저장소를 사용합니다. 기본 입력 하나를 켜면 저장소가 바뀌고 두 연결 함수가 각각 자신의 DOM을 갱신합니다. 색과 모양은 다르지만 값을 공유하는 이유는 앞에서 만든 객체와 구독의 관계 때문입니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-subscription\">10-1 · 변경 알림\u003c/a>\u003ca href=\"#sample-shared-views\">10-2 · 두 화면 연결\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-subscription\" aria-labelledby=\"subscription-title\">\n\u003ch3 id=\"subscription-title\">10-1 · 함수 호출 횟수와 변경 알림 횟수\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> false로 시작해 true를 세 번 대입하면 변경 알림은 몇 번 올까요?\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton id=\"subscription-on\" type=\"button\">true 대입\u003c/button>\u003cbutton id=\"subscription-reset\" type=\"button\">이 예제 다시 시작\u003c/button>\u003c/div>\n\u003cp id=\"subscription-result\" role=\"status\">\u003c/p>\n\u003cpre>\u003ccode>const store = createSwitchStore(false);\nstore.subscribe(() =&gt; notifications++);\nstore.setChecked(true);\nstore.setChecked(true); // 값이 같아 추가 알림 없음\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 호출은 3회, 알림은 1회입니다. subscribe 직후에도 알림은 없습니다. 이것은 JavaScript의 자동 규칙이 아니라 이 저장소가 정한 계약입니다. 아래 예제와 저장소를 공유하지 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample stack\" id=\"sample-shared-views\" aria-labelledby=\"demo-title\">\n    \u003ch3 id=\"demo-title\">10-2 · 같은 상태를 두 가지 모습으로 표현하기\u003c/h3>\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 기본 체크박스를 Space로 조작하면 옆 스위치도 바뀔까요?\u003c/p>\n    \u003cdiv class=\"two-views\">\n      \u003cdiv>\u003ch4>브라우저 기본 모습\u003c/h4>\u003clabel class=\"control\" for=\"plain\">\u003cinput id=\"plain\" type=\"checkbox\" role=\"switch\">이메일 알림 · 기본\u003c/label>\u003c/div>\n      \u003cdiv>\u003ch4>CSS로 바꾼 모습\u003c/h4>\u003clabel class=\"control\" for=\"styled\">\u003cinput id=\"styled\" class=\"styled-switch\" type=\"checkbox\" role=\"switch\">이메일 알림 · 스타일\u003c/label>\u003c/div>\n    \u003c/div>\n    \u003cdiv aria-live=\"polite\">\u003cp>공유 상태: \u003cspan id=\"summary\" class=\"status\">\u003c/span>\u003c/p>\u003cpre id=\"state-view\">\u003c/pre>\u003cp>상태 변경 알림: \u003cspan id=\"notify-count\">0\u003c/span>회\u003c/p>\u003c/div>\n    \u003cdiv class=\"row\">\u003cbutton id=\"turn-on\" type=\"button\">저장소에서 켜기\u003c/button>\u003cbutton id=\"views-reset\" type=\"button\">이 예제 다시 시작\u003c/button>\u003c/div>\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 어느 입력을 조작해도 둘이 같은 상태를 보여줍니다. CSS가 아니라 동일한 저장소와 각 DOM 연결이 값을 맞춥니다. 네이티브 checkbox의 키보드 동작은 그대로 사용합니다.\u003c/p>\n  \u003c/section>\n\u003cp>\u003ca href=\"main.js\">연결을 구성하는 main.js\u003c/a> · \u003ca href=\"../shared/switch-store.js\">상태 저장소\u003c/a> · \u003ca href=\"../shared/bind-switch.js\">DOM 연결 함수\u003c/a> · \u003ca href=\"../styles.css\">스타일\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 · 같은 상태와 독립적인 상태를 비교하기\u003c/summary>\u003cp>본문을 이해한 뒤 원한다면 스타일 입력에 별도의 createSwitchStore(false)를 연결해보세요. 입력을 조작할 때 서로 영향을 주지 않아야 합니다. 두 값이 달라지는 이유를 CSS가 아니라 저장소 객체의 동일성으로 설명할 수 있으면 됩니다.\u003c/p>\u003cp>같은 저장소에서 setChecked(true)를 반복하면 값이 달라진 첫 호출에서만 알림이 옵니다. 함수의 호출과 실제 상태 변경을 구분해보세요.\u003c/p>\u003c/details>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures\">MDN · 클로저\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/freeze\">MDN · Object.freeze\u003c/a>\u003c/p>\n\u003cnav>\u003ca href=\"../11-accessibility/\">← 9장 · 접근성의 의미와 동작\u003c/a>\u003ca href=\"../08-lifecycle/\">11장 · 연결과 수명 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","07-headless/main.js":"import { createSwitchStore } from \"../shared/switch-store.js\";\nimport { bindSwitch } from \"../shared/bind-switch.js\";\n\nconst store = createSwitchStore(false);\nconst plainInput = document.querySelector(\"#plain\");\nconst styledInput = document.querySelector(\"#styled\");\nconst summary = document.querySelector(\"#summary\");\nconst stateView = document.querySelector(\"#state-view\");\nconst notifyCount = document.querySelector(\"#notify-count\");\nlet notifications = 0;\n\n// 같은 저장소에 두 입력을 연결합니다. 변경 알림을 받으면 각 입력이 갱신됩니다.\nbindSwitch(plainInput, store);\nbindSwitch(styledInput, store);\n\nfunction showState() {\n  const state = store.getState();\n  summary.textContent = state.checked ? \"켜짐\" : \"꺼짐\";\n  stateView.textContent = JSON.stringify(state, null, 2);\n  notifyCount.textContent = String(notifications);\n}\n\n// 구독은 자동 기능이 아니라, 저장소가 나중에 호출할 함수를 등록하는 일입니다.\nstore.subscribe(() => {\n  notifications += 1;\n  showState();\n});\ndocument.querySelector(\"#turn-on\").addEventListener(\"click\", () => store.setChecked(true));\nshowState();\n\n// 이 페이지에서는 입력이 페이지와 수명을 같이합니다.\n// 다음 장에서 bindSwitch가 반환하는 cleanup을 사용합니다.\n\n// 10-1 · 구독의 계약만 확인하는 독립 저장소입니다.\nlet subscriptionStore;\nlet stopSubscription;\nlet calls = 0;\nlet subscriptionNotifications = 0;\nconst subscriptionResult = document.querySelector(\"#subscription-result\");\nfunction showSubscription() {\n  subscriptionResult.textContent = `현재값 ${subscriptionStore.getState().checked} · 호출 ${calls}회 · 변경 알림 ${subscriptionNotifications}회`;\n}\nfunction resetSubscription() {\n  if (stopSubscription) stopSubscription();\n  subscriptionStore = createSwitchStore(false);\n  calls = 0;\n  subscriptionNotifications = 0;\n  stopSubscription = subscriptionStore.subscribe(() => subscriptionNotifications++);\n  showSubscription();\n}\ndocument.querySelector(\"#subscription-on\").addEventListener(\"click\", () => {\n  calls++;\n  subscriptionStore.setChecked(true);\n  showSubscription();\n});\ndocument.querySelector(\"#subscription-reset\").addEventListener(\"click\", resetSubscription);\nresetSubscription();\ndocument.querySelector(\"#views-reset\").addEventListener(\"click\", () => {\n  store.reset();\n  notifications = 0;\n  showState();\n});\n","08-lifecycle/index.html":"\u003c!doctype html>\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>11장 · 연결과 수명\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript type=\"module\" src=\"main.js\">\u003c/script>\u003c/head>\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">11장 · 연결과 수명\u003c/p>\u003ch1>연결한 코드는\u003cbr>언제까지 남아 있을까\u003c/h1>\u003cp class=\"intro\">이벤트 등록과 구독은 함수를 나중에 부를 수 있도록 남겨 두는 일입니다. 이 관계가 생기고 끝나는 과정을 이해하면, 화면을 여러 번 열고 닫아도 동작이 겹치지 않게 만들 수 있습니다.\u003c/p>\u003c/header>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 내용\">\u003ch2>이 장의 내용\u003c/h2>\u003col>\u003cli>\u003ca href=\"#lifetime\">연결과 수명의 의미\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#identity\">함수 객체의 동일성\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#cleanup\">정리 함수를 줄마다 읽기\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#ownership\">여러 자원을 한 연결로 관리\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#default-action\">기본 동작과 예약 작업의 순서\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#example\">연결을 끊어 보는 예제\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n\u003csection class=\"concept\" id=\"lifetime\">\u003ch2>함수가 끝났는데도 동작이 남는 이유\u003c/h2>\n\u003cp>일반 함수를 호출하면 본문을 실행하고 호출한 곳으로 돌아옵니다. 그런데 함수 안에서 addEventListener를 실행했다면 상황이 하나 더 생깁니다. 지금 실행 중인 함수가 끝나더라도, 이벤트 대상에는 나중에 호출할 리스너가 등록되어 있습니다. 등록한 함수의 실행 종료와 등록된 기능의 종료는 다른 시점입니다.\u003c/p>\n\u003cp>여기서 \u003cstrong>연결\u003c/strong>은 어떤 일이 발생했을 때 다른 코드를 실행하도록 만든 관계를 뜻합니다. 클릭과 핸들러 사이의 관계, 저장소 변경과 화면 갱신 함수 사이의 관계가 그 예입니다. \u003cstrong>수명(lifetime)\u003c/strong>은 이 관계를 유지할 기간입니다. 페이지를 보는 동안 필요할 수도 있고, 팝업이 열린 동안에만 필요할 수도 있습니다.\u003c/p>\n\u003cp>DOM에서 요소를 떼어내는 것 역시 연결을 모두 해제한다는 뜻이 아닙니다. 제거된 요소 객체를 변수가 여전히 가리키면 그 객체를 사용할 수 있습니다. 문서 전체인 document에 등록한 이벤트나 타이머도 따로 남아 있을 수 있습니다. 화면에서 보이지 않는다는 사실과 더 이상 실행될 작업이 없다는 사실은 구분해야 합니다.\u003c/p>\n\u003cp>JavaScript는 더 이상 도달할 수 없는 객체의 메모리를 자동으로 회수합니다. 이를 가비지 컬렉션이라고 합니다. 그러나 “이 화면이 끝났으니 이 리스너를 그만 사용해야 한다”는 제품의 의미까지 판단해주지는 않습니다. 계속 등록되어 호출 가능한 기능은 필요가 끝나는 시점에 직접 해제해야 합니다. 리스너가 있는 모든 제거된 요소가 반드시 메모리 누수가 된다는 뜻은 아닙니다. 남은 참조와 등록 위치를 함께 봐야 합니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"identity\">\u003ch2>같은 코드를 적는 것과 같은 함수를 전달하는 것\u003c/h2>\n\u003cp>1장에서 객체는 내용이 같아도 서로 다른 객체일 수 있다고 배웠습니다. 함수도 객체입니다. 화살표 함수 표현식을 평가할 때마다 새로운 함수 객체가 만들어집니다. 그래서 같은 줄을 두 번 적었다고 같은 리스너를 가리키는 것은 아닙니다.\u003c/p>\n\u003cpre>\u003ccode>button.addEventListener(\"click\", () =&gt; console.log(\"클릭\"));\nbutton.removeEventListener(\"click\", () =&gt; console.log(\"클릭\"));\u003c/code>\u003c/pre>\n\u003cp>첫 줄은 어떤 함수 객체 A를 등록합니다. 둘째 줄은 소스 모양이 같지만 새 함수 객체 B를 전달합니다. 브라우저는 등록된 A와 B가 같은 객체가 아니라는 이유로 A를 제거하지 않습니다. 제거할 때는 이벤트 종류, 등록 당시의 함수 객체, capture 설정이 맞아야 합니다.\u003c/p>\n\u003cp>이 관계를 유지하는 가장 단순한 방법은 함수를 변수나 함수 선언으로 이름 붙이고 같은 값을 등록과 제거에 사용하는 것입니다. 이름의 글자가 중요한 것이 아니라, 두 호출에서 같은 함수 객체를 전달한다는 점이 중요합니다. 이 원리를 이해하면 “removeEventListener를 호출했는데 계속 실행된다”는 문제를 코드의 모양 대신 객체의 동일성으로 설명할 수 있습니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"cleanup\">\u003ch2>정리 함수는 등록한 것을 기억하는 클로저입니다\u003c/h2>\n\u003cp>연결을 만드는 함수가 그 연결을 끝내는 함수도 함께 제공하면 사용하기 편합니다. 보통 이 반환값을 \u003cstrong>정리 함수(cleanup)\u003c/strong>라고 부릅니다. cleanup이라는 이름에 자동 기능이 붙어 있는 것은 아닙니다. 우리가 함수 본문에 등록 해제 코드를 적고, 필요한 시점에 호출하는 약속입니다.\u003c/p>\n\u003cpre>\u003ccode>function connect(button) {\n  function handleClick() {\n    console.log(\"클릭\");\n  }\n  button.addEventListener(\"click\", handleClick);\n  return function cleanup() {\n    button.removeEventListener(\"click\", handleClick);\n  };\n}\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>\u003cstrong>첫 줄:\u003c/strong> 연결할 버튼 객체를 매개변수로 받습니다. 전역 선택자를 함수 안에 고정하지 않아 다른 버튼에도 사용할 수 있습니다.\u003c/li>\u003cli>\u003cstrong>둘째~넷째 줄:\u003c/strong> 이번 연결에서 사용할 핸들러 함수 객체를 만듭니다. connect를 새로 호출하면 새 handleClick이 생깁니다.\u003c/li>\u003cli>\u003cstrong>다섯째 줄:\u003c/strong> 그 함수 객체를 버튼의 click 리스너로 등록합니다. 등록 직후 클릭한 것처럼 실행하지는 않습니다.\u003c/li>\u003cli>\u003cstrong>여섯째~여덟째 줄:\u003c/strong> 같은 버튼과 같은 handleClick을 사용하는 함수를 반환합니다. 이 함수는 바깥 호출이 끝나도 두 값을 기억하므로 나중에 정확한 등록을 제거할 수 있습니다.\u003c/li>\u003c/ol>\n\u003cpre>\u003ccode>const cleanup = connect(button);\n// 연결이 필요한 동안 사용\ncleanup();\u003c/code>\u003c/pre>\n\u003cp>반환받은 함수를 저장하는 줄과 호출하는 줄을 구분해서 읽으세요. \u003ccode>connect(button)\u003c/code>은 기능을 연결하고 정리 방법을 돌려줍니다. \u003ccode>cleanup()\u003c/code>은 그 방법을 실제로 실행합니다. 정리 함수를 반환하기만 하고 아무도 호출하지 않으면 연결은 끝나지 않습니다.\u003c/p>\n\u003cp>한 번 해제된 등록을 같은 조건으로 다시 제거해도 removeEventListener는 아무 일도 하지 않습니다. 그래도 여러 자원을 정리하는 함수라면 두 번 호출해도 상태가 망가지지 않도록 설계하는 편이 좋습니다. 어떤 종료 경로에서 호출되었는지에 따라 서로 다른 결과가 나지 않게 하기 위해서입니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"ownership\">\u003ch2>연결을 만든 곳이 정리할 대상을 알고 있습니다\u003c/h2>\n\u003cp>앞 장의 bindSwitch는 두 가지 관계를 만듭니다. 하나는 입력의 change를 저장소에 전달하는 DOM 리스너이고, 다른 하나는 저장소 변경을 입력에 반영하는 구독입니다. 둘 중 하나만 해제하면 반대 방향은 계속 동작할 수 있습니다. 따라서 반환하는 정리 함수에서 둘 다 제거합니다.\u003c/p>\n\u003cpre>\u003ccode>const unsubscribe = store.subscribe(render);\ninput.addEventListener(\"change\", handleChange);\n\nreturn () =&gt; {\n  unsubscribe();\n  input.removeEventListener(\"change\", handleChange);\n};\u003c/code>\u003c/pre>\n\u003cp>구독 해제와 이벤트 제거는 같은 작업이 아닙니다. 첫째는 우리가 만든 저장소의 함수 목록에서 항목을 지우고, 둘째는 브라우저가 관리하는 리스너 등록을 지웁니다. 정리 함수는 성격이 다른 작업들을 “이번 연결을 끝낸다”는 하나의 목적 아래 모읍니다.\u003c/p>\n\u003cp>연결을 반복할 때도 같은 관점이 필요합니다. connect를 매번 호출하면 서로 다른 핸들러가 생기므로 한 번 클릭해도 여러 번 처리될 수 있습니다. 예제에서는 현재 연결의 정리 함수를 변수에 보관하고, 이미 연결되어 있으면 다시 연결하지 않습니다. 연결 해제 시 정리 함수를 호출한 뒤 그 변수를 null로 돌려 현재 연결이 없다는 사실을 나타냅니다.\u003c/p>\n\u003cp>어떤 값이 기능의 상태인지도 구분할 수 있습니다. 저장소의 checked는 알림 설정의 상태이고, cleanupConnection이 null인지 여부는 입력과 저장소가 연결되어 있는지의 상태입니다. 설정이 켜져 있어도 연결은 끊어질 수 있습니다. 서로 다른 사실을 한 boolean으로 표현하려고 하면 조건들이 뒤섞입니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"default-action\">\u003ch2>예약한 작업에는 나중이라는 시간이 있습니다\u003c/h2>\n\u003cp>타이머를 예약하면 콜백은 현재 함수가 끝난 뒤 나중에 실행될 수 있습니다. 그 사이에 연결이 해제되거나 대상 화면이 사라질 수도 있습니다. 따라서 타이머가 실행될 때까지 기능이 여전히 유효한지 생각해야 합니다. 정리할 때 clearTimeout으로 예약을 취소하거나, 실행 시 현재 연결 상태를 검사하는 이유입니다.\u003c/p>\n\u003cp>이 예제의 폼 reset은 이런 시간 관계를 보여줍니다. reset 이벤트는 브라우저가 입력을 기본값으로 돌리기 전에 발생합니다. 이벤트 핸들러 안에서 곧바로 현재 checked를 읽으면 아직 초기화 전 값일 수 있습니다. 우리는 브라우저가 기본 동작을 마친 뒤의 값을 저장소에 반영하고 싶습니다.\u003c/p>\n\u003cfigure class=\"concept-figure\">\u003cfigcaption>폼 초기화와 후속 동기화의 순서\u003c/figcaption>\u003cdiv class=\"flow\">\u003cspan>reset 이벤트\u003c/span> → \u003cspan>기본값으로 복원\u003c/span> → \u003cspan>나중 task에서 값 읽기\u003c/span> → \u003cspan>연결된 저장소 동기화\u003c/span>\u003c/div>\u003cp>reset이 취소되면 기본값 복원은 일어나지 않습니다. 연결이 끝났다면 후속 동기화도 하지 않습니다.\u003c/p>\u003c/figure>\n\u003cp>그래서 reset 핸들러는 setTimeout으로 읽기를 미루고, 정리 함수는 예약된 타이머를 취소합니다. 콜백에서는 연결이 아직 활성인지와 event.defaultPrevented도 확인합니다. 어떤 이벤트가 발생했다고 해서 그 이벤트의 기본 동작이 반드시 수행되는 것은 아니라는 4장의 개념과, 예약 작업의 실행 시점을 다룬 7장의 개념이 함께 쓰입니다.\u003c/p>\n\u003cp>이 처리를 모든 이벤트에 그대로 복사할 필요는 없습니다. 필요한 것은 값을 언제 읽어야 하는지와 그 사이에 어떤 변화가 가능한지를 구분하는 사고방식입니다. 특히 microtask를 예약했다고 항상 기본 동작 이후를 보장하는 것은 아니므로, 기본 동작이 끝난 값이 필요한 이 예제에서는 다음 task를 사용합니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"example\">\u003ch2>연결을 끊어 보면 각 책임이 드러납니다\u003c/h2>\n\u003cp>아래 입력은 처음 켜져 있습니다. 연결을 끊고 입력을 조작하면 브라우저의 기본 체크 동작은 계속되지만 저장소는 갱신되지 않습니다. 다시 연결하면 저장소 값으로 입력을 맞춥니다. 폼 값 읽기는 저장소가 아니라 실제 입력의 현재 상태를 읽으므로, 두 값의 기준이 서로 다르다는 점도 볼 수 있습니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-listener-cleanup\">11-1 · 리스너 정리\u003c/a>\u003ca href=\"#sample-binding-lifetime\">11-2 · 연결의 수명\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-listener-cleanup\" aria-labelledby=\"listener-title\">\n\u003ch3 id=\"listener-title\">11-1 · 같은 함수로 등록하고 제거하기\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 연결을 해제해도 버튼 자체가 비활성화될까요?\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton id=\"listener-toggle\" type=\"button\" aria-pressed=\"true\">클릭 리스너 연결\u003c/button>\u003cbutton id=\"listener-target\" type=\"button\">횟수 증가\u003c/button>\u003cbutton id=\"listener-reset\" type=\"button\">이 예제 다시 시작\u003c/button>\u003c/div>\n\u003cp id=\"listener-result\" role=\"status\">\u003c/p>\n\u003cpre>\u003ccode>function countClick() { count++; }\nbutton.addEventListener(\"click\", countClick);\nbutton.removeEventListener(\"click\", countClick);\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 연결 버튼을 꺼도 횟수 증가 버튼에는 포커스가 갑니다. 다만 등록했던 함수가 없어 횟수가 늘지 않습니다. 연결과 해제를 반복해도 한 번 누를 때 한 번만 늘어야 합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample stack\" id=\"sample-binding-lifetime\" aria-labelledby=\"demo-title\">\n    \u003ch3 id=\"demo-title\">11-2 · DOM 연결 해제와 브라우저 기본 동작\u003c/h3>\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 연결을 해제하고 체크를 끄면 저장소와 FormData는 같은 값을 읽을까요?\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton id=\"connect\" type=\"button\">다시 연결\u003c/button>\u003cbutton id=\"disconnect\" type=\"button\">연결 해제\u003c/button>\u003cspan id=\"connection\" class=\"status\" role=\"status\">\u003c/span>\u003c/div>\n    \u003cform id=\"settings\" class=\"stack\">\n      \u003clabel class=\"control\" for=\"notifications\">\u003cinput id=\"notifications\" type=\"checkbox\" role=\"switch\" name=\"notifications\" value=\"on\" checked>이메일 알림\u003c/label>\n      \u003cdiv class=\"row\">\u003cbutton type=\"submit\">폼 값 읽기\u003c/button>\u003cbutton type=\"reset\">기본값으로 초기화\u003c/button>\u003c/div>\n    \u003c/form>\n    \u003cdiv aria-live=\"polite\">\u003cp>저장소: \u003cspan id=\"summary\" class=\"status\">\u003c/span>\u003c/p>\u003cp>상태 변경 알림: \u003cspan id=\"notify-count\">0\u003c/span>회\u003c/p>\u003cpre id=\"form-result\">아직 폼 값을 읽지 않았습니다.\u003c/pre>\u003c/div>\n    \u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 연결을 해제하고 체크를 끄면 저장소는 켜짐을 유지하지만 폼에는 notifications가 없습니다. 다시 연결하면 입력은 저장소 값으로 돌아옵니다. 연결 중 초기화하면 기본 체크값과 저장소가 다시 맞춰집니다.\u003c/p>\n  \u003c/section>\n\u003cp>\u003ca href=\"main.js\">전체 연결과 폼 처리 코드\u003c/a> · \u003ca href=\"../shared/bind-switch.js\">DOM 연결의 정리 함수\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 · 연결을 끝내는 시점을 확인하기\u003c/summary>\u003cp>연결을 끊고 체크를 바꾼 뒤 저장소 문구와 폼 값을 각각 읽어보세요. 저장소가 갱신되지 않아도 폼 값이 달라지는 이유는 FormData가 읽는 대상이 DOM이기 때문입니다. 연결을 여러 번 반복한 뒤 한 번 조작했을 때 변경 알림이 한 번만 늘면 등록과 정리가 짝을 이루고 있는 것입니다.\u003c/p>\u003cp>코드를 수정해 보고 싶다면 연결 안에서 1초 후 로그를 남기는 타이머를 만들고 cleanup에서 취소해보세요. 정리는 변수 이름이 아니라 실제로 예약한 작업의 ID를 사용해야 합니다.\u003c/p>\u003c/details>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/removeEventListener\">MDN · 이벤트 리스너 제거\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Memory_management\">MDN · 메모리 관리\u003c/a>\u003c/p>\n\u003cnav>\u003ca href=\"../07-headless/\">← 10장 · 동작을 재사용하는 구조\u003c/a>\u003ca href=\"../\">차례로 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","08-lifecycle/main.js":"import { createSwitchStore } from \"../shared/switch-store.js\";\nimport { bindSwitch } from \"../shared/bind-switch.js\";\n\nconst input = document.querySelector(\"#notifications\");\nconst form = document.querySelector(\"#settings\");\nconst summary = document.querySelector(\"#summary\");\nconst notifyCount = document.querySelector(\"#notify-count\");\nconst connection = document.querySelector(\"#connection\");\nconst connectButton = document.querySelector(\"#connect\");\nconst disconnectButton = document.querySelector(\"#disconnect\");\nconst formResult = document.querySelector(\"#form-result\");\nconst store = createSwitchStore(input.defaultChecked);\nlet cleanupConnection = null;\nlet notifications = 0;\n\nfunction showState() {\n  summary.textContent = store.getState().checked ? \"켜짐\" : \"꺼짐\";\n  notifyCount.textContent = String(notifications);\n}\n\n// 화면의 저장소 표시 구독은 유지하고, 입력과의 연결만 붙였다 떼어봅니다.\nstore.subscribe(() => {\n  notifications += 1;\n  showState();\n});\n\nfunction showConnection() {\n  const connected = cleanupConnection !== null;\n  connection.textContent = connected ? \"연결됨\" : \"연결 해제됨\";\n  connectButton.disabled = connected;\n  disconnectButton.disabled = !connected;\n}\n\nfunction connect() {\n  if (cleanupConnection) return; // 중복 연결 방지\n  const unbind = bindSwitch(input, store);\n  let active = true;\n  let resetTimer;\n\n  function handleReset(event) {\n    // 다음 작업으로 미뤄 브라우저의 기본 reset이 끝난 값을 읽습니다.\n    // microtask는 이벤트의 기본 동작보다 먼저 실행될 수 있습니다.\n    clearTimeout(resetTimer);\n    resetTimer = setTimeout(() => {\n      if (!active || event.defaultPrevented) return;\n      store.setChecked(input.checked);\n    }, 0);\n  }\n\n  form.addEventListener(\"reset\", handleReset);\n  cleanupConnection = () => {\n    // 입력의 change 이벤트, 저장소 구독, 폼의 reset 이벤트 연결을 모두 해제합니다.\n    active = false;\n    clearTimeout(resetTimer);\n    unbind();\n    form.removeEventListener(\"reset\", handleReset);\n  };\n  showConnection();\n}\n\nfunction disconnect() {\n  if (!cleanupConnection) return;\n  cleanupConnection();\n  cleanupConnection = null;\n  showConnection();\n}\n\nconnectButton.addEventListener(\"click\", () => {\n  connect();\n  disconnectButton.focus();\n});\ndisconnectButton.addEventListener(\"click\", () => {\n  disconnect();\n  connectButton.focus();\n});\nform.addEventListener(\"submit\", (event) => {\n  event.preventDefault(); // 이 실습에서는 서버로 전송하지 않고 값만 확인합니다.\n  formResult.textContent = JSON.stringify([...new FormData(form).entries()], null, 2);\n});\n\nconnect();\nshowState();\n\n// 11-1 · 다른 예제와 관계없는 리스너 한 개를 등록하고 제거합니다.\nconst listenerToggle = document.querySelector(\"#listener-toggle\");\nconst listenerTarget = document.querySelector(\"#listener-target\");\nconst listenerResult = document.querySelector(\"#listener-result\");\nlet listenerConnected = true;\nlet listenerCount = 0;\nfunction showListener() {\n  listenerToggle.setAttribute(\"aria-pressed\", String(listenerConnected));\n  listenerResult.textContent = `${listenerConnected ? \"연결됨\" : \"연결 해제됨\"} · 호출 ${listenerCount}회`;\n}\nfunction countClick() {\n  listenerCount++;\n  showListener();\n}\nfunction setListenerConnected(next) {\n  listenerConnected = next;\n  if (next) listenerTarget.addEventListener(\"click\", countClick);\n  else listenerTarget.removeEventListener(\"click\", countClick);\n  showListener();\n}\nlistenerToggle.addEventListener(\"click\", () => setListenerConnected(!listenerConnected));\ndocument.querySelector(\"#listener-reset\").addEventListener(\"click\", () => {\n  listenerCount = 0;\n  setListenerConnected(true);\n});\nsetListenerConnected(true);\n","samples.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>개념별 예제 찾기 · 바닐라 JS와 DOM\u003c/title>\u003clink rel=\"stylesheet\" href=\"styles.css\">\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"index.html\">차례\u003c/a>\u003cp class=\"eyebrow\">SAMPLE INDEX / 한 번에 한 가지 개념\u003c/p>\u003ch1>작게 실행하고,\u003cbr>이유를 설명해보세요\u003c/h1>\u003cp class=\"intro\">11개 장, 35개의 독립 예제. 제목을 누르면 해당 예제로 바로 이동합니다. 처음 접하는 개념은 그 장의 본문을 먼저 읽어도 좋습니다.\u003c/p>\u003c/header>\n\u003cnav class=\"chapter-toc\" aria-label=\"장별 예제 목록\">\u003ca href=\"#01-javascript\">1장 · 값, 변수, 함수와 실행\u003c/a>\u003ca href=\"#02-dom\">2장 · HTML에서 DOM 객체까지\u003c/a>\u003ca href=\"#03-dom-update\">3장 · 문서의 내용과 현재 상태\u003c/a>\u003ca href=\"#04-events\">4장 · 이벤트가 전달되는 원리\u003c/a>\u003ca href=\"#05-dom-create\">5장 · DOM 트리의 생성과 변경\u003c/a>\u003ca href=\"#06-state-render\">6장 · 상태와 화면의 연결\u003c/a>\u003ca href=\"#09-browser-runtime\">7장 · 브라우저의 실행 순서\u003c/a>\u003ca href=\"#10-focus-forms\">8장 · 폼과 포커스의 기본 계약\u003c/a>\u003ca href=\"#11-accessibility\">9장 · 접근성의 의미와 동작\u003c/a>\u003ca href=\"#07-headless\">10장 · 동작을 재사용하는 구조\u003c/a>\u003ca href=\"#08-lifecycle\">11장 · 연결과 수명\u003c/a>\u003c/nav>\n\u003cp class=\"note\">실행 전에 결과를 예상하고, 한 가지 조작을 한 뒤 예상과 다른 이유를 찾아보세요. 각 예제는 자신의 상태를 사용합니다. 같은 예제 안에서 두 화면이 상태를 공유하는 경우에는 본문에 명시했습니다.\u003c/p>\n\n\u003csection class=\"concept\" id=\"01-javascript\">\u003ch2>\u003ca href=\"01-javascript/\">1장 · 값, 변수, 함수와 실행\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"01-javascript/#sample-assignment\">다시 대입하면 이전 계산도 바뀔까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"01-javascript/#sample-object-reference\">같은 객체를 가리키는 이름과 새 객체\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"01-javascript/#sample-function-call\">함수는 언제 실행될까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"01-javascript/#sample-closure\">두 카운터는 각각 무엇을 기억할까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"02-dom\">\u003ch2>\u003ca href=\"02-dom/\">2장 · HTML에서 DOM 객체까지\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"02-dom/#sample-dom-query\">하나, 목록, 없음은 어떻게 다를까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"02-dom/#sample-dom-nodes\">보이지 않는 공백도 자식일까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"02-dom/#sample-dom-reference\">요소가 바뀌면 저장한 글자도 바뀔까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"02-dom/#sample-dom-collections\">항목을 추가하면 어떤 개수가 바뀔까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"03-dom-update\">\u003ch2>\u003ca href=\"03-dom-update/\">3장 · 문서의 내용과 현재 상태\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"03-dom-update/#sample-update-text\">태그처럼 생긴 글자를 넣으면 어떻게 될까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"03-dom-update/#sample-update-defaults\">입력을 바꾸어도 기본값은 남을까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"03-dom-update/#sample-update-boolean\">disabled=\"false\"는 활성 상태일까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"03-dom-update/#sample-update-style\">data 속성만 바꾸면 색도 바뀔까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"04-events\">\u003ch2>\u003ca href=\"04-events/\">4장 · 이벤트가 전달되는 원리\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"04-events/#sample-dispatch\">dispatchEvent 뒤의 코드는 언제 실행될까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"04-events/#sample-propagation\">하나의 클릭을 세 위치에서 읽기\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"04-events/#sample-submit\">제출을 취소해도 부모가 알 수 있을까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"04-events/#sample-input-change\">입력 중, 입력 확정, 코드 대입 비교\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"05-dom-create\">\u003ch2>\u003ca href=\"05-dom-create/\">5장 · DOM 트리의 생성과 변경\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"05-dom-create/#sample-create-connect\">만든 요소는 언제 문서에 나타날까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"05-dom-create/#sample-create-identity\">다른 목록에 붙이면 이동할까요, 늘어날까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"05-dom-create/#sample-create-delegation\">나중에 생긴 버튼의 클릭은 누가 받을까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"06-state-render\">\u003ch2>\u003ca href=\"06-state-render/\">6장 · 상태와 화면의 연결\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"06-state-render/#sample-memory-dom\">메모리의 값만 바꾸면 화면은 어떨까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"06-state-render/#sample-derived-values\">세 값을 따로 기억할 필요가 있을까요?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"06-state-render/#sample-state-render\">입력 경로가 달라도 같은 상태 변경\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"09-browser-runtime\">\u003ch2>\u003ca href=\"09-browser-runtime/\">7장 · 브라우저의 실행 순서\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"09-browser-runtime/#sample-execution-order\">7-1 · 동기 실행과 예약된 실행\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"09-browser-runtime/#sample-dom-paint\">7-2 · DOM 객체의 값과 화면의 값\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"10-focus-forms\">\u003ch2>\u003ca href=\"10-focus-forms/\">8장 · 폼과 포커스의 기본 계약\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"10-focus-forms/#sample-focus\">8-1 · Tab 순서와 프로그램으로 옮기는 포커스\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"10-focus-forms/#sample-form-data\">8-2 · 화면의 입력과 제출되는 데이터는 다릅니다\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"10-focus-forms/#sample-form-reset\">8-3 · reset은 빈 값이 아니라 기본값으로 돌아갑니다\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"11-accessibility\">\u003ch2>\u003ca href=\"11-accessibility/\">9장 · 접근성의 의미와 동작\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"11-accessibility/#sample-native-keyboard\">click 리스너 하나로 키보드 활성화도 받을 수 있을까?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"11-accessibility/#sample-accessible-name\">입력값을 바꾸어도 입력의 이름은 그대로일까?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"11-accessibility/#sample-disclosure\">패널을 펼칠 때 함께 바꿔야 할 정보는 무엇일까?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"11-accessibility/#sample-live-status\">결과를 알리기 위해 반드시 포커스를 옮겨야 할까?\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"07-headless\">\u003ch2>\u003ca href=\"07-headless/\">10장 · 동작을 재사용하는 구조\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"07-headless/#sample-subscription\">10-1 · 함수 호출 횟수와 변경 알림 횟수\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"07-headless/#sample-shared-views\">10-2 · 같은 상태를 두 가지 모습으로 표현하기\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\n\u003csection class=\"concept\" id=\"08-lifecycle\">\u003ch2>\u003ca href=\"08-lifecycle/\">11장 · 연결과 수명\u003c/a>\u003c/h2>\n\u003cul class=\"sample-index\">\n\u003cli>\u003ca href=\"08-lifecycle/#sample-listener-cleanup\">11-1 · 같은 함수로 등록하고 제거하기\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"08-lifecycle/#sample-binding-lifetime\">11-2 · DOM 연결 해제와 브라우저 기본 동작\u003csmall>질문 → 실행 → 결과 해석\u003c/small>\u003c/a>\u003c/li>\u003c/ul>\u003c/section>\n\u003cnav aria-label=\"학습 안내\">\u003ca href=\"index.html\">차례로 돌아가기\u003c/a>\u003ca href=\"guide.html\">읽기 안내와 용어\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","guide.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>읽기 안내 · 바닐라 JS와 DOM\u003c/title>\u003clink rel=\"stylesheet\" href=\"styles.css\">\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\u003ca href=\"index.html\">차례\u003c/a>\n\u003ch1>바닐라 JS와 DOM — 읽기 안내\u003c/h1>\n\u003cp>이 자료는 JavaScript와 브라우저 문서 모델을 개념부터 설명하는 교재입니다. 각 장은 정의와 필요성, 작동 원리, 짧은 코드의 줄별 해설 순서로 이어집니다. JavaScript·DOM·이벤트·상태·브라우저 실행·폼·접근성·재사용을 11개 장으로 다룹니다. 실행 예제는 개념 본문 뒤에 있고, 코드를 수정하는 연습은 마지막에 선택 항목으로 접혀 있습니다.\u003c/p>\n\u003ch2>실행하기\u003c/h2>\n\u003cp>이 HTML 파일 안에 개념 본문과 설명을 확인할 예제가 들어 있습니다. 서버 실행이나 패키지 설치는 필요하지 않습니다.\u003c/p>\n\u003cp>\u003ca href=\"index.html\">차례\u003c/a>에서 읽을 장을 고르세요. 각 장은 개념과 작동 원리, 짧은 코드의 줄별 해설을 먼저 설명합니다. 동작 예제는 본문 뒤에 있습니다.\u003c/p>\n\u003cp>\u003ca href=\"samples.html\">개념별 예제 목록\u003c/a>에서는 작은 예제를 골라 해당 위치로 바로 이동할 수 있습니다.\u003c/p>\n\u003cp>코드를 더 살펴보고 싶을 때 \u003cstrong>코드 보기\u003c/strong>를 사용하고 수정한 내용은 \u003cstrong>예제에 적용\u003c/strong>으로 실행합니다. 브라우저를 새로고침하면 수정 내용은 초기화됩니다. 개발자 도구의 document를 관찰할 때는 본문이 표시된 iframe을 선택하세요.\u003c/p>\n\u003cp>본문의 index.html과 main.js는 원본 예제의 파일 이름입니다. 단일 파일 안의 코드 보기에서 읽고 수정할 수 있습니다.\u003c/p>\n\u003ch2>GitHub Pages 배포\u003c/h2>\n\u003cp>GitHub 저장소에서는 이 교재의 원본을 \u003ccode>docs/\u003c/code>에 보관합니다. \u003ccode>main\u003c/code>의 교재 파일이 변경되면 GitHub Actions가 테스트와 \u003ccode>npm run build:pages\u003c/code>를 실행하고 생성된 \u003ccode>docs/_site/\u003c/code>를 배포합니다. 이 로컬 교재 폴더에서는 \u003ccode>npm run build:pages\u003c/code>를 실행하면 \u003ccode>_site/\u003c/code>가 생성됩니다.\u003c/p>\n\u003cp>공개 첫 화면은 코드 편집기가 포함된 단일 HTML이며 기존 장별 주소와 \u003ccode>dist/vanilla-js-dom.html\u003c/code> 주소도 유지합니다. 미리보기 이미지와 빌드 스크립트는 배포 파일에서 제외합니다. Pages의 게시 방식은 \u003cstrong>GitHub Actions\u003c/strong>를 사용합니다.\u003c/p>\n\u003ch2>한 번에 한 가지 개념을 확인하기\u003c/h2>\n\u003col>\u003cli>\u003cstrong>개념:\u003c/strong> 무엇이고 왜 필요한지 먼저 읽습니다.\u003c/li>\u003cli>\u003cstrong>예상:\u003c/strong> 실행 전 질문에 자신의 답을 정합니다.\u003c/li>\u003cli>\u003cstrong>실행:\u003c/strong> 작은 예제에서 한 가지 조작을 합니다. 다른 예제의 상태에 영향을 주지 않습니다.\u003c/li>\u003cli>\u003cstrong>해석:\u003c/strong> 관찰할 결과와 비교하고 어떤 객체나 값이 바뀌었는지 설명합니다.\u003c/li>\u003c/ol>\n\u003cp>처음이라면 1–3장에서 언어와 DOM을 구분하고, 4–7장에서 이벤트·상태·실행 순서를 연결하세요. 8–9장은 폼·키보드·접근성의 기본 계약을, 10–11장은 재사용과 정리를 다룹니다. 익숙한 개념은 예제 목록에서 바로 골라도 좋습니다.\u003c/p>\n\u003cp>각 예제는 개별 상태를 가집니다. 반복 비교가 필요한 예제에는 초기화 버튼을 두었습니다. 장 전체를 처음 상태로 되돌리려면 단일 파일의 \u003cstrong>예제 다시 시작\u003c/strong>을 누르거나 원본 페이지를 새로고침합니다. 10장의 두 입력처럼 하나의 예제 안에서 상태를 공유하는 경우에는 공유 관계를 명시했습니다.\u003c/p>\n\u003ch2>처음에 구분할 세 가지\u003c/h2>\n\u003cp>\u003cstrong>JavaScript는 언어\u003c/strong>입니다. 값을 계산하고, 변수에 대입하고, 함수를 호출하는 규칙을 표현합니다. 엔진은 이 규칙을 실행합니다. 브라우저는 엔진이 사용할 수 있도록 문서와 이벤트, 타이머 등의 기능을 제공합니다.\u003c/p>\n\u003cp>\u003cstrong>DOM은 문서를 객체로 표현한 모델\u003c/strong>입니다. 브라우저가 HTML을 읽어 만든 노드들이 부모와 자식 관계로 연결됩니다. JavaScript는 DOM API를 호출해 이 구조를 찾고 바꿉니다. HTML 문자열을 편집하는 일, 실행 중인 DOM을 바꾸는 일, 화면에 픽셀을 그리는 일은 서로 다른 단계입니다.\u003c/p>\n\u003cp>\u003cstrong>바닐라 JavaScript는 별도 언어가 아닙니다.\u003c/strong> 여기서는 프레임워크를 거치지 않고 JavaScript와 브라우저의 기본 API를 사용하는 방식을 뜻합니다. HTML 안에 JavaScript를 넣어도 HTML이 프로그래밍 언어로 바뀌는 것은 아닙니다. 한 파일에 들어 있는 각 언어의 역할을 나누어 읽습니다.\u003c/p>\n\u003cp>참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model/Introduction\">MDN — DOM 소개\u003c/a>.\u003c/p>\n\u003ch2>읽는 순서\u003c/h2>\n\u003ch3>언어와 문서의 관계\u003c/h3>\n\u003cp>\u003ca href=\"01-javascript/\">1장 — 값, 변수, 함수와 실행\u003c/a>은 이름에 값을 대입하는 일과 함수를 실행하는 일을 설명합니다. 원시 값과 객체 참조, 콜백, 변수의 범위와 클로저를 이해하면 뒤에서 같은 함수와 상태를 여러 곳에서 사용하는 이유가 보입니다.\u003c/p>\n\u003cp>\u003ca href=\"02-dom/\">2장 — HTML에서 DOM 객체까지\u003c/a>는 HTML 문자열이 어떻게 문서 트리가 되는지 설명합니다. 요소를 찾았을 때 받는 것은 문자열 복사본이 아니라 실제 객체를 가리키는 참조입니다. Node와 Element, 부모와 자식, 선택자와 목록을 이 관점에서 읽습니다.\u003c/p>\n\u003cp>\u003ca href=\"03-dom-update/\">3장 — 문서의 내용과 현재 상태\u003c/a>는 HTML의 선언과 실행 중인 요소의 상태를 구분합니다. attribute와 property, 입력의 기본값과 현재값, 텍스트 교체와 스타일 적용이 서로 어떻게 연결되는지 설명합니다.\u003c/p>\n\u003ch3>문서에서 행동과 상태로\u003c/h3>\n\u003cp>\u003ca href=\"04-events/\">4장 — 이벤트가 행동을 전달하는 원리\u003c/a>는 등록된 함수가 어떤 과정을 거쳐 호출되는지 설명합니다. 이벤트 객체, 캡처와 버블링, target과 currentTarget, 전파와 기본 동작의 차이를 각각의 역할로 이해합니다.\u003c/p>\n\u003cp>\u003ca href=\"05-dom-create/\">5장 — DOM 트리의 생성과 변경\u003c/a>는 객체를 만드는 일과 문서에 연결하는 일을 구분합니다. 같은 노드의 이동과 새로운 노드의 복제, 제거된 객체의 참조, 부모에서 여러 자식의 이벤트를 처리하는 위임을 이어서 설명합니다.\u003c/p>\n\u003cp>\u003ca href=\"06-state-render/\">6장 — 상태와 화면의 연결\u003c/a>은 화면의 원본 데이터와 그 값에서 계산하는 표현을 구분합니다. 메모리의 값과 DOM이 자동으로 연결되지 않는 이유, 값을 바꾸는 경로를 모으는 이유, 누가 값을 결정할지 정하는 방법을 다룹니다.\u003c/p>\n\u003ch3>브라우저의 동작과 재사용 구조\u003c/h3>\n\u003cp>\u003ca href=\"09-browser-runtime/\">7장 — 브라우저의 실행 순서\u003c/a>는 동기 실행과 예약된 작업, task와 microtask, DOM 변경과 layout·paint의 관계를 설명합니다. 코드가 실행되는 순서와 사용자가 화면을 보는 시점을 구분합니다.\u003c/p>\n\u003cp>\u003ca href=\"10-focus-forms/\">8장 — 폼과 포커스의 기본 계약\u003c/a>은 브라우저가 기본 요소에 제공하는 행동을 설명합니다. 포커스와 선택, Tab 순서와 프로그램 이동, 폼 데이터의 이름과 포함 규칙, 현재값과 초기화의 관계를 다룹니다.\u003c/p>\n\u003cp>\u003ca href=\"11-accessibility/\">9장 — 접근성의 의미와 동작\u003c/a>은 DOM과 접근성 트리의 차이, 컨트롤의 이름·역할·상태·설명을 구분합니다. 네이티브 요소의 키보드 동작, label, 펼침 상태와 숨김, 포커스를 옮기지 않는 결과 알림을 각각 작은 예제로 확인합니다. ARIA가 실제 동작을 대신 구현하지 않는 이유도 설명합니다.\u003c/p>\n\u003cp>\u003ca href=\"07-headless/\">10장 — 동작을 재사용하는 구조\u003c/a>는 상태 계산, DOM 연결, 시각 표현을 분리하는 이유를 설명합니다. 저장소와 구독을 일반 객체와 함수의 관계로 읽고, 헤드리스와 프레임워크 독립이 각각 어떤 구분인지 연결합니다.\u003c/p>\n\u003cp>\u003ca href=\"08-lifecycle/\">11장 — 연결과 수명\u003c/a>은 등록한 함수가 왜 남는지, 정리 함수가 무엇을 기억하는지 설명합니다. 기능을 시작하고 끝내는 일, 여러 연결을 한 책임으로 묶는 일, 예약한 작업의 취소를 앞 장들의 개념으로 해석합니다.\u003c/p>\n\u003ch2>용어를 읽는 기준\u003c/h2>\n\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">용어\u003c/th>\u003cth scope=\"col\">이 교재에서 뜻하는 것\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>값\u003c/td>\u003ctd>프로그램이 계산하거나 저장하는 데이터\u003c/td>\u003c/tr>\u003ctr>\u003ctd>참조\u003c/td>\u003ctd>특정 객체에 접근할 수 있게 하는 값\u003c/td>\u003c/tr>\u003ctr>\u003ctd>속성(property)\u003c/td>\u003ctd>객체에 이름을 붙여 보관한 값\u003c/td>\u003c/tr>\u003ctr>\u003ctd>메서드(method)\u003c/td>\u003ctd>객체를 통해 호출하는 함수\u003c/td>\u003c/tr>\u003ctr>\u003ctd>API\u003c/td>\u003ctd>다른 코드가 기능을 사용할 수 있도록 공개한 약속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상태(state)\u003c/td>\u003ctd>현재 상황을 나타내며 시간에 따라 바뀔 수 있는 데이터\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이벤트(event)\u003c/td>\u003ctd>발생한 사실을 전달하는 객체와 전달 과정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>콜백(callback)\u003c/td>\u003ctd>다른 코드가 호출할 수 있도록 전달한 함수\u003c/td>\u003c/tr>\u003ctr>\u003ctd>구독(subscription)\u003c/td>\u003ctd>변화가 있을 때 호출할 함수를 등록하는 관계\u003c/td>\u003c/tr>\u003ctr>\u003ctd>접근 가능한 이름\u003c/td>\u003ctd>보조 기술이 요소를 식별하는 데 사용하는 이름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>포커스(focus)\u003c/td>\u003ctd>현재 키보드 입력을 받을 위치\u003c/td>\u003c/tr>\u003ctr>\u003ctd>접근성 트리\u003c/td>\u003ctd>브라우저가 보조 기술에 노출할 의미와 상태를 구성한 표현\u003c/td>\u003c/tr>\u003ctr>\u003ctd>정리(cleanup)\u003c/td>\u003ctd>기능의 필요가 끝났을 때 등록과 예약을 해제하는 작업\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\n\u003ch2>이 교재와 디자인 시스템의 관계\u003c/h2>\n\u003cp>디자인 시스템의 헤드리스 동작을 구현할 때는 브라우저가 이미 제공하는 규칙과 직접 작성해야 할 규칙을 구분해야 합니다. 이 책의 언어·DOM·이벤트·상태·포커스 개념은 그 판단의 바탕입니다. 마지막 두 장은 이 지식을 재사용 가능한 코드 구조로 묶는 출발점입니다.\u003c/p>\n\u003cp>복잡한 Dialog의 포커스 제어, 메뉴의 키보드 탐색, 화면 밖으로 나가지 않는 위치 계산 등은 각각 추가 설계가 필요한 주제입니다. 기본 개념을 알고 나면 이 기능들도 관련된 상태, 요소, 이벤트, 연결 수명으로 나누어 이해할 수 있습니다.\u003c/p>\n\u003ch2>접근성을 직접 확인하기\u003c/h2>\n\u003cp>마우스를 내려놓고 Tab·Shift+Tab으로 이동하며 포커스가 보이는지 확인합니다. 버튼은 Enter와 Space, 체크박스는 Space로 조작합니다. 펼침 예제는 열림 상태와 실제 표시가 일치하고, 숨겨진 내용에는 Tab이 들어가지 않아야 합니다. 결과 알림 예제에서는 실행한 버튼에 포커스가 남아야 합니다.\u003c/p>\n\u003cp>스크린 리더에서는 이름·역할·상태·설명이 전달되는지 확인합니다. 접근성 패널의 속성 확인과 실제 낭독 검사는 별개의 확인입니다. 브라우저와 보조 기술의 조합에 따라 표현과 안내 시점이 다를 수 있으며, 이 교재의 예제만으로 전체 접근성 적합성을 판정하지는 않습니다.\u003c/p>\n\u003cp>개념의 근거: \u003ca href=\"https://www.w3.org/WAI/tutorials/page-structure/\">WAI — 페이지 구조\u003c/a>, \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/practices/names-and-descriptions/\">WAI — 이름과 설명\u003c/a>, \u003ca href=\"https://www.w3.org/WAI/ARIA/apg/patterns/disclosure/\">WAI — 펼침 패턴\u003c/a>. 각 장 아래에도 관련 공식 문서를 연결했습니다.\u003c/p>\n\u003cnav>\u003ca href=\"index.html\">차례로 돌아가기\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>"},"lessons":[["01-javascript","1장 · 값, 변수, 함수와 실행"],["02-dom","2장 · HTML에서 DOM 객체까지"],["03-dom-update","3장 · 문서의 내용과 현재 상태"],["04-events","4장 · 이벤트가 전달되는 원리"],["05-dom-create","5장 · DOM 트리의 생성과 변경"],["06-state-render","6장 · 상태와 화면의 연결"],["09-browser-runtime","7장 · 브라우저의 실행 순서"],["10-focus-forms","8장 · 폼과 포커스의 기본 계약"],["11-accessibility","9장 · 접근성의 의미와 동작"],["07-headless","10장 · 동작을 재사용하는 구조"],["08-lifecycle","11장 · 연결과 수명"]]}</script>
  <script>
  (() => {
    "use strict";
    const { files, lessons } = JSON.parse(document.querySelector("#course-data").textContent);
    const frame = document.querySelector("#lesson-frame");
    const picker = document.querySelector("#lesson-picker");
    const notice = document.querySelector("#notice");
    const dialog = document.querySelector("#source-dialog");
    const sourceSelect = document.querySelector("#source-file");
    const editor = document.querySelector("#source-editor");
    const editorStatus = document.querySelector("#editor-status");
    const overrides = new Map();
    let drafts = new Map();
    let route = "index.html";
    let routeAnchor = "";
    let focusAfterNavigation = false;
    let editingPath = "";
    let editingLesson = "";

    for (const [dir, label] of lessons) picker.add(new Option(label, `${dir}/index.html`));
    picker.add(new Option("개념별 예제 찾기", "samples.html"));
    picker.add(new Option("읽기 안내와 용어 정리", "guide.html"));
    const pages = new Set([...picker.options].map(option => option.value));
    const read = path => overrides.has(path) ? overrides.get(path) : files[path];
    const safeJSON = value => JSON.stringify(value).replace(/</g, "\\u003c");

    function resolve(href, from) {
      const url = new URL(href, `https://course.invalid/${from}`);
      if (url.origin !== "https://course.invalid") return null;
      const path = decodeURIComponent(url.pathname.slice(1));
      return path.endsWith("/") || !path ? `${path}index.html` : path;
    }

    // 이 교재에서 사용하는 로컬 named import를 하나의 스크립트로 묶습니다.
    function bundle(entry, visited = new Set()) {
      if (visited.has(entry)) return "";
      if (!Object.hasOwn(files, entry)) throw new Error(`포함되지 않은 파일입니다: ${entry}`);
      visited.add(entry);
      let prefix = "";
      let source = read(entry).replace(/^\s*import\s*\{[^}]+\}\s*from\s*["']([^"']+)["'];?\s*$/gm, (_, specifier) => {
        const dependency = resolve(specifier, entry);
        if (!dependency) throw new Error("외부 모듈은 이 오프라인 실습에서 불러올 수 없습니다.");
        prefix += bundle(dependency, visited) + "\n";
        return "";
      });
      if (/^\s*(?:import\s|export\s+(?:default|\{))/m.test(source)) {
        throw new Error("이 실습은 포함된 파일의 named import와 함수·변수 export를 지원합니다.");
      }
      source = source.replace(/^\s*export\s+(?=(?:function|const|let|class)\b)/gm, "");
      return prefix + source;
    }

    function frameBridge(page, anchor, focusPage) {
      const send = (type, data) => parent.postMessage({ course: "vanilla-js-dom", type, page, ...data }, "*");
      function focusSection(id) {
        const target = document.getElementById(id);
        if (!target) return;
        const focusTarget = target.querySelector("h1, h2, h3") || target;
        if (!focusTarget.hasAttribute("tabindex")) focusTarget.tabIndex = -1;
        focusTarget.focus({ preventScroll: true });
        target.scrollIntoView({ block: "start" });
      }
      window.addEventListener("message", event => {
        if (event.source === parent && event.data?.course === "vanilla-js-dom" && event.data.type === "focus-content") {
          focusSection("main-content");
        }
      });
      window.addEventListener("load", () => {
        if (anchor || focusPage) focusSection(anchor || "main-content");
      });
      document.addEventListener("click", event => {
        const link = event.target instanceof Element ? event.target.closest("a[href]") : null;
        if (!link) return;
        const href = link.getAttribute("href");
        if (href.startsWith("#")) {
          event.preventDefault();
          let id;
          try { id = decodeURIComponent(href.slice(1)); } catch { return; }
          focusSection(id);
          return;
        }
        if (/^https?:/i.test(href)) { link.target = "_blank"; link.rel = "noopener noreferrer"; return; }
        event.preventDefault();
        send("navigate", { href });
      });
      window.addEventListener("error", event => send("error", { message: event.message }));
      window.addEventListener("unhandledrejection", event => send("error", { message: String(event.reason) }));
    }

    function showNotice(message, error = false) {
      notice.textContent = message;
      notice.classList.toggle("error", error);
    }

    function render() {
      try {
        const doc = new DOMParser().parseFromString(read(route), "text/html");
        for (const link of doc.querySelectorAll('link[rel="stylesheet"]')) {
          const path = resolve(link.getAttribute("href"), route);
          if (!Object.hasOwn(files, path)) throw new Error(`포함되지 않은 스타일 파일: ${path}`);
          const style = doc.createElement("style");
          style.textContent = read(path);
          link.replaceWith(style);
        }
        const scripts = [];
        for (const script of doc.querySelectorAll("script")) {
          const code = script.src ? bundle(resolve(script.getAttribute("src"), route)) : script.textContent;
          scripts.push(script.type === "module" ? '"use strict";\n' + code : code);
          script.remove();
        }
        const bridge = doc.createElement("script");
        bridge.textContent = `(${frameBridge.toString()})(${safeJSON(route)}, ${safeJSON(routeAnchor)}, ${focusAfterNavigation});`;
        doc.body.append(bridge);
        for (const code of scripts) {
          const script = doc.createElement("script");
          script.textContent = code.replace(/<\/script/gi, "<\\/script");
          doc.body.append(script);
        }
        frame.srcdoc = "<!doctype html>\n" + doc.documentElement.outerHTML;
        focusAfterNavigation = false;
        frame.title = doc.title || "본문과 예제";
        document.title = doc.title.includes("바닐라 JS와 DOM") ? doc.title : `${doc.title} · 바닐라 JS와 DOM`;
        picker.value = route;
        showNotice(overrides.size ? "수정한 예제 코드로 실행 중 · 파일을 새로고침하면 원본으로 돌아갑니다." : "본문을 먼저 읽고, 장 끝의 예제로 설명한 흐름을 확인할 수 있습니다.");
      } catch (error) {
        showNotice(`코드를 확인해주세요: ${error.message}`, true);
      }
    }

    function navigate(next, anchor = "") {
      if (!pages.has(next)) return;
      focusAfterNavigation = true;
      const hash = `#${next}${anchor ? `#${encodeURIComponent(anchor)}` : ""}`;
      if (location.hash === hash) { route = next; routeAnchor = anchor; render(); }
      else location.hash = hash;
    }

    function loadRoute() {
      let requested;
      try { requested = decodeURIComponent(location.hash.slice(1)); } catch { requested = ""; }
      const [path, anchor = ""] = requested.split("#");
      route = pages.has(path) ? path : "index.html";
      routeAnchor = pages.has(path) ? anchor : "";
      render();
    }

    function loadEditorFile(path) {
      editingPath = path;
      sourceSelect.value = path;
      editor.value = drafts.has(path) ? drafts.get(path) : read(path);
      editorStatus.textContent = "";
    }

    function openSource(requested) {
      drafts = new Map();
      const owner = requested?.replace(/main\.js$/, "index.html");
      editingLesson = requested?.endsWith("/main.js") && pages.has(owner) ? owner : route;
      const main = route.replace(/index\.html$/, "main.js");
      const paths = [...new Set([
        ...(Object.hasOwn(files, main) ? [main] : []), route,
        ...(route.startsWith("07-") || route.startsWith("08-") ? ["shared/switch-store.js", "shared/bind-switch.js"] : []),
        "styles.css", ...(requested ? [requested] : []),
      ])];
      sourceSelect.replaceChildren(...paths.map(path => new Option(path, path)));
      loadEditorFile(requested || paths[0]);
      dialog.showModal();
    }

    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow || event.data?.course !== "vanilla-js-dom" || event.data.page !== route) return;
      if (event.data.type === "error") { showNotice(`실습 코드 오류: ${event.data.message}`, true); return; }
      if (event.data.type !== "navigate" || typeof event.data.href !== "string") return;
      let target, anchor;
      try {
        target = resolve(event.data.href, route);
        anchor = decodeURIComponent(new URL(event.data.href, `https://course.invalid/${route}`).hash.slice(1));
      } catch { return; }
      if (pages.has(target)) navigate(target, anchor);
      else if (Object.hasOwn(files, target)) openSource(target);
    });
    picker.addEventListener("change", () => navigate(picker.value));
    window.addEventListener("hashchange", loadRoute);
    document.querySelector("#open-source").addEventListener("click", () => openSource());
    document.querySelector("#close-source").addEventListener("click", () => dialog.close());
    document.querySelector("#rerun").addEventListener("click", render);
    document.querySelector("#skip-lesson").addEventListener("click", event => {
      event.preventDefault();
      frame.contentWindow.postMessage({ course: "vanilla-js-dom", type: "focus-content" }, "*");
    });
    editor.addEventListener("input", () => { drafts.set(editingPath, editor.value); editorStatus.textContent = "아직 예제에 적용하지 않은 수정입니다."; });
    sourceSelect.addEventListener("change", () => loadEditorFile(sourceSelect.value));
    document.querySelector("#apply-source").addEventListener("click", () => {
      for (const [path, value] of drafts) {
        if (value === files[path]) overrides.delete(path);
        else overrides.set(path, value);
      }
      dialog.close();
      if (editingLesson !== route) navigate(editingLesson);
      else render();
    });
    document.querySelector("#restore-source").addEventListener("click", () => {
      drafts.set(editingPath, files[editingPath]);
      editor.value = files[editingPath];
      editorStatus.textContent = "원본을 불러왔습니다. 예제에 적용하면 복원됩니다.";
    });
    loadRoute();
  })();
  </script>
</body>
</html>

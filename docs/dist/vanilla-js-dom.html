  <script id="course-data" type="application/json">{"files":{"index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>바닐라 JS와 DOM · 개념부터 읽기\u003c/title>\u003clink rel=\"stylesheet\" href=\"styles.css\">\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader class=\"home-hero\">\u003cdiv>\u003cp class=\"eyebrow\">VANILLA JS / 개념부터 읽기\u003c/p>\u003ch1>바닐라 JS로 배우는\u003cbr>\u003cspan>웹의 기본 원리\u003c/span>\u003c/h1>\u003cp class=\"intro\">프레임워크 없이 JavaScript와 브라우저의 기본 API를 배웁니다. 값과 함수에서 DOM, 이벤트, 접근성까지 작은 예제로 웹의 작동 원리를 이해합니다.\u003c/p>\u003cp class=\"course-meta\">\u003cspan>11개의 이야기\u003c/span>\u003cspan>35개의 작은 실험\u003c/span>\u003c/p>\u003c/div>\n\u003cdiv class=\"hero-note\" aria-hidden=\"true\">\u003cdiv class=\"note-label\">\u003cspan>ONE SMALL CHANGE\u003c/span>\u003cspan class=\"js-mark\">JS\u003c/span>\u003c/div>\u003cdiv class=\"note-code\">\u003cem>const\u003c/em> message = \"안녕, DOM\";\u003cbr>\u003cbr>element.textContent\u003cbr>&nbsp; = message;\u003c/div>\u003cdiv class=\"note-result\">안녕, DOM\u003c/div>\u003cp class=\"note-caption\">한 줄의 코드가 문서에 닿는 순간.\u003c/p>\u003c/div>\u003c/header>\n\u003cdiv class=\"sample-links home-actions\">\u003ca href=\"#contents\">11개 장 순서대로 읽기\u003c/a>\u003ca href=\"samples.html\">개념별 예제 모아보기\u003c/a>\u003ca href=\"11-accessibility/\">접근성부터 살펴보기\u003c/a>\u003c/div>\n\u003csection aria-labelledby=\"start-title\">\u003ch2 id=\"start-title\">지금 궁금한 질문에서 시작해도 좋습니다\u003c/h2>\n\u003col class=\"learning-route\">\n\u003cli>\u003cstrong>언어와 문서 구분하기\u003c/strong>\u003cp>변수를 바꾸면 화면도 바뀔까? DOM은 HTML 문자열일까?\u003c/p>\u003ca href=\"01-javascript/\">1–3장 · 값과 DOM\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>변화의 원인 따라가기\u003c/strong>\u003cp>누가 함수를 호출하고, 어느 값을 기준으로 화면을 그릴까?\u003c/p>\u003ca href=\"04-events/\">4–7장 · 이벤트와 상태\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>누구나 조작할 수 있게 만들기\u003c/strong>\u003cp>키보드로 쓰고, 의미를 전달하고, 연결을 정리하려면?\u003c/p>\u003ca href=\"10-focus-forms/\">8–11장 · 폼, 접근성, 재사용\u003c/a>\u003c/li>\n\u003c/ol>\n\u003c/section>\n\u003csection class=\"learning-goals\" aria-labelledby=\"study-method\">\u003ch2 id=\"study-method\">예제를 읽는 네 단계\u003c/h2>\u003cp>\u003cstrong>개념 읽기 → 결과 예상 → 한 가지 조작 → 이유 설명.\u003c/strong> 각 예제는 작은 질문 하나에 집중합니다. 코드가 작동하는 것을 확인한 뒤 “어떤 값이, 누구의 호출로, 언제 바뀌었는가”를 자신의 말로 설명해보세요. 예상 결과와 다르면 그 차이가 다음에 읽을 개념입니다.\u003c/p>\u003c/section>\n\u003csection class=\"concept\" id=\"three-layers\">\n\u003ch2>먼저, 화면 뒤에 있는 세 가지를 구분합니다\u003c/h2>\n\u003cp>웹페이지에 “안녕하세요”라는 글자가 보인다고 해봅시다. 그 글자는 HTML 파일에 적힌 문자열일 수도 있고, 페이지를 연 다음 JavaScript가 새로 넣은 내용일 수도 있습니다. 같은 모습이어도 내용이 만들어진 과정은 다릅니다. 이 과정을 이해하려면 \u003cstrong>파일에 적힌 문서, 브라우저가 기억하는 문서, 실제로 그려진 화면\u003c/strong>을 구분해야 합니다.\u003c/p>\n\u003cp>HTML은 문서의 구조와 의미를 적는 언어입니다. \u003ccode>&lt;p&gt;안녕하세요&lt;/p&gt;\u003c/code>는 한 문단을 선언합니다. 브라우저는 이 문자열을 읽고 p 요소와 그 안의 텍스트를 나타내는 객체들을 만듭니다. 이렇게 연결한 문서 객체의 구조를 \u003cstrong>DOM(Document Object Model)\u003c/strong>이라고 부릅니다. DOM은 웹페이지의 문서를 프로그램에서 다룰 수 있도록 표현한 모델입니다.\u003c/p>\n\u003cp>브라우저는 DOM의 요소와 CSS 규칙을 바탕으로 위치, 크기, 색 등을 계산해 화면을 그립니다. 따라서 DOM은 화면의 픽셀 자체가 아닙니다. 화면을 구성하는 데 사용하는 문서의 상태이며, JavaScript가 읽거나 바꿀 수 있는 대상입니다. DOM을 바꿔도 원래 디스크에 있던 HTML 파일의 내용까지 수정되는 것은 아닙니다.\u003c/p>\n\u003cfigure class=\"concept-figure\">\u003cfigcaption>문서가 화면이 되는 흐름\u003c/figcaption>\u003cdiv class=\"flow\">\u003cspan>HTML 문자열\u003c/span> → \u003cspan>파싱: 구조를 읽기\u003c/span> → \u003cspan>DOM 객체 트리\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan>DOM + CSS\u003c/span> → \u003cspan>위치와 모양 계산\u003c/span> → \u003cspan>화면에 그리기\u003c/span>\u003c/div>\u003cp>JavaScript는 DOM API를 통해 가운데의 객체들을 읽거나 변경합니다.\u003c/p>\u003c/figure>\n\u003c/section>\n\u003csection class=\"concept\" id=\"language-and-browser\">\n\u003ch2>JavaScript와 DOM은 같은 것이 아닙니다\u003c/h2>\n\u003cp>\u003cstrong>JavaScript는 계산과 실행 규칙을 표현하는 프로그래밍 언어\u003c/strong>입니다. 변수에 값을 담고, 함수를 호출하고, 조건에 따라 다른 작업을 실행하는 규칙이 언어에 속합니다. 숫자를 더하는 데 문서는 필요하지 않습니다. 이 언어를 실행하는 엔진은 브라우저 안에도 있고, 웹페이지가 없는 다른 실행 환경에도 있습니다.\u003c/p>\n\u003cp>브라우저는 JavaScript가 웹 문서를 다룰 수 있도록 \u003ccode>document\u003c/code> 같은 객체와 문서 조작 기능을 제공합니다. 프로그램에서 기능을 사용할 수 있도록 공개한 약속을 \u003cstrong>API\u003c/strong>라고 합니다. DOM API에는 요소를 찾거나, 텍스트를 바꾸거나, 자식 요소를 추가하는 기능이 들어 있습니다. JavaScript 문법으로 이 기능을 호출하는 것이 DOM 프로그래밍입니다.\u003c/p>\n\u003cp>\u003cstrong>바닐라 JavaScript\u003c/strong>는 별도의 언어나 패키지 이름이 아닙니다. 여기서는 프레임워크 없이 JavaScript 언어와 브라우저의 기본 API를 사용하는 방식을 뜻합니다. HTML 파일 하나에 CSS와 JavaScript를 함께 넣을 수 있지만, 같은 파일 안에 있다고 세 언어의 역할이 합쳐지는 것은 아닙니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"one-change\">\n\u003ch2>세 줄의 코드를 문장으로 읽어봅니다\u003c/h2>\n\u003cpre>\u003ccode>&lt;p id=\"greeting\"&gt;처음 문구&lt;/p&gt;\u003c/code>\u003c/pre>\n\u003cp>브라우저가 위 HTML을 읽은 뒤, 다음 JavaScript를 실행한다고 가정합니다.\u003c/p>\n\u003cpre>\u003ccode>let message = \"안녕하세요\";\nconst paragraph = document.querySelector(\"#greeting\");\nparagraph.textContent = message;\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>\u003cstrong>첫 줄은 값을 준비합니다.\u003c/strong> 문자열 “안녕하세요”를 message라는 이름으로 사용할 수 있게 합니다. 이 줄만으로는 문서를 바꾸지 않습니다.\u003c/li>\u003cli>\u003cstrong>둘째 줄은 문서 속 객체를 찾습니다.\u003c/strong> querySelector는 조건에 맞는 첫 요소를 반환하는 DOM 메서드입니다. 메서드는 객체를 통해 호출하는 함수입니다. #greeting은 id가 greeting인 요소를 찾는 CSS 선택자이며, paragraph에는 HTML 문자열의 복사본이 아니라 그 요소를 가리키는 참조가 들어갑니다.\u003c/li>\u003cli>\u003cstrong>셋째 줄은 그 객체의 내용을 바꿉니다.\u003c/strong> textContent는 요소의 텍스트 내용을 다루는 속성입니다. 값을 대입하면 DOM이 변경되고 브라우저가 이후 화면 갱신에 반영합니다.\u003c/li>\u003c/ol>\n\u003cp>이제 message에 다른 값을 대입한다고 paragraph의 내용까지 저절로 다시 계산되는 것은 아닙니다. JavaScript는 실행된 명령이 만든 결과를 유지합니다. 새 값을 화면에 쓰려면 문서를 변경하는 명령을 다시 실행해야 합니다. 뒤의 상태와 화면 장에서는 이 연결을 왜 함수로 모으는지 설명합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"reading-route\">\n\u003ch2>이 책이 이어지는 순서\u003c/h2>\n\u003cp>처음 두 장은 \u003cstrong>코드를 실행하는 쪽인 JavaScript\u003c/strong>와 \u003cstrong>조작할 대상인 DOM\u003c/strong>을 각각 설명합니다. 다음 장들은 문서를 바꾸는 방법, 사용자 행동을 전달받는 방법, 그 변화의 기준이 되는 상태를 다룹니다. 브라우저의 실행 순서, 폼·포커스, 접근성의 이름·역할·상태까지 이해한 뒤에는 같은 동작을 재사용하는 구조와 연결의 수명을 읽을 수 있습니다.\u003c/p>\n\u003cp>각 장의 앞부분은 정의와 원리를 설명하는 본문입니다. 작은 코드를 줄마다 해설한 다음 한 가지 규칙에 집중한 독립 예제와 관찰할 결과를 보여줍니다. 코드를 수정하는 연습은 장 끝에 접어 두었습니다. 본문을 읽는 동안 문제를 먼저 풀 필요는 없습니다.\u003c/p>\n\u003c/section>\n\u003ch2 id=\"contents\">차례\u003c/h2>\n\u003col class=\"lesson-list\">\n\u003cli>\u003ca href=\"01-javascript/\">\u003cstrong>1 · 값, 변수, 함수와 실행\u003c/strong>\u003cspan>이름에 값을 대입한다는 뜻, 객체 참조, 함수 호출과 클로저\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"02-dom/\">\u003cstrong>2 · HTML에서 DOM 객체까지\u003c/strong>\u003cspan>파싱과 객체 트리, Node와 Element, 선택자와 참조\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"03-dom-update/\">\u003cstrong>3 · 문서의 내용과 현재 상태\u003c/strong>\u003cspan>attribute와 property, 기본값과 현재값, CSS가 상태를 표현하는 방식\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"04-events/\">\u003cstrong>4 · 이벤트가 행동을 전달하는 원리\u003c/strong>\u003cspan>리스너 등록과 호출, 전파 경로, 브라우저 기본 동작\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"05-dom-create/\">\u003cstrong>5 · DOM 트리의 생성과 변경\u003c/strong>\u003cspan>객체 만들기와 문서 연결하기, 노드의 동일성, 이동·복제·제거\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"06-state-render/\">\u003cstrong>6 · 상태와 화면을 연결하는 이유\u003c/strong>\u003cspan>원본 데이터와 파생값, DOM과 메모리, 변경 경로와 상태 소유\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"09-browser-runtime/\">\u003cstrong>7 · 브라우저는 언제 실행하고 그리는가\u003c/strong>\u003cspan>호출 스택, task와 microtask, DOM 변경과 화면 갱신\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"10-focus-forms/\">\u003cstrong>8 · 폼과 포커스의 기본 계약\u003c/strong>\u003cspan>키보드 입력의 위치, 순차 탐색, 폼 데이터와 기본값\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"11-accessibility/\">\u003cstrong>9 · 접근성의 의미와 동작\u003c/strong>\u003cspan>DOM과 접근성 트리, 이름·역할·상태, 키보드, 펼침과 결과 알림\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"07-headless/\">\u003cstrong>10 · 동작을 재사용하는 헤드리스 구조\u003c/strong>\u003cspan>로직과 표현의 분리, 저장소와 구독, DOM을 연결하는 경계\u003c/span>\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"08-lifecycle/\">\u003cstrong>11 · 연결에는 수명이 있다\u003c/strong>\u003cspan>등록한 함수가 남는 이유, 정리 함수와 클로저, 예약 작업의 종료\u003c/span>\u003c/a>\u003c/li>\n\u003c/ol>\n\u003cp>\u003ca href=\"samples.html\">작은 예제만 골라보기 →\u003c/a>\u003c/p>\n\u003cdetails id=\"open-guide\">\u003csummary>파일과 예제 이용 안내\u003c/summary>\n\u003cp>인터넷 연결이나 서버 없이 이 HTML 파일 하나를 브라우저에서 열면 됩니다.\u003c/p>\n\u003cp>본문을 읽은 다음 각 장 뒤의 예제로 설명한 흐름을 확인할 수 있습니다. 위쪽의 \u003cstrong>코드 보기\u003c/strong>에서 HTML·CSS·JavaScript를 읽고 수정한 다음 \u003cstrong>예제에 적용\u003c/strong>을 누르면 됩니다. 수정 내용은 현재 열린 동안만 유지되며, 파일을 다시 열거나 새로고침하면 원본으로 돌아갑니다.\u003c/p>\n\u003cp>\u003cstrong>예제 다시 시작\u003c/strong>은 수정한 코드를 유지한 채 현재 예제의 동작 상태만 초기화합니다. 개발자 도구를 사용할 때는 본문이 표시된 프레임을 선택하세요.\u003c/p>\u003c/details>\n\u003cp class=\"muted\">\u003ca href=\"guide.html\">읽기 안내와 용어 정리\u003c/a> · 참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model/Introduction\">MDN · DOM 소개\u003c/a>\u003c/p>\n\u003c/main>\u003c/body>\u003c/html>\n","styles.css":":root {\n  color-scheme: light;\n  --bg: #f7f8f4;\n  --surface: #ffffff;\n  --ink: #20382f;\n  --muted: #637268;\n  --line: #dce4d9;\n  --control-line: #8b9c8e;\n  --accent: #28654e;\n  --accent-hover: #1c4d3b;\n  --soft: #edf3eb;\n  --code: #eef1eb;\n  --highlight: #edf2c8;\n  --shadow: 0 4px 20px #233c2e05;\n  font: 16px/1.85 -apple-system, BlinkMacSystemFont, \"Segoe UI\", \"Apple SD Gothic Neo\", \"Malgun Gothic\", sans-serif;\n  background: var(--bg);\n  color: var(--ink);\n}\n* { box-sizing: border-box; }\n[hidden] { display: none !important; }\nhtml { scroll-padding-top: 28px; }\nbody { margin: 0; }\nmain { width: min(920px, 100%); margin: auto; padding: 60px 32px 80px; }\na { color: var(--accent); text-underline-offset: 5px; text-decoration-color: #91b09a; }\na:hover { color: var(--accent-hover); text-decoration-color: currentColor; }\nh1, h2, h3, h4, p { margin: 0; }\nh1, h2, h3, h4 { word-break: keep-all; overflow-wrap: anywhere; }\nh1 { font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.35; letter-spacing: -.055em; font-weight: 750; margin: 18px 0 22px; }\nh2 { font-size: 1.3rem; line-height: 1.5; letter-spacing: -.025em; margin: 36px 0 16px; }\nh3 { font-size: 1.05rem; line-height: 1.6; margin: 20px 0 12px; }\nh4 { font-size: .95rem; margin: 12px 0 8px; }\np { word-break: keep-all; overflow-wrap: anywhere; }\np + p { margin-top: 14px; }\nheader { margin-bottom: 32px; }\nheader > a:first-child { font-size: .88rem; }\n.eyebrow { display: flex; align-items: center; gap: 9px; font-size: .73rem; font-weight: 650; letter-spacing: .09em; color: var(--accent); margin-top: 12px; }\n.eyebrow::before { content: \"\"; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }\n.intro { font-size: 1.04rem; color: #526458; line-height: 1.9; max-width: 66ch; }\n.muted, small { color: var(--muted); }\nstrong { font-weight: 650; }\n.demo { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; margin: 24px 0; box-shadow: var(--shadow); }\n.demo > :first-child { margin-top: 0; }\n.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }\n.stack { display: grid; gap: 16px; }\ninput[type=\"text\"] { font: inherit; color: var(--ink); background: #fcfdfa; border: 1px solid var(--control-line); border-radius: 9px; padding: 9px 13px; min-height: 44px; width: min(100%, 360px); }\n.is-found { outline: 3px solid var(--accent); outline-offset: 4px; }\n.task-list { padding: 0; list-style: none; display: grid; gap: 12px; }\n.task-list li { display: flex; gap: 16px; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line); }\n.task-list span { overflow-wrap: anywhere; min-width: 0; }\n.task-list button { flex-shrink: 0; }\n.control { display: flex; align-items: center; gap: 12px; width: fit-content; min-height: 48px; }\ninput[type=\"checkbox\"] { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); flex-shrink: 0; }\nbutton { font: inherit; font-size: .9rem; font-weight: 550; color: var(--ink); background: var(--surface); border: 1px solid var(--control-line); border-radius: 9px; padding: 9px 16px; min-height: 44px; cursor: pointer; transition: background 150ms, border-color 150ms; }\nbutton:hover { background: var(--soft); border-color: var(--accent); }\nbutton:disabled { cursor: default; opacity: .55; }\n:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }\n.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }\n.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }\ncode, pre { font-family: \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace; }\ncode { font-size: .88em; overflow-wrap: anywhere; }\n:not(pre) > code { padding: .12em .35em; border: 1px solid #dee7d9; border-radius: 5px; background: var(--soft); color: #335e46; }\npre { margin: 18px 0; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--code); color: #364d3e; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .86rem; line-height: 1.8; }\npre:has(> code) { padding: 24px; border-color: #293e33; background: #1e3028; color: #dfebde; box-shadow: inset 0 1px 0 #ffffff0a; }\npre > code { font-size: inherit; }\noutput { font-variant-numeric: tabular-nums; }\n.status { display: inline-block; color: var(--accent); font-weight: 650; }\n.note { padding: 16px 20px; border-left: 3px solid #8ca474; background: #eff2e8; border-radius: 0 10px 10px 0; margin: 24px 0; color: #4f6251; }\n.lesson-list { list-style: none; padding: 0; display: grid; gap: 10px; }\n.lesson-list a { display: block; position: relative; background: var(--surface); border: 1px solid var(--line); padding: 20px 48px 20px 24px; border-radius: 12px; text-decoration: none; box-shadow: var(--shadow); transition: border-color 150ms, background 150ms; }\n.lesson-list a::after { content: \"↗\"; position: absolute; right: 22px; top: 24px; color: #819580; font-size: 1.1rem; }\n.lesson-list a:hover { border-color: #92ae91; background: #fcfdf8; }\n.lesson-list strong { display: block; color: var(--ink); font-size: .98rem; }\n.lesson-list span { display: block; margin-top: 5px; color: var(--muted); font-size: .87rem; }\ntable { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: .95rem; }\ncaption { text-align: left; color: var(--muted); font-size: .85rem; padding-bottom: 12px; }\nth, td { text-align: left; padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }\nthead { background: var(--soft); }\nth { font-weight: 650; }\nnav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; margin-top: 40px; border-top: 1px solid var(--line); padding-top: 24px; font-size: .92rem; }\nli + li { margin-top: 8px; }\n.lesson-list li + li { margin-top: 0; }\n.two-views { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }\ninput.styled-switch { appearance: none; width: 48px; height: 28px; border: 2px solid var(--muted); border-radius: 20px; background: var(--code); padding: 3px; }\ninput.styled-switch::before { content: \"\"; display: block; width: 18px; height: 18px; border-radius: 50%; background: var(--muted); transition: transform 150ms; }\ninput.styled-switch[data-state=\"checked\"] { background: var(--accent); border-color: var(--accent); }\ninput.styled-switch[data-state=\"checked\"]::before { background: #fff; transform: translateX(20px); }\n.flow { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; margin: 20px 0; color: #7b917f; }\n.flow span { background: var(--soft); border: 1px solid #dce6d5; border-radius: 8px; padding: 7px 12px; color: #36543e; font-size: .9rem; }\ndetails { margin: 20px 0; }\nsummary { cursor: pointer; color: var(--accent); }\n.concept { margin: 44px 0; scroll-margin-top: 28px; }\n.concept > h2:first-child { margin-top: 0; }\n.concept p { max-width: 76ch; }\n.chapter-toc { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 24px; margin: 28px 0 40px; padding: 22px 24px; border: 1px solid var(--line); border-radius: 12px; background: #fdfefb; }\n.chapter-toc a { text-decoration: none; }\n.chapter-toc a:hover { text-decoration: underline; }\n.chapter-toc > h2, .chapter-toc > h3, .chapter-toc > ol, .chapter-toc > ul { grid-column: 1 / -1; }\n.chapter-toc h2, .chapter-toc h3 { margin: 0 0 8px; font-size: .95rem; }\n.chapter-toc ol, .chapter-toc ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 26px; margin: 8px 0 0; padding-left: 20px; font-size: .9rem; }\n.chapter-toc li + li { margin-top: 0; }\n.line-explanation { margin: 20px 0 28px; padding-left: 24px; }\n.line-explanation li { padding-left: 6px; }\n.line-explanation li::marker { color: var(--accent); font-weight: 650; }\n.line-explanation li + li { margin-top: 14px; }\n.concept-figure { margin: 28px 0; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }\n.concept-figure figcaption { font-weight: 650; font-size: .92rem; margin-bottom: 14px; }\n.concept-figure p { color: var(--muted); font-size: .9rem; }\n.concept-figure .flow { margin: 12px 0; }\n.optional-practice { border-top: 1px solid var(--line); margin-top: 40px; padding: 24px 0; }\n.optional-practice > summary { font-weight: 650; }\n.optional-practice[open] > summary { margin-bottom: 18px; }\n.skip-link { position: fixed; z-index: 10; top: 12px; left: 12px; padding: 10px 16px; background: var(--surface); border: 2px solid var(--accent); border-radius: 8px; transform: translateY(-180%); }\n.skip-link:focus { transform: translateY(0); }\n.learning-goals { padding: 24px 28px; border: 1px solid #dce5cf; border-left: 4px solid #7c9b64; border-radius: 0 12px 12px 0; background: #eff3e8; margin: 28px 0; }\n.learning-goals h2, .learning-goals h3 { margin-top: 0; font-size: 1.04rem; }\n.learning-goals p, .learning-goals li { font-size: .94rem; }\n.learning-route { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 0; list-style: none; counter-reset: route; }\n.learning-route li { display: flex; flex-direction: column; align-items: flex-start; padding: 24px 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); counter-increment: route; margin: 0; box-shadow: var(--shadow); }\n.learning-route li::before { content: \"0\" counter(route); display: grid; place-items: center; width: 35px; height: 35px; border-radius: 9px; color: var(--accent); background: var(--soft); font: 600 .8rem/1 ui-monospace, monospace; margin-bottom: 20px; }\n.learning-route li:nth-child(2)::before { background: #f4eedc; color: #79612d; }\n.learning-route li:nth-child(3)::before { background: #eaf0f4; color: #476a7b; }\n.learning-route strong { display: block; font-size: 1rem; line-height: 1.65; word-break: keep-all; }\n.learning-route p { font-size: .87rem; color: var(--muted); margin: 10px 0 20px; }\n.learning-route a { margin-top: auto; font-size: .82rem; font-weight: 600; }\n.sample { scroll-margin-top: 28px; margin: 32px 0; }\n.sample > h3 { font-size: 1.17rem; letter-spacing: -.025em; margin-top: 12px; }\n.sample-meta { display: inline-block; padding: 3px 10px; border-radius: 5px; background: var(--soft); color: #516c54; font-size: .75rem; margin-bottom: 4px; }\n.prediction { padding: 14px 18px; border-left: 3px solid #b5bd85; background: #f7f8ee; border-radius: 0 8px 8px 0; margin: 18px 0; font-size: .93rem; }\n.expected { padding: 18px 20px; background: var(--soft); border: 1px solid #e0e8d9; border-radius: 10px; margin-top: 20px; font-size: .93rem; }\n.sample-links { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 8px 12px; margin: 24px 0; padding: 16px 20px; background: #ffffffa6; border: 1px solid var(--line); border-radius: 12px; font-size: .85rem; }\n.sample-links a { padding: 3px 0; }\n.sample-index { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }\n.sample-index li { margin: 0; }\n.sample-index a { display: block; height: 100%; padding: 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); text-decoration: none; color: var(--ink); font-weight: 600; font-size: .95rem; box-shadow: var(--shadow); transition: background 150ms, border-color 150ms; }\n.sample-index a:hover { border-color: #92ae91; background: #fcfdf8; }\n.sample-index small { display: block; margin-top: 12px; font-size: .76rem; font-weight: 400; }\nfieldset { min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 18px; }\nlegend { font-weight: 650; }\n/* 첫 화면은 작은 학습 노트 표지처럼, 본문은 차분한 읽기 폭을 유지합니다. */\n.home-hero { display: grid; grid-template-columns: minmax(0, 1fr) 228px; gap: 32px; align-items: center; padding-bottom: 28px; border-bottom: 1px solid var(--line); }\n.home-hero h1 { font-size: clamp(2rem, 4.5vw, 3.05rem); }\n.home-hero h1 span { color: var(--accent); }\n.home-hero .intro { font-size: .96rem; }\n.course-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: .77rem; margin-top: 22px; }\n.course-meta span + span { padding-left: 14px; border-left: 1px solid #becdba; }\n.hero-note { position: relative; padding: 22px; border: 1px solid #d8e2ca; border-radius: 14px; background: #edf2dd; box-shadow: 5px 6px 0 #e2e9d8; transform: rotate(2deg); }\n.hero-note .note-label { display: flex; align-items: center; justify-content: space-between; font: 600 .68rem/1.5 ui-monospace, monospace; color: #536744; letter-spacing: .06em; padding-bottom: 18px; border-bottom: 1px solid #cdd8bd; }\n.hero-note .js-mark { display: grid; place-items: center; background: #d9e69a; color: #344625; width: 29px; height: 29px; border-radius: 6px; font-size: .76rem; letter-spacing: 0; }\n.hero-note .note-code { margin: 20px 0; font: .75rem/2 ui-monospace, monospace; color: #38513b; }\n.hero-note .note-code em { font-style: normal; color: #667d49; }\n.hero-note .note-result { border: 1px solid #d6e0c6; border-radius: 8px; padding: 12px; background: #fbfcf5; font-size: .85rem; color: #415c3e; }\n.hero-note .note-caption { margin-top: 14px; color: #647353; font-size: .69rem; }\n.home-actions { padding: 0; border: 0; background: none; gap: 10px; margin: 28px 0 40px; }\n.home-actions a { display: inline-flex; align-items: center; min-height: 44px; padding: 9px 15px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); text-decoration: none; font-size: .84rem; font-weight: 600; }\n.home-actions a:first-child { background: var(--accent); border-color: var(--accent); color: #fff; }\n.home-actions a:hover { background: var(--soft); color: var(--accent-hover); border-color: #92ae91; }\n.home-actions a:first-child:hover { background: var(--accent-hover); color: #fff; }\n@media (max-width: 700px) {\n  .home-hero { grid-template-columns: minmax(0, 1fr); gap: 0; }\n  .hero-note { display: none; }\n  .learning-route { gap: 10px; }\n  .learning-route li { padding: 20px 16px; }\n}\n@media (max-width: 580px) {\n  main { padding: 32px 20px 52px; }\n  h1 { font-size: 2rem; }\n  .home-hero h1 { font-size: 2.25rem; }\n  .demo { padding: 20px; }\n  pre, pre:has(> code) { padding: 18px; font-size: .8rem; }\n  .two-views { grid-template-columns: 1fr; gap: 16px; }\n  th, td { padding: 12px 6px; font-size: .88rem; }\n  .chapter-toc ol, .chapter-toc ul { grid-template-columns: 1fr; }\n  .chapter-toc { grid-template-columns: 1fr; padding: 20px; }\n  .learning-route, .sample-index { grid-template-columns: 1fr; }\n  .learning-route li { padding: 22px; }\n  .learning-route li::before { margin-bottom: 12px; }\n  .learning-route p { margin-bottom: 14px; }\n  .learning-goals { padding: 20px; }\n  .concept-figure { padding: 20px; }\n  .home-actions { margin: 24px 0 32px; }\n}\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { transition: none !important; }\n}\n@media (forced-colors: active) {\n  input.styled-switch { appearance: auto; width: 20px; height: 20px; padding: 0; }\n  input.styled-switch::before { display: none; }\n  pre:has(> code), .primary, .home-actions a:first-child { border: 1px solid ButtonText; }\n}\n","shared/switch-store.js":"// 이 파일은 DOM을 읽거나 바꾸지 않습니다. 값 저장과 변경 알림만 관리합니다.\nexport function createSwitchStore(initialChecked = false) {\n  if (typeof initialChecked !== \"boolean\") {\n    throw new TypeError(\"initialChecked는 boolean이어야 합니다.\");\n  }\n\n  // 상태를 직접 고치지 못하도록 고정합니다. 값이 바뀔 때 새 객체를 만듭니다.\n  let state = Object.freeze({ checked: initialChecked });\n  const listeners = new Set();\n\n  function getState() {\n    // 읽을 때마다 새 객체를 만들지 않습니다. 상태가 같으면 같은 객체입니다.\n    return state;\n  }\n\n  function setChecked(checked) {\n    if (typeof checked !== \"boolean\") {\n      throw new TypeError(\"checked는 boolean이어야 합니다.\");\n    }\n    if (state.checked === checked) return;\n\n    state = Object.freeze({ checked });\n    for (const listener of listeners) {\n      listener(state);\n    }\n  }\n\n  function subscribe(listener) {\n    listeners.add(listener);\n    // 등록 시에는 호출하지 않습니다. 첫 화면을 그리는 일은 연결 코드가 합니다.\n    return () => listeners.delete(listener);\n  }\n\n  function reset() {\n    setChecked(initialChecked);\n  }\n\n  return { getState, setChecked, subscribe, reset };\n}\n","shared/bind-switch.js":"// 상태 저장소와 실제 \u003cinput type=\"checkbox\" role=\"switch\">를 연결합니다.\nexport function bindSwitch(input, store) {\n  function render() {\n    const { checked } = store.getState();\n    // 현재 선택 여부는 HTML 속성이 아니라 DOM 프로퍼티로 읽고 씁니다.\n    input.checked = checked;\n    // CSS는 이 속성을 보고 선택 상태의 모양을 바꿀 수 있습니다.\n    input.dataset.state = checked ? \"checked\" : \"unchecked\";\n  }\n\n  function handleChange() {\n    // 클릭과 Space 키 처리는 브라우저가 담당합니다. 바뀐 결과만 읽습니다.\n    store.setChecked(input.checked);\n  }\n\n  input.addEventListener(\"change\", handleChange);\n  const unsubscribe = store.subscribe(render);\n  render();\n\n  let cleanedUp = false;\n  return function cleanup() {\n    if (cleanedUp) return;\n    cleanedUp = true;\n    // 연결을 끊을 때는 DOM 이벤트와 저장소 구독을 모두 해제합니다.\n    input.removeEventListener(\"change\", handleChange);\n    unsubscribe();\n  };\n}\n","01-javascript/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>1장 · 값, 변수, 함수와 실행\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">1장 · 값, 변수, 함수와 실행\u003c/p>\u003ch1>JavaScript는 값을 어떻게 다룰까요?\u003c/h1>\u003cp class=\"intro\">코드가 값을 만들고, 이름에 연결하고, 함수를 호출하는 과정을 이해합니다. 브라우저를 다루기 전에 실행의 기본 모델부터 잡습니다.\u003c/p>\u003c/header>\n\u003csection class=\"learning-goals\" aria-labelledby=\"learning-goals-title\">\u003ch2 id=\"learning-goals-title\">값과 계산을 구분하는 기준\u003c/h2>\u003cul>\u003cli>변수에 재대입하는 것과 객체의 속성을 수정하는 것을 구분합니다.\u003c/li>\u003cli>함수 자체와 함수의 반환값을 구분하고 실행 시점을 설명합니다.\u003c/li>\u003cli>클로저가 어떤 변수에 접근하는지 호출별로 추적합니다.\u003c/li>\u003c/ul>\u003c/section>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#language-runtime\">언어와 실행 환경\u003c/a>\u003ca href=\"#values-bindings\">값과 변수\u003c/a>\u003ca href=\"#execution-flow\">실행 흐름\u003c/a>\u003ca href=\"#reading-code\">한 줄씩 읽기\u003c/a>\u003ca href=\"#value-identity\">값과 객체\u003c/a>\u003ca href=\"#functions-scope\">함수와 범위\u003c/a>\u003ca href=\"#live-example\">작은 예제 4개\u003c/a>\u003c/nav>\n\u003csection class=\"concept\" id=\"language-runtime\">\u003ch2>JavaScript는 무엇이고, 어디에서 실행될까요?\u003c/h2>\n\u003cp>JavaScript는 값을 표현하고, 그 값으로 계산하고, 수행할 작업의 순서를 정하는 프로그래밍 언어입니다. “이름에 인사말을 붙인다”, “현재 개수에 하나를 더한다”, “조건에 맞을 때만 함수를 실행한다” 같은 규칙을 코드로 적을 수 있습니다. 코드는 그 자체로 화면이 아니며, 파일에 적힌 글자가 실행 환경에 전달되어야 실제 작업이 일어납니다.\u003c/p>\n\u003cp>언어의 규칙을 해석하고 실행하는 것은 JavaScript 엔진입니다. 브라우저는 이 엔진을 포함하면서 문서, 네트워크, 타이머처럼 웹페이지에 필요한 기능도 제공합니다. 엔진과 주변 기능을 포함하여 코드가 돌아가는 환경을 런타임이라고 부릅니다. 같은 JavaScript 언어라도 어디에서 실행하느냐에 따라 사용할 수 있는 주변 기능이 달라집니다.\u003c/p>\n\u003cp>예를 들어 숫자 두 개를 더하는 코드는 브라우저와 Node.js에서 모두 실행할 수 있습니다. 하지만 현재 웹 문서를 뜻하는 \u003ccode>document\u003c/code>는 브라우저 환경이 제공하는 객체입니다. 일반적인 Node.js 실행에는 웹페이지의 document가 없습니다. 따라서 JavaScript를 배운다는 것은 언어의 계산 규칙을 이해하는 일이고, DOM을 배운다는 것은 그 언어로 브라우저의 문서 기능을 사용하는 법을 이해하는 일입니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"values-bindings\">\u003ch2>값에 이름을 붙여야 하는 이유\u003c/h2>\n\u003cp>프로그램이 다루는 정보는 값으로 표현됩니다. 이름은 문자열, 완료한 개수는 숫자, 완료 여부는 불리언 값으로 나타낼 수 있습니다. 값에 이름을 붙이면 계산 도중의 결과를 다시 사용하고, 지금 어떤 정보를 다루는지 설명할 수 있습니다. 이 이름과 값의 연결이 변수입니다. 변수를 단순한 상자라고 생각해도 시작하는 데 도움이 되지만, 객체를 배울 때는 “이 이름이 어떤 값을 가리키는가”로 생각하는 편이 정확합니다.\u003c/p>\n\u003cp>\u003ccode>let completed = 0\u003c/code>은 completed라는 이름을 선언하고 숫자 0을 초기값으로 연결합니다. 뒤에서 \u003ccode>completed = 1\u003c/code>을 실행하면 같은 이름에 다른 값을 다시 대입합니다. 반면 const로 선언한 이름에는 다른 값을 다시 대입할 수 없습니다. let과 const의 차이는 값의 종류가 아니라 이름과 값의 연결을 바꿀 수 있는지에 있습니다.\u003c/p>\n\u003cp>대입은 수학의 등식과 다릅니다. \u003ccode>completed = completed + 1\u003c/code>은 양쪽이 영원히 같다는 선언이 아닙니다. 오른쪽에서 현재 값을 읽고 1을 더한 다음, 계산 결과를 왼쪽 이름에 저장하라는 작업입니다. 이미 그 값으로 만든 다른 문자열까지 거슬러 올라가 다시 계산하지는 않습니다. 화면도 별도의 코드를 통해 변경해야 합니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"execution-flow\">\u003ch2>실행은 값을 계산하고 다음 작업으로 이동하는 과정\u003c/h2>\n\u003cp>코드에서 값을 만들어내는 부분을 표현식이라고 합니다. \u003ccode>1 + 2\u003c/code>, \u003ccode>learner.name\u003c/code>, \u003ccode>describe(\"지우\", 1)\u003c/code>은 각각 계산, 속성 읽기, 함수 호출을 통해 값을 만듭니다. 프로그램은 이러한 표현식을 선언과 문장 안에 배치하여 작업을 구성합니다. 변수를 선언하고, 함수를 호출하고, 조건에 따라 분기하는 식으로 실행 흐름을 만듭니다.\u003c/p>\n\u003cp>한 작업 안에서도 순서가 있습니다. 함수에 전달할 표현식은 함수 본문으로 들어가기 전에 계산됩니다. 함수를 호출하면 실행은 잠시 그 함수 본문으로 이동하고, 함수가 끝나면 호출했던 자리 다음으로 돌아옵니다. return은 함수의 실행을 끝내면서 호출한 쪽에 값을 건네는 역할을 합니다. 명시적으로 값을 반환하지 않은 함수의 결과는 undefined입니다.\u003c/p>\n\u003cp>브라우저에서 외부 스크립트를 불러올 때는 파일 실행 시점도 필요합니다. 이 장은 \u003ccode>&lt;script defer src=\"main.js\"&gt;\u003c/code>로 파일을 연결합니다. 일반 외부 스크립트의 defer는 HTML을 읽는 동안 파일을 가져오되 문서 파싱이 끝난 뒤 실행하도록 합니다. 언어의 순서와 브라우저가 스크립트를 시작하는 시점은 서로 다른 문제입니다. 나중에 이벤트를 배우면 이미 실행을 마친 코드가 사용자 행동을 받아 다시 함수를 호출하는 과정까지 이어집니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"reading-code\">\u003ch2>작은 코드가 실행되는 과정을 한 줄씩 읽기\u003c/h2>\n\u003cp>아래 코드는 화면 없이도 완결되는 계산입니다. 함수 선언의 본문과 실제로 실행되는 시점을 분리해서 읽어보면, 단순히 위에서 아래로 눈을 옮기는 것보다 실행 순서가 선명해집니다.\u003c/p>\n\u003cpre>\u003ccode>let completed = 0;\nfunction describe(count) {\n  return `${count}개 완료`;\n}\ncompleted = completed + 1;\nconst message = describe(completed);\nconsole.log(message);\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>\u003cstrong>1행:\u003c/strong> completed라는 이름을 만들고 숫자 0을 초기값으로 연결합니다.\u003c/li>\n\u003cli>\u003cstrong>2행:\u003c/strong> describe라는 함수를 정의합니다. count는 나중에 호출할 때 전달받을 값의 이름입니다.\u003c/li>\n\u003cli>\u003cstrong>3행:\u003c/strong> 호출되었을 때 문자열을 만들어 반환할 작업입니다. 함수가 정의되었다고 이 줄이 즉시 실행되지는 않습니다.\u003c/li>\n\u003cli>\u003cstrong>4행:\u003c/strong> 함수 본문의 경계를 닫습니다. 함수 정의와 그 아래의 실제 계산을 구분합니다.\u003c/li>\n\u003cli>\u003cstrong>5행:\u003c/strong> 현재 값 0을 읽고 1을 더한 뒤 completed에 1을 다시 대입합니다.\u003c/li>\n\u003cli>\u003cstrong>6행:\u003c/strong> completed의 현재 값 1을 함수에 전달합니다. 함수 안의 count가 1이 되고, 반환된 “1개 완료”라는 문자열을 message에 연결합니다.\u003c/li>\n\u003cli>\u003cstrong>7행:\u003c/strong> 실행 환경의 console 기능에 문자열을 전달해 출력합니다. Console 출력 자체가 HTML 문서를 바꾸지는 않습니다.\u003c/li>\n\u003c/ol>\n\u003cp>이후 completed에 2를 대입해도 message는 “1개 완료”로 남습니다. message에는 함수 호출을 계속 추적하는 규칙이 아니라, 그때 호출하여 얻은 문자열이 들어 있기 때문입니다. 새 문구가 필요하면 함수를 다시 호출해야 합니다. 계산 결과와 계산 방법을 구분하는 것이 이후 DOM 갱신을 이해하는 출발점입니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"value-identity\">\u003ch2>원시 값을 바꾸는 것과 객체를 수정하는 것은 다릅니다\u003c/h2>\n\u003cp>숫자·문자열·불리언 같은 원시 값 자체는 내부를 수정하는 대상이 아닙니다. 문자열에 글자를 붙이면 기존 문자열을 늘리는 것이 아니라 새 문자열을 얻습니다. \u003ccode>let saved = completed\u003c/code>로 숫자를 다른 이름에 대입한 뒤 completed에 새 숫자를 넣어도 saved는 그대로입니다. 두 이름 사이에 자동 동기화 관계가 생기지 않습니다.\u003c/p>\n\u003cp>객체는 여러 속성을 묶은 값이며, 자신만의 정체성을 갖습니다. 배열도 객체의 한 종류입니다. 객체를 다른 변수에 대입하면 객체 전체를 복제하는 대신 같은 객체를 가리키게 됩니다. \u003ccode>const original = { done: false }; const alias = original;\u003c/code> 뒤에 \u003ccode>alias.done = true\u003c/code>를 실행하면 original.done도 true입니다. 두 이름을 통해 같은 객체의 속성을 읽고 있기 때문입니다.\u003c/p>\n\u003cp>여기서 const의 의미가 분명해집니다. \u003ccode>alias = 다른객체\u003c/code>는 금지되어도 \u003ccode>alias.done = true\u003c/code>는 이름을 다른 값에 연결하는 작업이 아니므로 가능합니다. 또한 내용이 같은 객체를 따로 만들면 별개의 객체입니다. 객체의 \u003ccode>===\u003c/code> 비교는 속성 내용이 같은지보다 같은 객체를 가리키는지를 확인합니다. DOM에서 요소를 찾았을 때도 이런 참조를 받게 되므로, 이 구분이 다음 장으로 이어집니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"functions-scope\">\u003ch2>함수는 작업을 전달하고, 범위는 값을 보관합니다\u003c/h2>\n\u003cp>함수도 JavaScript의 값입니다. 변수에 담거나 다른 함수에 전달할 수 있습니다. 함수 이름만 쓴 \u003ccode>describe\u003c/code>는 함수를 가리키며, 괄호를 붙인 \u003ccode>describe(1)\u003c/code>은 그 함수를 지금 실행한 결과를 뜻합니다. 다른 함수에 전달되어 그 함수가 호출할 작업을 콜백이라고 부릅니다. 콜백은 별도 종류의 함수 문법이 아니라 그 함수가 맡은 역할입니다.\u003c/p>\n\u003cp>예를 들어 \u003ccode>run(describe)\u003c/code>는 run에게 함수를 전달합니다. run이 언제 호출하는지는 run의 구현에 달려 있습니다. 반면 \u003ccode>run(describe(1))\u003c/code>은 먼저 describe를 실행하고 그 결과 문자열을 전달합니다. 콜백이 항상 나중이나 비동기로 실행되는 것은 아닙니다. 함수 전달, 함수 호출, 호출 결과 전달은 서로 다른 작업입니다.\u003c/p>\n\u003cp>함수 안에서 이름을 읽을 때는 그 함수가 코드상 어디에서 정의되었는지가 중요합니다. 자기 범위에 없는 이름은 바깥 범위에서 찾습니다. 이 이름 탐색 규칙을 어휘적 범위, 즉 lexical scope라고 합니다. 호출한 곳의 변수 이름이 우연히 같다고 그 값을 사용하는 것이 아닙니다. 블록 안의 let·const, 함수의 매개변수처럼 이름을 사용할 수 있는 영역이 정해져 있습니다.\u003c/p>\n\u003cpre>\u003ccode>function createCounter() {\n  let count = 0;\n  return function next() {\n    count += 1;\n    return count;\n  };\n}\nconst next = createCounter();\u003c/code>\u003c/pre>\n\u003cp>createCounter를 호출하면 그 호출에 속한 count가 생깁니다. 반환된 next 함수는 자신이 정의된 바깥 범위의 count에 접근합니다. 바깥 함수의 실행이 끝나도 next를 통해 그 변수에 접근할 수 있는 관계가 유지됩니다. 함수와 이 주변 범위의 결합을 클로저라고 합니다. 그래서 next를 한 번 호출하면 1, 다시 호출하면 2를 반환할 수 있습니다. 매번 처음부터 새 count를 만드는 것이 아닙니다.\u003c/p>\n\u003cp>createCounter를 다시 호출하면 별개의 count와 함수가 만들어집니다. 한편 반환된 함수를 다른 변수에 대입하면 새 카운터가 생기는 것이 아니라 기존 함수를 함께 가리킵니다. 클로저는 초기 값을 얼려 놓은 사진도 아닙니다. 같은 변수의 이후 값을 계속 읽을 수 있습니다. 이런 방식으로 필요한 값만 함수 내부에 보관하면, 문서나 전역 변수에 의존하지 않는 작은 상태 관리 기능을 만들 수 있습니다.\u003c/p>\n\u003cp>지금까지의 핵심은 값, 이름, 객체, 실행을 구분하는 것입니다. 값은 계산의 결과이고, 변수는 그 값에 접근하는 이름이며, 객체는 공유할 수 있는 정체성을 갖습니다. 함수는 호출해야 작업을 실행하고, 필요한 값은 그 함수가 정의된 범위를 통해 이어집니다. 브라우저 화면을 다루는 코드도 이 언어 규칙 위에서 동작합니다.\u003c/p>\n\u003cp class=\"muted\">더 읽기: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Introduction\">MDN · JavaScript 소개\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Closures\">MDN · 클로저\u003c/a>.\u003c/p>\n\u003c/section>\n\u003csection id=\"live-example\">\u003ch2>한 번에 한 가지씩 실행하기\u003c/h2>\n\u003cp>먼저 결과를 예상한 다음 버튼을 눌러보세요. 각 예제는 별개의 값을 사용합니다. 버튼과 결과 표시는 실험을 위한 DOM 코드이고, 코드 상자 안의 계산은 문서 없이도 실행할 수 있는 JavaScript입니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-assignment\">1. 대입과 계산 결과\u003c/a> · \u003ca href=\"#sample-object-reference\">2. 객체 참조\u003c/a> · \u003ca href=\"#sample-function-call\">3. 함수 전달과 호출\u003c/a> · \u003ca href=\"#sample-closure\">4. 클로저\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-assignment\" aria-labelledby=\"assignment-title\">\n\u003cp class=\"sample-meta\">예제 1-1 · 값과 이름\u003c/p>\u003ch3 id=\"assignment-title\">다시 대입하면 이전 계산도 바뀔까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> count에 2를 대입한 뒤 saved와 message는 어떤 값을 가질까요?\u003c/p>\n\u003cpre>\u003ccode>let count = 1;\nconst saved = count;\nconst message = `${count}개 완료`;\ncount = 2;\u003c/code>\u003c/pre>\n\u003cbutton id=\"run-assignment\" type=\"button\">대입 결과 확인\u003c/button>\n\u003cpre id=\"assignment-result\" role=\"status\">아직 실행하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> count는 2, saved는 1, message는 “1개 완료”입니다. 대입과 문자열 계산은 그 줄이 실행될 때 한 번 일어납니다. 버튼을 다시 눌러도 매번 새 count에서 시작하므로 결과는 같습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-object-reference\" aria-labelledby=\"reference-title\">\n\u003cp class=\"sample-meta\">예제 1-2 · 객체의 정체성\u003c/p>\u003ch3 id=\"reference-title\">같은 객체를 가리키는 이름과 새 객체\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> alias.done만 바꿨는데 original.done도 바뀔까요? separate는 어떨까요?\u003c/p>\n\u003cpre>\u003ccode>const original = { done: false };\nconst alias = original;\nconst separate = { done: false };\nalias.done = true;\u003c/code>\u003c/pre>\n\u003cbutton id=\"run-reference\" type=\"button\">객체 참조 비교\u003c/button>\n\u003cpre id=\"reference-result\" role=\"status\">아직 실행하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> original.done과 alias.done은 true, separate.done은 false입니다. original === alias는 true이고 original === separate는 false입니다. const는 재대입을 막지만 객체의 속성 수정을 막지는 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-function-call\" aria-labelledby=\"function-title\">\n\u003cp class=\"sample-meta\">예제 1-3 · 함수를 값으로 전달하기\u003c/p>\u003ch3 id=\"function-title\">함수는 언제 실행될까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> 콜백을 callback이라는 이름에 담는 순간 describe의 본문이 실행될까요?\u003c/p>\n\u003cpre>\u003ccode>let calls = 0;\nfunction describe(count) {\n  calls += 1;\n  return `${count}개 완료`;\n}\nconst callback = describe; // 아직 호출하지 않음\nconst message = callback(2); // 여기서 호출\u003c/code>\u003c/pre>\n\u003cbutton id=\"run-function\" type=\"button\">전달 전후와 호출 결과 비교\u003c/button>\n\u003cpre id=\"function-result\" role=\"status\">아직 실행하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 함수 전달 직후 calls는 0, callback(2) 호출 후에는 1입니다. callback에는 함수, message에는 “2개 완료”라는 문자열이 들어 있습니다. 콜백은 “다른 코드에 전달되어 호출되는 함수”라는 역할이며 항상 비동기인 것은 아닙니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-closure\" aria-labelledby=\"closure-title\">\n\u003cp class=\"sample-meta\">예제 1-4 · 호출마다 생기는 범위\u003c/p>\u003ch3 id=\"closure-title\">두 카운터는 각각 무엇을 기억할까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> A를 두 번 실행한 뒤 B를 처음 실행하면 B도 3이 될까요?\u003c/p>\n\u003cpre>\u003ccode>function createCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst nextA = createCounter();\nconst nextB = createCounter();\u003c/code>\u003c/pre>\n\u003cdiv class=\"row\">\u003cbutton id=\"next-a\" type=\"button\">A 한 번 실행\u003c/button>\u003cbutton id=\"next-b\" type=\"button\">B 한 번 실행\u003c/button>\u003cbutton id=\"reset-counters\" type=\"button\">두 카운터 초기화\u003c/button>\u003c/div>\n\u003cp id=\"closure-result\" role=\"status\">A: 0 · B: 0\u003c/p>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> A를 두 번, B를 한 번 실행하면 A: 2 · B: 1입니다. createCounter의 각 호출이 별개의 count를 만들고 반환된 함수가 그 변수에 접근합니다. 초기화는 두 함수를 새로 만듭니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 JavaScript 전체 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 새 함수 만들기와 기존 함수 공유하기\u003c/summary>\u003cp>예제 1-4에서 \u003ccode>let nextB = createCounter()\u003c/code>를 \u003ccode>let nextB = nextA\u003c/code>로 바꾸고 실행해보세요. A를 두 번 누른 뒤 B를 누르면 3을 반환합니다. 두 이름이 같은 함수를 가리키므로 같은 count를 읽기 때문입니다. 화면의 A와 B 표시는 각 버튼을 마지막으로 눌렀을 때 받은 반환값입니다.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../\">← 전체 학습\u003c/a>\u003ca href=\"../02-dom/\">다음 · 문서가 객체가 되는 과정 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","01-javascript/main.js":"// 예제마다 블록을 나누어 서로의 변수에 영향을 주지 않게 합니다.\n// 1-1. 숫자 대입과 문자열 계산은 그 순간의 값을 사용합니다.\n{\n  const result = document.querySelector(\"#assignment-result\");\n  document.querySelector(\"#run-assignment\").addEventListener(\"click\", () => {\n    let count = 1;\n    const saved = count;\n    const message = `${count}개 완료`;\n    count = 2;\n    result.textContent = `count: ${count}\\nsaved: ${saved}\\nmessage: ${message}`;\n  });\n}\n\n// 1-2. 객체를 대입하면 복제하는 대신 같은 객체를 가리킵니다.\n{\n  const result = document.querySelector(\"#reference-result\");\n  document.querySelector(\"#run-reference\").addEventListener(\"click\", () => {\n    const original = { done: false };\n    const alias = original;\n    const separate = { done: false };\n    alias.done = true;\n    result.textContent = [\n      `original.done: ${original.done} · alias.done: ${alias.done}`,\n      `separate.done: ${separate.done}`,\n      `original === alias: ${original === alias}`,\n      `original === separate: ${original === separate}`,\n    ].join(\"\\n\");\n  });\n}\n\n// 1-3. 함수 전달과 호출의 사이에서 실행 횟수를 읽습니다.\n{\n  const result = document.querySelector(\"#function-result\");\n  document.querySelector(\"#run-function\").addEventListener(\"click\", () => {\n    let calls = 0;\n    function describe(count) {\n      calls += 1;\n      return `${count}개 완료`;\n    }\n    const callback = describe;\n    const before = calls;\n    const message = callback(2);\n    result.textContent = `함수 전달 직후 calls: ${before}\\n호출 후 calls: ${calls}\\ntypeof callback: ${typeof callback}\\nmessage: ${message}`;\n  });\n}\n\n// 1-4. 별도로 만든 두 함수는 서로 다른 count에 접근합니다.\n{\n  const result = document.querySelector(\"#closure-result\");\n  function createCounter() {\n    let count = 0;\n    return () => ++count;\n  }\n  let nextA = createCounter();\n  let nextB = createCounter();\n  // 화면에는 각 함수가 마지막으로 반환한 값을 기록합니다.\n  let lastA = 0;\n  let lastB = 0;\n  function show() {\n    result.textContent = `A: ${lastA} · B: ${lastB}`;\n  }\n  document.querySelector(\"#next-a\").addEventListener(\"click\", () => {\n    lastA = nextA();\n    show();\n  });\n  document.querySelector(\"#next-b\").addEventListener(\"click\", () => {\n    lastB = nextB();\n    show();\n  });\n  document.querySelector(\"#reset-counters\").addEventListener(\"click\", () => {\n    nextA = createCounter();\n    nextB = createCounter();\n    lastA = 0;\n    lastB = 0;\n    show();\n  });\n}\n","02-dom/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>2장 · HTML에서 DOM 객체까지\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">2장 · HTML에서 DOM 객체까지\u003c/p>\u003ch1>문서는 어떻게 객체가 될까요?\u003c/h1>\u003cp class=\"intro\">HTML 문자열이 DOM 트리가 되는 과정부터 읽습니다. 요소를 찾는 코드는 문서 안의 실제 객체에 접근하는 방법입니다.\u003c/p>\u003c/header>\n\u003caside class=\"learning-goals\" aria-label=\"이 장의 학습 목표\">\u003cstrong>이 장을 읽고 설명할 수 있는 것\u003c/strong>\u003cul>\u003cli>HTML 문자열과 DOM 객체, 실제 화면의 차이\u003c/li>\u003cli>요소 하나와 요소 목록, 텍스트 노드의 차이\u003c/li>\u003cli>참조와 문자열 복사본, 정적 목록과 실시간 목록의 차이\u003c/li>\u003c/ul>\u003c/aside>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#dom-definition\">DOM의 정의\u003c/a>\u003ca href=\"#why-a-tree\">트리가 필요한 이유\u003c/a>\u003ca href=\"#parsing-tree\">HTML에서 DOM으로\u003c/a>\u003ca href=\"#object-operations\">한 줄씩 읽기\u003c/a>\u003ca href=\"#references-search\">참조와 검색 범위\u003c/a>\u003ca href=\"#collections\">목록의 의미\u003c/a>\u003c/nav>\n\u003cnav class=\"sample-links\" aria-label=\"작은 예제로 바로 이동\">\u003ca href=\"#sample-dom-query\">2-1 검색 결과\u003c/a>\u003ca href=\"#sample-dom-nodes\">2-2 노드와 요소\u003c/a>\u003ca href=\"#sample-dom-reference\">2-3 참조와 문자열\u003c/a>\u003ca href=\"#sample-dom-collections\">2-4 목록의 시점\u003c/a>\u003c/nav>\n\u003csection class=\"concept\" id=\"dom-definition\">\u003ch2>DOM은 문서를 다루기 위한 객체 모델입니다\u003c/h2>\n\u003cp>HTML 파일은 처음에는 글자들의 나열입니다. \u003ccode>&lt;h1&gt;제목&lt;/h1&gt;\u003c/code>이라는 문자열에 제목의 시작과 끝을 표시할 수 있지만, 문자열 자체가 클릭되거나 부모 요소를 알고 있는 것은 아닙니다. 브라우저는 HTML을 읽어 요소와 텍스트를 객체로 만들고, 이 객체들을 문서 구조에 맞게 연결합니다. 이 구조와 그것을 다루는 인터페이스가 DOM, 즉 Document Object Model입니다.\u003c/p>\n\u003cp>DOM을 “JavaScript로 작성한 HTML”이라고 생각하면 역할이 섞입니다. HTML은 문서를 기술하는 형식이고, DOM은 실행 중인 문서를 객체로 표현하는 모델입니다. JavaScript는 DOM 객체에 접근할 때 사용하는 언어입니다. \u003ccode>const\u003c/code>나 함수는 JavaScript 문법이지만, \u003ccode>document.querySelector()\u003c/code>는 브라우저가 제공하는 DOM API를 호출하는 코드입니다.\u003c/p>\n\u003cp>DOM은 화면에 보이는 그림 자체도 아닙니다. 브라우저는 DOM, CSS 등 여러 정보를 바탕으로 요소의 크기와 위치를 계산하고 화면을 그립니다. CSS로 보이지 않게 한 요소도 DOM 안에 남아 있을 수 있습니다. 아직 문서에 붙이지 않은 요소 객체 역시 존재할 수 있습니다. 객체의 존재, 문서와의 연결, 화면 표시를 구분하면 이후 생성과 삭제를 더 정확히 이해할 수 있습니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"why-a-tree\">\u003ch2>왜 문서를 객체의 트리로 만들까요?\u003c/h2>\n\u003cp>문서의 어느 부분을 바꾸려 할 때 HTML 문자열 전체에서 글자를 찾아 교체하면 구조를 안정적으로 다루기 어렵습니다. 같은 글자가 여러 곳에 있을 수 있고, 태그가 중첩되며, 사용자의 입력이나 프로그램에 의해 현재 상태가 달라질 수도 있습니다. 이름표가 있는 실제 요소 객체를 찾아 조작할 수 있다면 이런 문제를 문서 전체의 문자열 편집으로 풀 필요가 없습니다.\u003c/p>\n\u003cp>HTML은 요소 안에 다른 요소를 넣는 중첩 구조입니다. 브라우저는 이것을 부모와 자식 관계로 나타냅니다. 하나의 노드에서 아래로 연결된 자식들을 따라갈 수 있는 구조를 트리라고 부릅니다. 한 요소의 자식은 바로 아래에 붙은 노드이고, 후손은 그 자식의 자식까지 포함한 모든 아래쪽 노드입니다. 같은 부모를 가진 노드들은 형제 관계입니다.\u003c/p>\n\u003cp>트리라는 모델이 있으면 “이 영역 안의 버튼”, “현재 항목의 부모 목록”, “이 제목의 다음 형제”처럼 관계로 대상을 설명할 수 있습니다. 문서 순서, 요소 검색, 이벤트가 전달되는 경로도 이 구조를 토대로 합니다. DOM을 배운다는 것은 명령 이름을 외우기 전에, 어떤 객체가 어디에 연결되어 있고 어느 대상을 변경할지 파악하는 법을 배우는 것입니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"parsing-tree\">\u003ch2>HTML이 객체와 관계로 바뀌는 과정\u003c/h2>\n\u003cp>브라우저의 HTML 파서는 입력 문자열에서 시작 태그, 끝 태그, 텍스트 등의 의미를 읽고 문서 트리를 구성합니다. section 안에 h2와 ul이 있으면 section 객체의 자식 관계로 두 요소가 연결됩니다. ul 안의 li들은 ul의 자식입니다. 태그 사이에 적힌 글자는 별도의 텍스트 노드가 됩니다. 따라서 요소만 그린 구조도와 실제 모든 노드를 포함한 DOM은 세부 모습이 다를 수 있습니다.\u003c/p>\n\u003cpre>\u003ccode>&lt;section id=&quot;profile&quot;&gt;\n  &lt;h2&gt;학습할 주제&lt;/h2&gt;\n  &lt;ul&gt;&lt;li&gt;DOM&lt;/li&gt;&lt;li&gt;이벤트&lt;/li&gt;&lt;/ul&gt;\n&lt;/section&gt;\u003c/code>\u003c/pre>\n\u003cp>이 조각에서 section의 직접 자식 요소는 h2와 ul입니다. li는 section의 후손이지만 직접 자식 요소는 아닙니다. “학습할 주제”라는 글자는 h2의 자식 텍스트 노드입니다. 들여쓰기와 줄바꿈도 텍스트 노드가 될 수 있으므로, 요소 사이에 공백 노드가 생길 수 있습니다. 공백을 화면에서 뚜렷하게 보지 못하더라도 문서 객체에는 남을 수 있습니다.\u003c/p>\n\u003cp>DOM을 구성하는 공통 단위를 Node라고 합니다. 문서 Document, 요소 Element, 글자를 담는 Text 등은 서로 다른 종류의 Node입니다. Element는 HTML에만 한정되지 않는 요소의 공통 기반입니다. HTML 요소는 HTMLElement 계열, SVG 요소는 SVGElement 계열이며 모두 Element에 해당합니다. 그러므로 Node와 Element는 같은 말이 아니고, Element와 HTMLElement도 범위가 다릅니다.\u003c/p>\n\u003cp>객체가 제공하는 기능은 종류에 따라 다릅니다. 요소에는 classList처럼 요소를 위한 기능이 있지만 텍스트 노드에는 없습니다. \u003ccode>children\u003c/code>은 자식 요소만 읽고, \u003ccode>childNodes\u003c/code>는 텍스트와 주석 등을 포함한 자식 노드를 읽습니다. \u003ccode>parentElement\u003c/code>는 부모가 요소일 때 반환합니다. html 요소의 부모는 문서이므로 parentNode는 document여도 parentElement는 null입니다.\u003c/p>\n\u003cp>브라우저가 파싱하며 생략된 구조를 보완하거나 잘못 중첩된 HTML을 정리할 수도 있습니다. 그래서 실행 중인 구조를 확인할 때는 파일의 글자뿐 아니라 개발자 도구의 Elements도 살펴봅니다. 이 장의 외부 스크립트는 defer로 연결되어 있으므로 초기 HTML 파싱이 끝난 뒤 요소를 찾습니다. 검색 코드는 대상이 실제로 생성된 시점 이후에 실행되어야 합니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"object-operations\">\u003ch2>객체를 찾고 읽는 코드를 한 줄씩 읽기\u003c/h2>\n\u003cp>DOM API의 property는 객체에서 값을 읽거나 쓰는 창구이고, method는 객체가 제공하는 작업을 호출하는 함수입니다. \u003ccode>title.textContent\u003c/code>는 property 읽기이고 \u003ccode>area.querySelector(\"h2\")\u003c/code>는 method 호출입니다. 점 뒤에 어떤 이름을 쓰느냐보다, 지금 대상이 어떤 객체이며 읽는지 호출하는지를 구분하는 것이 먼저입니다.\u003c/p>\n\u003cpre>\u003ccode>const area = document.querySelector(&quot;#profile&quot;);\nconst title = area.querySelector(&quot;h2&quot;);\nconst savedText = title.textContent;\ntitle.textContent = &quot;새로운 주제&quot;;\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>\u003cstrong>1행:\u003c/strong> 문서에서 id가 profile인 첫 요소를 찾습니다. 반환된 section 객체를 area라는 이름으로 가리킵니다. HTML 문자열을 복사한 것이 아닙니다.\u003c/li>\n\u003cli>\u003cstrong>2행:\u003c/strong> area의 후손 중 첫 h2 요소를 찾습니다. title은 찾은 h2 객체를 가리키며, area와는 다른 객체입니다.\u003c/li>\n\u003cli>\u003cstrong>3행:\u003c/strong> h2의 텍스트 내용을 문자열로 읽어 savedText에 저장합니다. 이 변수에는 요소 자체가 아니라 그 시점에 읽은 글자가 들어갑니다.\u003c/li>\n\u003cli>\u003cstrong>4행:\u003c/strong> 같은 h2 객체의 내용을 새로운 문자열로 교체합니다. 문서 속 제목은 바뀌지만 savedText에 이미 저장된 문자열까지 다시 읽히지는 않습니다.\u003c/li>\n\u003c/ol>\n\u003cp>여기서 첫 검색에 실패하면 area는 null입니다. null은 빈 요소 객체가 아니라 대상이 없다는 값이므로 다음 줄에서 메서드를 호출할 수 없습니다. 이 짧은 예제는 해당 HTML이 존재함을 전제로 합니다. 실제 프로그램에서는 필수 구조를 보장하거나, 결과를 검사하고 없는 경우의 흐름을 정해야 합니다. 검색 실패와 객체 수정 실패는 서로 다른 단계의 문제입니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"references-search\">\u003ch2>HTML 문자열, 요소 참조, 검색 범위를 구분하기\u003c/h2>\n\u003cp>같은 요소를 두 번 검색하면 두 변수로 같은 DOM 객체를 가리킬 수 있습니다. 한 변수로 속성을 수정하면 다른 변수에서 읽어도 바뀐 값을 봅니다. 반면 \u003ccode>area.outerHTML\u003c/code>처럼 요소를 HTML 문자열로 표현해 읽으면 문자열 결과를 얻습니다. 그 문자열을 변수에 저장했다고 요소와 계속 연결되는 것은 아닙니다. 이후 DOM을 변경해도 앞서 저장한 문자열은 그때 읽은 결과로 남습니다.\u003c/p>\n\u003cp>실행 중인 DOM을 바꾸는 작업은 원본 HTML 파일을 편집하는 작업과도 다릅니다. JavaScript가 제목을 변경해도 디스크의 파일에 그 문장이 저장되지는 않습니다. 페이지를 다시 실행하면 소스에서 새 문서가 만들어지고 코드가 다시 실행됩니다. 파일, 현재 DOM 객체, DOM에서 읽어 얻은 문자열은 각각 다른 시점과 역할을 갖습니다.\u003c/p>\n\u003cp>선택자는 찾을 요소의 조건을 적는 문자열입니다. \u003ccode>#profile\u003c/code>은 id, \u003ccode>.topic\u003c/code>은 class, \u003ccode>li\u003c/code>는 요소 이름을 조건으로 사용합니다. 검색은 이 문자열을 해석해 실제 객체를 돌려줍니다. 선택자 문자열 자체를 바꾼다고 문서의 id나 class가 바뀌지는 않습니다. 문서 전체에서 검색할 수도 있고, 이미 찾은 영역 안으로 반환 대상을 좁힐 수도 있습니다.\u003c/p>\n\u003cp>\u003ccode>area.querySelector(\"li\")\u003c/code>는 area 내부의 첫 li 후손을 찾습니다. 중첩된 목록이 있으면 바로 아래뿐 아니라 더 깊은 요소도 포함될 수 있습니다. \u003ccode>:scope &gt; ul\u003c/code>처럼 쓰면 검색 기준인 area의 직접 자식 ul을 고릅니다. 요소에서 검색할 때 그 요소 자신은 반환 대상에 포함하지 않습니다. 자신의 조건 일치 여부를 알고 싶을 때는 matches를 사용합니다.\u003c/p>\n\u003cp>선택자가 문법상 유효하지만 일치하는 요소가 없으면 querySelector는 null을 반환합니다. 잘못된 CSS 선택자 문법은 예외를 일으킵니다. 코드가 예상과 다를 때는 대상이 없는지, 검색 범위를 잘못 정했는지, 문법이 틀렸는지를 나누어 보면 됩니다. 나중에 생성될 요소를 너무 일찍 찾은 경우도 “없음”으로 나타납니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"collections\">\u003ch2>정적인 목록은 요소를 얼려 놓은 복사본이 아닙니다\u003c/h2>\n\u003cp>\u003ccode>querySelectorAll()\u003c/code>은 일치하는 여러 요소를 담은 NodeList를 반환합니다. 하나만 일치해도 목록이고, 하나도 없으면 길이가 0인 목록입니다. 요소 하나의 참조와 요소 목록은 다르므로, 목록의 항목을 꺼내거나 반복하면서 실제 요소를 다뤄야 합니다. 빈 목록도 객체이므로 단순히 값이 존재하는지만 검사해서는 검색 성공을 판단할 수 없습니다.\u003c/p>\n\u003cp>querySelectorAll의 목록은 검색 시점의 구성원을 유지하는 정적 목록입니다. li가 두 개일 때 목록을 받아둔 뒤 세 번째 li를 추가해도 기존 목록의 길이는 2입니다. 새 검색을 해야 세 개를 얻습니다. 하지만 기존 목록 안의 li 객체는 실제 문서 요소의 참조입니다. 그 요소의 글자를 바꾸면 화면도 바뀝니다. “어떤 객체가 목록에 들어 있는가”가 고정되며, 객체의 내용까지 복사하거나 고정한 것은 아닙니다.\u003c/p>\n\u003cp>반면 \u003ccode>list.children\u003c/code>은 현재 자식 요소를 반영하는 실시간 컬렉션입니다. 같은 변수를 통해 읽어도 자식이 추가되면 길이가 바뀝니다. 모든 NodeList가 정적인 것도 아닙니다. childNodes는 실시간 NodeList입니다. 이름에 List가 있다는 이유로 갱신 방식을 추측하지 말고 어떤 API가 만든 목록인지 확인해야 합니다. 고정된 작업 대상이 필요한지, 늘 현재 구조가 필요한지에 따라 적합한 읽기 방법이 달라집니다.\u003c/p>\n\u003cp>이제 DOM 검색은 문자열로 화면 일부를 긁어오는 작업이 아니라, 문서 트리 안에 있는 객체와 관계에 접근하는 작업으로 볼 수 있습니다. 다음 장에서는 얻은 객체의 어떤 부분을 바꾸면 현재 입력값, 내용, CSS와 연결되는 상태가 달라지는지 살펴봅니다.\u003c/p>\n\u003cp class=\"muted\">더 읽기: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document_Object_Model\">MDN · DOM\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelectorAll\">MDN · querySelectorAll\u003c/a>.\u003c/p>\n\u003c/section>\n\u003ch2 id=\"demo-observe\">작은 예제 · 한 번에 하나의 차이 관찰하기\u003c/h2>\n\u003cp>각 예제는 서로 다른 요소를 사용합니다. 다른 예제를 먼저 실행하지 않아도 됩니다. 버튼을 누르기 전 결과를 예상하고, 아래 설명과 비교해보세요.\u003c/p>\n\u003csection class=\"demo sample\" id=\"sample-dom-query\" aria-labelledby=\"query-title\">\n\u003cp class=\"sample-meta\">예제 2-1 · 검색의 결과 · querySelector / querySelectorAll\u003c/p>\u003ch3 id=\"query-title\">하나, 목록, 없음은 어떻게 다를까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 두 항목이 있는 영역에서 하나 찾기, 여러 개 찾기, 없는 요소 찾기는 각각 무엇을 돌려줄까요?\u003c/p>\n\u003csection id=\"profile\" aria-labelledby=\"profile-title\">\u003ch4 id=\"profile-title\">학습할 주제\u003c/h4>\u003cul>\u003cli class=\"topic\">DOM 구조 읽기\u003c/li>\u003cli class=\"topic\">이벤트 연결하기\u003c/li>\u003c/ul>\u003c/section>\n\u003cdiv class=\"row\">\u003cbutton id=\"find-one\" type=\"button\">id로 하나 찾기\u003c/button>\u003cbutton id=\"find-many\" type=\"button\">class로 여러 개 찾기\u003c/button>\u003cbutton id=\"find-missing\" type=\"button\">없는 요소 찾기\u003c/button>\u003c/div>\n\u003cpre id=\"query-result\" role=\"status\">아직 검색하지 않았습니다.\u003c/pre>\n\u003cpre>\u003ccode>const area = document.querySelector(\"#profile\");\nconst topics = area.querySelectorAll(\".topic\");\nconst missing = area.querySelector(\".missing\");\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 하나 찾기는 section 요소, 여러 개 찾기는 길이 2인 목록, 없는 요소 찾기는 null입니다. 검색은 기존 객체를 찾는 작업이며 새 요소를 만들지 않습니다. 찾은 대상에는 테두리와 함께 태그·부모·자식 수가 표시됩니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-dom-nodes\" aria-labelledby=\"nodes-title\">\n\u003cp class=\"sample-meta\">예제 2-2 · 노드와 요소 · children / childNodes\u003c/p>\u003ch3 id=\"nodes-title\">보이지 않는 공백도 자식일까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 아래 문장에는 strong 요소가 하나 있습니다. 자식 노드도 하나일까요?\u003c/p>\n\u003cp id=\"node-sentence\">안녕 \u003cstrong>DOM\u003c/strong>!\u003c/p>\n\u003cbutton id=\"inspect-nodes\" type=\"button\">자식 요소와 노드 비교\u003c/button>\n\u003cpre id=\"nodes-result\" role=\"status\">버튼을 눌러 두 목록을 읽어보세요.\u003c/pre>\n\u003cpre>\u003ccode>sentence.children.length;   // 요소만\nsentence.childNodes.length; // 텍스트도 포함\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> children은 strong 하나, childNodes는 “안녕 ” 텍스트·strong·“!” 텍스트, 총 3개입니다. 화면의 글자도 트리 안에서는 별도 노드입니다. 이 문장은 태그 사이의 줄바꿈이 없도록 작성했습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-dom-reference\" aria-labelledby=\"reference-title\">\n\u003cp class=\"sample-meta\">예제 2-3 · 참조와 값 · 같은 객체 / 읽어 둔 문자열\u003c/p>\u003ch3 id=\"reference-title\">요소가 바뀌면 저장한 글자도 바뀔까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 같은 문단을 두 번 찾아도 같은 객체입니다. 그 문단에서 미리 읽어 둔 문자열은 어떨까요?\u003c/p>\n\u003cp id=\"reference-text\">처음 문구\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton id=\"change-reference\" type=\"button\">참조로 문구 바꾸기\u003c/button>\u003cbutton id=\"reset-reference\" type=\"button\">문구 되돌리기\u003c/button>\u003c/div>\n\u003cpre id=\"reference-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>const first = document.querySelector(\"#reference-text\");\nconst second = document.querySelector(\"#reference-text\");\nconst savedText = first.textContent;\nfirst.textContent = \"바뀐 문구\";\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> first === second는 true이고, second.textContent도 “바뀐 문구”입니다. savedText는 여전히 “처음 문구”입니다. 요소 참조는 같은 객체를 가리키지만, 이미 읽은 문자열은 다시 계산되지 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-dom-collections\" aria-labelledby=\"collections-title\">\n\u003cp class=\"sample-meta\">예제 2-4 · 목록의 기준 시점 · 정적 목록 / 실시간 목록\u003c/p>\u003ch3 id=\"collections-title\">항목을 추가하면 어떤 개수가 바뀔까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 항목 두 개일 때 NodeList와 children을 저장했습니다. 항목을 하나 추가하면 두 목록이 모두 3개가 될까요?\u003c/p>\n\u003cul id=\"collection-list\">\u003cli>첫 항목\u003c/li>\u003cli>둘째 항목\u003c/li>\u003c/ul>\n\u003cdiv class=\"row\">\u003cbutton id=\"append-collection\" type=\"button\">항목 하나 추가\u003c/button>\u003cbutton id=\"rename-collection\" type=\"button\">저장된 첫 요소의 글자 바꾸기\u003c/button>\u003cbutton id=\"reset-collection\" type=\"button\">두 항목으로 다시 시작\u003c/button>\u003c/div>\n\u003cpre id=\"collections-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>const saved = list.querySelectorAll(\"li\");\nconst live = list.children;\nlist.append(document.createElement(\"li\"));\n// saved.length는 2, live.length는 3\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 추가 후 저장한 NodeList의 길이는 2로 유지되고, children과 다시 검색한 목록은 3이 됩니다. 저장된 첫 요소의 글자는 바꿀 수 있습니다. 정적인 것은 목록의 구성원이며 요소의 내용이 아닙니다. 다시 시작하면 두 목록도 처음부터 저장합니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 실행 코드 읽기\u003c/a>\u003c/p>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 읽은 내용을 코드로 확인하고 싶다면\u003c/summary>\u003cp>HTML에서 profile의 ul에 li.topic 하나를 더 넣고 코드를 실행해보세요. “여러 개 찾기”가 반환하는 개수와 profile 자체의 자식 요소 수를 비교하면, 직접 자식과 더 깊은 후손의 차이를 확인할 수 있습니다. 연습 없이 본문 설명만으로도 다음 장을 읽을 수 있습니다.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../01-javascript/\">← 이전 · 언어와 실행\u003c/a>\u003ca href=\"../03-dom-update/\">다음 · 객체를 바꾸면 화면이 달라지는 이유 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","02-dom/main.js":"// 예제 2-1 · 하나의 요소, 요소 목록, null을 구분합니다.\nconst queryResult = document.querySelector(\"#query-result\");\nconst profile = document.querySelector(\"#profile\");\n\nfunction showElements(elements, description) {\n  profile.classList.remove(\"is-found\");\n  for (const element of profile.querySelectorAll(\".is-found\")) {\n    element.classList.remove(\"is-found\");\n  }\n  const descriptions = [];\n  for (const element of elements) {\n    element.classList.add(\"is-found\");\n    descriptions.push({\n      tag: element.tagName,\n      parent: element.parentElement.tagName,\n      childElementCount: element.children.length,\n    });\n  }\n  queryResult.textContent = `${description}\\n${JSON.stringify(descriptions, null, 2)}`;\n}\n\ndocument.querySelector(\"#find-one\").addEventListener(\"click\", () => {\n  showElements([profile], \"요소 하나: section#profile\");\n});\ndocument.querySelector(\"#find-many\").addEventListener(\"click\", () => {\n  const topics = profile.querySelectorAll(\".topic\");\n  showElements(topics, `NodeList: 길이 ${topics.length}`);\n});\ndocument.querySelector(\"#find-missing\").addEventListener(\"click\", () => {\n  const missing = profile.querySelector(\".missing\");\n  showElements([], \"\");\n  queryResult.textContent = `${missing} — 일치하는 요소가 없습니다.`;\n});\n\n// 예제 2-2 · 요소 사이의 글자도 Text 노드입니다.\nconst sentence = document.querySelector(\"#node-sentence\");\ndocument.querySelector(\"#inspect-nodes\").addEventListener(\"click\", () => {\n  const nodes = [...sentence.childNodes].map((node) => ({\n    type: node.nodeType === Node.TEXT_NODE ? \"Text\" : \"Element\",\n    name: node.nodeName,\n    text: node.textContent,\n  }));\n  document.querySelector(\"#nodes-result\").textContent =\n    `children: ${sentence.children.length}개 / childNodes: ${sentence.childNodes.length}개\\n${JSON.stringify(nodes, null, 2)}`;\n});\n\n// 예제 2-3 · 두 참조와 한 문자열을 같은 시점에 저장합니다.\nconst first = document.querySelector(\"#reference-text\");\nconst second = document.querySelector(\"#reference-text\");\nconst savedText = first.textContent;\nfunction describeReference() {\n  document.querySelector(\"#reference-result\").textContent =\n    `first === second: ${first === second}\\nsecond.textContent: ${second.textContent}\\nsavedText: ${savedText}`;\n}\ndocument.querySelector(\"#change-reference\").addEventListener(\"click\", () => {\n  first.textContent = \"바뀐 문구\";\n  describeReference();\n});\ndocument.querySelector(\"#reset-reference\").addEventListener(\"click\", () => {\n  first.textContent = savedText;\n  describeReference();\n});\ndescribeReference();\n\n// 예제 2-4 · 검색 당시 구성원과 현재 구성원을 따로 읽습니다.\nconst collectionList = document.querySelector(\"#collection-list\");\nlet saved = collectionList.querySelectorAll(\"li\");\nconst live = collectionList.children;\nfunction describeCollections() {\n  document.querySelector(\"#collections-result\").textContent =\n    `저장한 NodeList: ${saved.length}개\\n저장한 children: ${live.length}개\\n지금 다시 검색: ${collectionList.querySelectorAll(\"li\").length}개\\n저장한 첫 요소의 텍스트: ${saved[0].textContent}`;\n}\ndocument.querySelector(\"#append-collection\").addEventListener(\"click\", () => {\n  const item = document.createElement(\"li\");\n  item.textContent = `추가 항목 ${live.length + 1}`;\n  collectionList.append(item);\n  describeCollections();\n});\ndocument.querySelector(\"#rename-collection\").addEventListener(\"click\", () => {\n  saved[0].textContent = \"저장한 참조로 바꾼 첫 항목\";\n  describeCollections();\n});\ndocument.querySelector(\"#reset-collection\").addEventListener(\"click\", () => {\n  collectionList.replaceChildren();\n  for (const text of [\"첫 항목\", \"둘째 항목\"]) {\n    const item = document.createElement(\"li\");\n    item.textContent = text;\n    collectionList.append(item);\n  }\n  saved = collectionList.querySelectorAll(\"li\");\n  describeCollections();\n});\ndescribeCollections();\n","03-dom-update/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>3장 · 문서의 내용과 현재 상태\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003cstyle>.dom-update-lab input[type=\"text\"] { max-width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--control-line); border-radius: 6px; background: var(--surface); color: var(--ink); }\u003c/style>\u003c/head>\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\" class=\"dom-update-lab\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">3장 · 문서의 내용과 현재 상태\u003c/p>\u003ch1>객체를 바꾸면 화면은 어떻게 달라질까요?\u003c/h1>\u003cp class=\"intro\">현재 입력값, HTML 속성, 문서 내용은 서로 다른 정보를 담습니다. 그 차이와 CSS로 이어지는 변경 과정을 이해합니다.\u003c/p>\u003c/header>\n\u003caside class=\"learning-goals\" aria-label=\"이 장의 학습 목표\">\u003cstrong>이 장을 읽고 설명할 수 있는 것\u003c/strong>\u003cul>\u003cli>문단의 텍스트와 입력 컨트롤의 현재값을 바꾸는 방법\u003c/li>\u003cli>attribute, property, 현재값, 기본값의 관계\u003c/li>\u003cli>문자열 상태를 CSS 표현과 연결하는 과정\u003c/li>\u003c/ul>\u003c/aside>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#changing-a-document\">DOM 변경의 의미\u003c/a>\u003ca href=\"#two-representations\">속성의 두 표현\u003c/a>\u003ca href=\"#current-default\">현재값과 기본값\u003c/a>\u003ca href=\"#reading-state\">한 줄씩 읽기\u003c/a>\u003ca href=\"#booleans-strings\">불리언과 문자열\u003c/a>\u003ca href=\"#content-identity\">내용과 객체 정체성\u003c/a>\u003ca href=\"#styles-rendering\">CSS와 화면 갱신\u003c/a>\u003c/nav>\n\u003cnav class=\"sample-links\" aria-label=\"작은 예제로 바로 이동\">\u003ca href=\"#sample-update-text\">3-1 텍스트 넣기\u003c/a>\u003ca href=\"#sample-update-defaults\">3-2 현재값과 기본값\u003c/a>\u003ca href=\"#sample-update-boolean\">3-3 불리언 속성\u003c/a>\u003ca href=\"#sample-update-style\">3-4 상태와 CSS\u003c/a>\u003c/nav>\n\u003csection class=\"concept\" id=\"changing-a-document\">\u003ch2>DOM 수정은 객체의 어느 부분을 바꿀지 정하는 일입니다\u003c/h2>\n\u003cp>앞 장에서 요소를 찾으면 실제 DOM 객체의 참조를 얻는다는 것을 보았습니다. 이제 그 객체에 새로운 값을 대입할 수 있습니다. 다만 요소는 글자 하나만 담은 단순한 상자가 아닙니다. 문서에 붙은 속성, 자식 노드, 폼 컨트롤의 현재 입력값처럼 서로 다른 정보를 관리합니다. 같은 “바꾼다”라는 말이라도 어느 정보를 대상으로 하는지에 따라 사용해야 할 API가 달라집니다.\u003c/p>\n\u003cp>예를 들어 p 요소의 안내 문구를 바꾸는 것과 input에 현재 입력된 이름을 바꾸는 것은 다릅니다. p의 문구는 자식 텍스트로 표현되고, 텍스트 입력의 현재 값은 입력 컨트롤이 관리하는 상태입니다. 전자는 textContent로, 후자는 value로 다룹니다. 이 차이를 이해하면 문구를 바꾸려다가 입력값이 그대로인 상황이나, 현재값 대신 초기값을 읽는 상황을 설명할 수 있습니다.\u003c/p>\n\u003cp>DOM 변경을 이해할 때는 “무엇을 저장하는가”, “어떤 값과 연결되는가”, “브라우저는 그 변경을 어떻게 표시하는가”라는 세 질문을 연결해서 보면 됩니다. 이번 장은 명령을 여러 개 익히기보다 이 연결을 이해하는 데 집중합니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"two-representations\">\u003ch2>왜 attribute와 property라는 두 표현이 있을까요?\u003c/h2>\n\u003cp>HTML에서는 요소를 태그와 속성으로 기술합니다. \u003ccode>&lt;input value=\"민지\"&gt;\u003c/code>의 value=\"민지\"처럼 요소에 붙는 이름과 값의 쌍을 content attribute라고 부릅니다. HTML 문서에 적힌 내용을 선언적으로 표현하는 수단입니다. 브라우저가 요소 객체를 만든 뒤에도 이 attribute는 DOM 안에 존재하며, getAttribute나 setAttribute로 읽고 바꿀 수 있습니다.\u003c/p>\n\u003cp>한편 JavaScript에서 DOM 객체를 사용할 때는 그 객체가 제공하는 property에 접근합니다. \u003ccode>input.value\u003c/code>나 \u003ccode>input.disabled\u003c/code>가 그 예입니다. property는 단순한 문자열 사본일 수도 있지만, 현재 상태를 읽거나 브라우저의 정해진 동작을 수행하는 창구일 수도 있습니다. property를 설정하면 대응하는 attribute가 변경되기도 하고, 별도의 내부 상태가 변경되기도 합니다.\u003c/p>\n\u003cp>이 두 표현이 연결되는 것을 반영, 즉 reflection이라고 합니다. 예를 들어 요소의 id property를 바꾸면 id attribute도 바뀝니다. title이나 className도 대응하는 attribute와 연결됩니다. 하지만 모든 property가 같은 이름의 attribute를 그대로 반영하지는 않습니다. 어떤 property는 불리언이나 숫자로 변환하고, 어떤 것은 값을 정규화하며, 입력 컨트롤의 현재 상태처럼 기본 설정과 분리된 정보를 제공합니다.\u003c/p>\n\u003cp>따라서 “attribute는 HTML, property는 JavaScript”라고만 외우면 중요한 부분을 놓칩니다. 둘 다 실행 중인 DOM에서 접근할 수 있습니다. 또한 attribute가 원본 파일의 영구적인 초기값인 것도 아닙니다. setAttribute로 바꾸면 DOM의 attribute가 달라지지만, 디스크에 저장된 HTML 파일까지 수정되지는 않습니다. 지금 어떤 표현을 읽고 있는지가 핵심입니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"current-default\">\u003ch2>브라우저가 현재값과 기본값을 나누어 관리하는 이유\u003c/h2>\n\u003cp>입력창은 문서를 읽을 때의 설정과 사용자가 편집한 결과를 모두 다뤄야 합니다. HTML의 value attribute는 기본값을 정합니다. 텍스트 입력의 defaultValue property는 이 attribute와 연결됩니다. 반면 value property는 지금 입력창에 들어 있는 문자열을 읽고 씁니다. 사용자가 “민지”를 “하루”로 바꾸면 현재값은 하루가 되어도 기본값은 민지로 남을 수 있습니다.\u003c/p>\n\u003cp>왜 항상 서로를 똑같이 갱신하지 않을까요? 현재 입력과 기본 설정이 한 값뿐이라면 사용자의 편집을 보존하면서 초기 상태를 따로 관리하기 어렵습니다. 브라우저는 아직 기본값을 따라가는 상태와, 현재값을 직접 설정한 상태를 구분합니다. 이 구분을 위해 내부에 변경 여부를 기록하는 표시가 있으며, 표준에서는 dirty flag라고 부릅니다. 잘못되거나 오염된 값이라는 뜻이 아니라 현재값이 독립적으로 설정되었다는 표시입니다.\u003c/p>\n\u003cp>사용자가 입력하거나 코드가 value에 대입하면 이 표시가 설정됩니다. 그 뒤 기본값을 바꾸더라도 현재의 편집 결과를 무조건 덮어쓰지 않습니다. 아직 이런 변경이 없는 입력에서는 기본값 변경이 현재값에도 반영될 수 있습니다. 그래서 “attribute를 바꾸면 언제나 현재값도 바뀐다”와 “attribute는 현재값에 절대로 영향을 주지 않는다”는 설명이 모두 정확하지 않습니다.\u003c/p>\n\u003cp>체크박스도 같은 구분이 필요합니다. checked property는 현재 선택 여부이고, defaultChecked는 checked attribute와 연결된 기본 선택 여부입니다. 사용자가 체크를 해제해도 기본 선택 여부는 유지될 수 있습니다. 폼을 reset하면 컨트롤은 그때의 기본값으로 돌아가고 이러한 변경 표시도 초기화됩니다. 현재 상태를 확실히 지정하려면 value나 checked에 직접 대입하고, 기본 설정을 바꾸려면 defaultValue나 defaultChecked를 구분해서 사용합니다.\u003c/p>\u003cp class=\"muted\">현재값·기본값·변경 표시의 관계는 \u003ca href=\"https://html.spec.whatwg.org/multipage/input.html\">HTML 표준의 input 동작\u003c/a>에 정의되어 있습니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"reading-state\">\u003ch2>작은 코드에서 현재값과 기본값을 한 줄씩 읽기\u003c/h2>\n\u003cp>아래 코드는 HTML에 value=\"민지\"가 있는 입력창을 대상으로 합니다. 같은 요소에서 읽는 값이 왜 다른지, 각 줄이 무엇에 접근하는지 따라가 보겠습니다.\u003c/p>\n\u003cpre>\u003ccode>const input = document.querySelector(&quot;#username&quot;);\nconst before = input.getAttribute(&quot;value&quot;);\ninput.value = &quot;하루&quot;;\nconst current = input.value;\nconst initial = input.defaultValue;\nconsole.log(before, current, initial);\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>\u003cstrong>1행:\u003c/strong> username 요소 객체를 찾습니다. input은 그 객체를 가리키는 이름입니다.\u003c/li>\n\u003cli>\u003cstrong>2행:\u003c/strong> DOM의 value attribute를 문자열로 읽습니다. 지금은 “민지”이며 before에는 이때 읽은 문자열이 저장됩니다.\u003c/li>\n\u003cli>\u003cstrong>3행:\u003c/strong> 컨트롤의 현재값을 “하루”로 설정합니다. 입력창의 현재 표시도 이 값을 사용하고, 기본값의 attribute를 덮어쓰지는 않습니다.\u003c/li>\n\u003cli>\u003cstrong>4행:\u003c/strong> 현재값을 다시 읽습니다. current는 “하루”가 됩니다.\u003c/li>\n\u003cli>\u003cstrong>5행:\u003c/strong> value attribute와 연결된 기본값을 읽습니다. initial은 여전히 “민지”입니다.\u003c/li>\n\u003cli>\u003cstrong>6행:\u003c/strong> “민지”, “하루”, “민지”를 차례로 출력합니다. 하나의 요소가 서로 다른 의미의 값을 관리하고 있음을 보여줍니다.\u003c/li>\n\u003c/ol>\n\u003cp>이후 \u003ccode>input.defaultValue = \"기본 이름\"\u003c/code>으로 기본값을 바꾸면 value attribute도 바뀝니다. 하지만 앞에서 현재값을 직접 설정했으므로 현재의 하루는 유지됩니다. before와 initial에 앞서 저장한 문자열도 자동으로 다시 읽히지 않습니다. 요소가 관리하는 상태의 연결 규칙과 JavaScript 변수에 이미 저장한 값의 규칙을 함께 구분해야 합니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"booleans-strings\">\u003ch2>불리언 상태와 문자열 표기를 구분하기\u003c/h2>\n\u003cp>getAttribute는 속성이 있으면 문자열을, 없으면 null을 반환합니다. 하지만 HTML의 모든 속성이 문자열 내용을 같은 방식으로 해석하는 것은 아닙니다. checked·disabled·required 같은 불리언 attribute는 속성의 존재 자체로 참을 표현합니다. disabled=\"false\"라고 써도 disabled가 존재하므로 비활성 상태입니다. 끄려면 속성을 없애거나 disabled property에 false를 설정합니다.\u003c/p>\n\u003cp>checked attribute도 존재 여부로 기본 선택 상태를 표현하지만, 현재 선택을 뜻하는 checked property와는 앞서 본 분리가 있습니다. \u003ccode>box.checked = false\u003c/code>는 현재 선택을 끄는 작업이지 checked attribute를 반드시 제거하는 작업이 아닙니다. 반면 disabled property는 그 attribute의 존재 여부를 반영합니다. 둘 다 불리언 property라는 이유만으로 반영 규칙까지 같다고 생각하면 안 됩니다.\u003c/p>\n\u003cp>data-* attribute는 요소에 애플리케이션이 사용할 문자열 정보를 기록하는 방법입니다. \u003ccode>data-notifications=\"on\"\u003c/code>은 \u003ccode>element.dataset.notifications\u003c/code>로 읽고 쓸 수 있습니다. dataset에 false를 대입해도 저장되는 것은 문자열 “false”입니다. JavaScript의 조건문에서는 빈 문자열이 아닌 “false”도 참으로 평가하므로, \u003ccode>dataset.notifications === \"on\"\u003c/code>처럼 약속한 값과 비교합니다.\u003c/p>\n\u003cp>HTML 불리언 attribute와 data 속성, ARIA 속성을 같은 규칙으로 취급해서도 안 됩니다. 예를 들어 aria-expanded의 “false”는 그 속성에서 정한 의미를 갖는 문자열입니다. 무조건 속성이 있으면 참이라고 해석하지 않습니다. 문자열 표기와 프로그램의 불리언 상태 사이를 어떻게 연결할지는 각 API의 규칙을 따라야 합니다.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"content-identity\">\u003ch2>내용을 교체해도 모든 객체가 같은 방식으로 바뀌지는 않습니다\u003c/h2>\n\u003cp>요소의 textContent에 문자열을 대입하면 그 요소의 자식 내용을 텍스트로 교체합니다. 부모 요소 객체 자체를 새로 만드는 것은 아닙니다. 하지만 그 안에 있던 강조 요소나 아이콘도 자식이므로 제거될 수 있습니다. 제목에 아이콘과 글자가 함께 있다면 글자를 담당하는 span을 따로 두고 그 span을 수정하는 편이 의도를 정확히 표현합니다.\u003c/p>\n\u003cp>제거된 자식 객체를 다른 변수가 계속 가리키고 있다면 그 객체는 문서에서 떨어진 상태로 남을 수 있습니다. 같은 태그와 문구로 새 자식을 만들어도 이전 객체와 정체성이 같은 것은 아닙니다. 기존 객체에 붙인 이벤트 리스너나 별도 상태가 새 객체로 자동 이동하지 않습니다. 단순히 최종 화면이 같다는 이유로 어떤 DOM 변경 방법이든 동등하다고 볼 수 없는 이유입니다.\u003c/p>\n\u003cp>textContent는 입력을 HTML로 해석하지 않습니다. “&lt;strong&gt;하루&lt;/strong&gt;”를 넣으면 꺾쇠를 포함한 글자를 표시합니다. 반면 innerHTML은 문자열을 HTML로 파싱하여 자식 구조를 만들거나 교체합니다. 사용자에게 받은 문장을 그대로 보여주는 목적이라면 textContent가 맞습니다. 불필요하게 HTML로 해석하면 의도하지 않은 요소나 위험한 동작을 만들 수 있습니다. 표시할 텍스트와 문서 구조를 만드는 작업을 분리해서 생각하세요.\u003c/p>\n\u003c/section>\u003csection class=\"concept\" id=\"styles-rendering\">\u003ch2>객체 변경이 화면의 모양으로 이어지는 과정\u003c/h2>\n\u003cp>JavaScript는 class나 data 속성을 바꿀 수 있지만, 그 이름만으로 브라우저가 특정 디자인을 선택하지는 않습니다. CSS 선택자가 현재 요소와 일치하고, 다른 규칙과의 우선순위 및 상속 등을 통해 적용할 스타일이 결정되어야 합니다. \u003ccode>data-notifications=\"on\"\u003c/code>이라는 값을 썼다고 자동으로 초록색이나 파란색이 되는 것은 아닙니다.\u003c/p>\n\u003cpre>\u003ccode>preview.textContent = &quot;알림이 켜져 있어요.&quot;;\npreview.dataset.notifications = &quot;on&quot;;\npreview.classList.add(&quot;status&quot;);\u003c/code>\u003c/pre>\n\u003cp>첫 줄은 자식 내용을 바꾸고, 둘째 줄은 data attribute를 바꾸며, 셋째 줄은 class 목록에 status를 추가합니다. 이 페이지에는 status의 글자색과 굵기를 정하는 CSS가 있기 때문에 마지막 변경이 강조된 모습으로 이어집니다. data 속성을 스타일 조건으로 쓰고 싶다면 \u003ccode>#preview[data-notifications=\"on\"]\u003c/code>과 같은 선택자에 규칙을 작성해야 합니다.\u003c/p>\n\u003cp>classList는 특정 클래스만 추가하거나 제거하는 창구입니다. className에 새 문자열을 대입하면 기존 클래스 전체가 교체됩니다. 또 인수 하나인 toggle은 현재 상태를 뒤집지만, \u003ccode>toggle(\"status\", enabled)\u003c/code>는 enabled가 뜻하는 목표 상태로 맞춥니다. 같은 값을 다시 화면에 반영할 때마다 모습이 뒤집히지 않게 하려면 “전환”과 “원하는 상태로 설정”을 구분해야 합니다.\u003c/p>\n\u003cp>DOM의 값은 코드가 대입한 뒤 바로 읽을 수 있지만, 실제 픽셀을 다시 그리는 과정은 별도의 브라우저 작업입니다. 브라우저는 변경에 따라 필요한 스타일을 계산하고, 필요하면 크기와 위치를 계산한 뒤 화면을 그립니다. 여러 변경이 한 번의 화면 갱신으로 모일 수도 있습니다. 따라서 DOM을 한 줄 바꿀 때마다 반드시 전체 화면을 즉시 다시 그린다고 생각할 필요는 없습니다.\u003c/p>\n\u003cp>또 코드로 value나 checked를 대입했다고 사용자 입력에 따른 input·change 이벤트가 자동 발생하지는 않습니다. 아래 예제는 값을 읽어 문구를 만드는 updatePreview를 필요할 때 직접 호출합니다. 다음 장에서는 사용자의 행동이 어떻게 이벤트가 되고, 그 이벤트를 받아 어떤 변경 함수를 호출할지 연결하는 과정을 읽습니다.\u003c/p>\n\u003cp class=\"muted\">더 읽기: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLInputElement/checked\">MDN · checked\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent\">MDN · textContent\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/dataset\">MDN · dataset\u003c/a>.\u003c/p>\n\u003c/section>\n\u003ch2 id=\"demo-observe\">작은 예제 · 바꾸는 대상 구분하기\u003c/h2>\n\u003cp>현재값, 문구, 속성, 클래스는 별개의 대상입니다. 한 예제씩 실행하면서 어떤 부분만 달라지는지 확인합니다.\u003c/p>\n\u003csection class=\"demo sample\" id=\"sample-update-text\" aria-labelledby=\"text-title\">\n\u003cp class=\"sample-meta\">예제 3-1 · 텍스트와 입력값 · textContent / value\u003c/p>\u003ch3 id=\"text-title\">태그처럼 생긴 글자를 넣으면 어떻게 될까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 입력값 “&lt;strong&gt;안녕&lt;/strong&gt;”을 문단에 textContent로 대입하면 굵은 글자가 될까요?\u003c/p>\n\u003clabel class=\"stack\" for=\"literal-input\">문단에 넣을 글자\u003cinput id=\"literal-input\" type=\"text\" value=\"&lt;strong&gt;안녕&lt;/strong&gt;\" autocomplete=\"off\">\u003c/label>\n\u003cbutton id=\"apply-text\" type=\"button\">글자를 문단에 넣기\u003c/button>\n\u003cp id=\"literal-preview\">아직 글자를 넣지 않았습니다.\u003c/p>\u003cp id=\"text-result\" role=\"status\">\u003c/p>\n\u003cpre>\u003ccode>preview.textContent = input.value;\n// input.value는 입력의 현재 문자열\n// preview.textContent는 문단의 텍스트 내용\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 꺾쇠를 포함한 글자가 그대로 보이고 strong 요소는 0개입니다. textContent는 문자열을 HTML로 해석하지 않습니다. 이름이나 메시지 같은 사용자 입력을 글자로 보여줄 때 이 구분이 필요합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-update-defaults\" aria-labelledby=\"defaults-title\">\n\u003cp class=\"sample-meta\">예제 3-2 · 현재값과 기본값 · value / defaultValue\u003c/p>\u003ch3 id=\"defaults-title\">입력을 바꾸어도 기본값은 남을까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 이름을 바꾸고 체크를 해제한 뒤 값을 읽으면, HTML에 적힌 기본값도 함께 바뀔까요?\u003c/p>\n\u003cform id=\"defaults-form\" class=\"stack\">\n\u003clabel class=\"stack\" for=\"username\">이름\u003cinput id=\"username\" type=\"text\" value=\"민지\" autocomplete=\"off\">\u003c/label>\n\u003clabel class=\"control\" for=\"notifications\">\u003cinput id=\"notifications\" type=\"checkbox\" checked>이메일 알림 받기\u003c/label>\n\u003cdiv class=\"row\">\u003cbutton id=\"read-values\" type=\"button\">현재값과 기본값 읽기\u003c/button>\u003cbutton id=\"change-values\" type=\"button\">코드로 지우 · 알림 꺼짐 넣기\u003c/button>\u003cbutton id=\"reset-values\" type=\"button\">기본값으로 되돌리기\u003c/button>\u003c/div>\n\u003c/form>\n\u003cpre id=\"snapshot\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>username.value = \"지우\";\nnotifications.checked = false;\n// username.defaultValue는 \"민지\"\n// notifications.defaultChecked는 true\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 코드 변경 후 현재값은 “지우”, false이고 기본값은 “민지”, true입니다. 되돌리기는 form.reset()을 호출하므로 기본값이 다시 현재값이 됩니다. 아래 기록은 “읽기”나 코드 변경 버튼을 누른 시점의 값입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-update-boolean\" aria-labelledby=\"boolean-title\">\n\u003cp class=\"sample-meta\">예제 3-3 · HTML 불리언 속성 · 존재 여부\u003c/p>\u003ch3 id=\"boolean-title\">disabled=\"false\"는 활성 상태일까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 아래 입력에 disabled 속성을 문자열 “false”로 붙여보세요. 키보드로 입력할 수 있을까요?\u003c/p>\n\u003clabel class=\"stack\" for=\"boolean-input\">활성 상태를 바꿀 입력\u003cinput id=\"boolean-input\" type=\"text\" value=\"처음에는 입력 가능\" autocomplete=\"off\">\u003c/label>\n\u003cdiv class=\"row\">\u003cbutton id=\"set-disabled-attribute\" type=\"button\">disabled=\"false\" 붙이기\u003c/button>\u003cbutton id=\"clear-disabled\" type=\"button\">disabled = false로 되돌리기\u003c/button>\u003c/div>\n\u003cpre id=\"boolean-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>input.setAttribute(\"disabled\", \"false\"); // 비활성\ninput.disabled = false; // 속성이 없어지고 활성화\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 속성을 붙이면 input.disabled는 true입니다. HTML 불리언 속성은 문자열 내용이 아닌 존재 여부를 봅니다. property에 false를 대입하면 속성이 제거됩니다. ARIA의 “false”나 data 속성에는 이 규칙을 그대로 적용하지 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-update-style\" aria-labelledby=\"style-title\">\n\u003cp class=\"sample-meta\">예제 3-4 · 상태와 시각 표현 · dataset / classList\u003c/p>\u003ch3 id=\"style-title\">data 속성만 바꾸면 색도 바뀔까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: “data 속성에 on 기록”을 누른 뒤 “클래스로 표현 반영”을 눌러보세요. 어느 단계에서 글자색과 굵기가 달라질까요?\u003c/p>\n\u003cp id=\"preview\" data-notifications=\"off\">알림이 꺼져 있어요.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton id=\"set-data\" type=\"button\">data 속성에 on 기록\u003c/button>\u003cbutton id=\"apply-style\" type=\"button\">클래스로 표현 반영\u003c/button>\u003cbutton id=\"reset-style\" type=\"button\">off로 다시 시작\u003c/button>\u003c/div>\n\u003cpre id=\"style-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>preview.dataset.notifications = \"on\";\nconst enabled = preview.dataset.notifications === \"on\";\npreview.classList.toggle(\"status\", enabled);\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 이 예제는 data 속성만으로 스타일을 정하는 CSS가 없습니다. 클래스 반영을 누르면 .status 규칙 때문에 강조되고 문구도 바뀝니다. 같은 상태를 다시 반영해도 모습이 뒤집히지 않습니다. 데이터와 화면의 연결은 작성한 코드가 담당합니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 실행 코드 읽기\u003c/a>\u003c/p>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 읽은 내용을 코드로 확인하고 싶다면\u003c/summary>\u003cp>예제 3-2에서 이름을 바꾸고 체크를 해제한 뒤 “현재값과 기본값 읽기”를 눌러보세요. 현재값은 바뀌지만 기본값을 나타내는 attribute는 남아 있는 이유를 본문에서 찾을 수 있습니다. 더 확인하고 싶다면 코드 변경 버튼에 username.defaultValue 대입을 추가한 뒤 코드를 실행해 현재값과 비교해보세요.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../02-dom/\">← 이전 · 문서와 객체\u003c/a>\u003ca href=\"../04-events/\">다음 · 사용자 행동이 코드에 전달되는 과정 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","03-dom-update/main.js":"// 예제 3-1 · 입력의 value를 읽고 문단의 textContent에 씁니다.\nconst literalInput = document.querySelector(\"#literal-input\");\nconst literalPreview = document.querySelector(\"#literal-preview\");\ndocument.querySelector(\"#apply-text\").addEventListener(\"click\", () => {\n  literalPreview.textContent = literalInput.value;\n  document.querySelector(\"#text-result\").textContent =\n    `문단에 글자를 넣었습니다. 문단 안의 strong 요소: ${literalPreview.querySelectorAll(\"strong\").length}개`;\n});\n\n// 예제 3-2 · 기록은 읽는 함수를 실행한 순간의 값입니다.\nconst username = document.querySelector(\"#username\");\nconst notifications = document.querySelector(\"#notifications\");\nfunction readValues() {\n  document.querySelector(\"#snapshot\").textContent = JSON.stringify({\n    \"value (현재 이름)\": username.value,\n    \"defaultValue (기본 이름)\": username.defaultValue,\n    \"getAttribute('value')\": username.getAttribute(\"value\"),\n    \"checked (현재 선택)\": notifications.checked,\n    \"defaultChecked (기본 선택)\": notifications.defaultChecked,\n    \"hasAttribute('checked')\": notifications.hasAttribute(\"checked\"),\n  }, null, 2);\n}\ndocument.querySelector(\"#read-values\").addEventListener(\"click\", readValues);\ndocument.querySelector(\"#defaults-form\").addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  readValues();\n});\ndocument.querySelector(\"#change-values\").addEventListener(\"click\", () => {\n  username.value = \"지우\";\n  notifications.checked = false;\n  // property 대입은 사용자 input/change 이벤트를 자동 발생시키지 않습니다.\n  readValues();\n});\ndocument.querySelector(\"#reset-values\").addEventListener(\"click\", () => {\n  document.querySelector(\"#defaults-form\").reset();\n  readValues(); // reset() 호출이 끝난 뒤 현재값을 읽습니다.\n});\nreadValues();\n\n// 예제 3-3 · HTML 불리언 속성은 값보다 존재 여부가 중요합니다.\nconst booleanInput = document.querySelector(\"#boolean-input\");\nfunction describeDisabled() {\n  document.querySelector(\"#boolean-result\").textContent = JSON.stringify({\n    \"getAttribute('disabled')\": booleanInput.getAttribute(\"disabled\"),\n    \"hasAttribute('disabled')\": booleanInput.hasAttribute(\"disabled\"),\n    \"disabled property\": booleanInput.disabled,\n  }, null, 2);\n}\ndocument.querySelector(\"#set-disabled-attribute\").addEventListener(\"click\", () => {\n  booleanInput.setAttribute(\"disabled\", \"false\");\n  describeDisabled();\n});\ndocument.querySelector(\"#clear-disabled\").addEventListener(\"click\", () => {\n  booleanInput.disabled = false;\n  describeDisabled();\n});\ndescribeDisabled();\n\n// 예제 3-4 · data 변경과 표현 반영을 일부러 두 단계로 나눕니다.\nconst preview = document.querySelector(\"#preview\");\nfunction describeStyle() {\n  document.querySelector(\"#style-result\").textContent = JSON.stringify({\n    \"dataset.notifications\": preview.dataset.notifications,\n    \"className\": preview.className,\n    \"표시 문구\": preview.textContent,\n  }, null, 2);\n}\nfunction updatePreview() {\n  const enabled = preview.dataset.notifications === \"on\";\n  preview.textContent = `알림이 ${enabled ? \"켜져\" : \"꺼져\"} 있어요.`;\n  preview.classList.toggle(\"status\", enabled);\n  describeStyle();\n}\ndocument.querySelector(\"#set-data\").addEventListener(\"click\", () => {\n  preview.dataset.notifications = \"on\";\n  describeStyle();\n});\ndocument.querySelector(\"#apply-style\").addEventListener(\"click\", updatePreview);\ndocument.querySelector(\"#reset-style\").addEventListener(\"click\", () => {\n  preview.dataset.notifications = \"off\";\n  updatePreview();\n});\ndescribeStyle();\n","04-events/in

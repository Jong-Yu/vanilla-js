dex.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n  \u003ctitle>4장 · 이벤트가 행동을 전달하는 원리\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"../styles.css\">\n  \u003cscript src=\"main.js\" defer>\u003c/script>\n  \u003cstyle>\n    .events-lab #event-zone { padding: 22px; border: 2px dashed var(--line); border-radius: 10px; }\n    .events-lab #event-label { display: inline-block; margin-left: 8px; padding: 6px 10px; background: var(--soft); border-radius: 4px; }\n    .events-lab input[type=\"text\"] { max-width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--control-line); border-radius: 6px; background: var(--surface); color: var(--ink); }\n  \u003c/style>\n\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\" class=\"events-lab\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">4장 · 이벤트가 행동을 전달하는 원리\u003c/p>\u003ch1>이벤트는 어떻게\u003cbr>코드에 도착할까요?\u003c/h1>\u003cp class=\"intro\">이벤트는 발생한 일을 코드에 알려주는 방식입니다. 이벤트를 받는 함수를 등록하는 일부터, 그 함수가 호출되는 시점과 문서 안의 전달 경로까지 차례로 이해합니다.\u003c/p>\u003c/header>\n\u003csection class=\"learning-goals\" aria-labelledby=\"learning-goals-title\">\u003ch2 id=\"learning-goals-title\">이벤트를 읽는 네 가지 기준\u003c/h2>\u003cul>\u003cli>등록할 때와 실제 핸들러가 호출될 때를 구분합니다.\u003c/li>\u003cli>이벤트의 대상과 현재 리스너의 위치를 구분합니다.\u003c/li>\u003cli>이벤트 전파, 기본 동작, 프로그램의 값 대입을 따로 설명합니다.\u003c/li>\u003c/ul>\u003c/section>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003col>\u003cli>\u003ca href=\"#definition\">정의\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#purpose\">왜 필요한가\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#mechanism\">작동 원리\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#reading-code\">작은 코드 읽기\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#comparison\">개념 구분\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#live-example\">실행 예제\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"definition\">\n\u003ch2>이벤트는 발생한 사실을 전달하는 객체입니다\u003c/h2>\n\u003cp>사용자가 버튼을 누르거나 입력창의 내용을 바꾸면 브라우저는 그 일을 자바스크립트 코드에 알려줄 수 있습니다. 이렇게 “무언가 발생했다”는 사실을 전달하는 체계가 \u003cstrong>이벤트\u003c/strong>입니다. 이벤트 자체가 화면을 바꾸는 함수는 아닙니다. 무엇이 일어났는지를 전달하면, 그 사실을 받은 코드가 필요한 일을 결정합니다.\u003c/p>\n\u003cp>코드가 받는 것은 \u003cstrong>이벤트 객체\u003c/strong>입니다. 객체에는 발생한 일의 종류를 나타내는 type, 대상인 target 등의 정보가 들어 있습니다. 키보드 이벤트라면 어떤 키인지, 포인터 이벤트라면 좌표가 무엇인지처럼 종류에 맞는 정보도 포함됩니다. 따라서 “클릭했다”는 사실과 “클릭했으니 문구를 바꾼다”는 처리는 서로 분리됩니다.\u003c/p>\n\u003cp>특정 대상에 특정 종류의 이벤트를 받겠다고 연결하는 것을 \u003cstrong>리스너 등록\u003c/strong>이라고 합니다. 등록된 뒤 실제 처리를 담당하는 함수는 \u003cstrong>이벤트 핸들러\u003c/strong>라고 부릅니다. 실무에서는 리스너라는 말로 이 함수까지 가리키기도 합니다. 중요한 것은 등록 정보와 실행할 함수가 연결된다는 점입니다.\u003c/p>\n\u003cp>이 함수는 우리가 그 자리에서 호출하지 않고 다른 코드에 전달해 둡니다. 전달받은 쪽이 정해진 조건에 호출하는 함수를 \u003cstrong>콜백\u003c/strong>이라고 합니다. 이벤트 핸들러는 콜백의 한 사례입니다. “콜백”은 함수의 문법이나 비동기 실행을 뜻하지 않고, 누가 그 함수를 호출하는지에 관한 말입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"purpose\">\n\u003ch2>발생 사실과 처리 방법을 분리하는 이유\u003c/h2>\n\u003cp>코드를 위에서 아래로 한 번 실행하는 것만으로는 사용자가 나중에 무엇을 누를지 알 수 없습니다. 입력창 값을 계속 반복해서 확인하는 것도 불필요한 일을 늘립니다. 대신 브라우저에 관심 있는 일을 등록해 두면, 그 일이 발생한 순간 필요한 함수를 실행할 수 있습니다. 문서를 준비하는 코드와 사용자 행동에 반응하는 코드가 이 지점에서 연결됩니다.\u003c/p>\n\u003cp>같은 동작은 여러 입력 방식에서 시작될 수도 있습니다. 폼 제출은 제출 버튼으로 시작할 수도 있고 입력창의 Enter 키에서 시작할 수도 있습니다. “어떤 마우스 버튼을 눌렀는가” 대신 “폼을 제출하려 한다”는 이벤트를 처리하면, 입력 수단마다 같은 로직을 중복해서 작성할 필요가 줄어듭니다. 이벤트를 고르는 일은 우리가 어떤 의미의 행동을 처리하려는지 정하는 일이기도 합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"mechanism\">\n\u003ch2>등록, 호출, 전달 경로는 서로 다른 단계입니다\u003c/h2>\n\u003ch3>등록할 때는 함수를 전달합니다\u003c/h3>\n\u003cp>\u003ccode>button.addEventListener(\"click\", handleClick)\u003c/code>은 버튼의 click 이벤트와 handleClick 함수를 연결합니다. 함수 이름 뒤에 괄호가 없으므로 여기서 함수 본문을 실행하지 않습니다. \u003ccode>handleClick()\u003c/code>이라고 쓰면 지금 함수를 호출하고, 그 반환값을 addEventListener에 넘기게 됩니다. 함수 객체를 전달하는 표현과 함수 호출 표현의 차이가 실행 시점을 결정합니다.\u003c/p>\n\u003cp>나중에 이벤트가 전달되면 브라우저가 핸들러를 호출하면서 이벤트 객체를 인수로 줍니다. 핸들러의 매개변수 이름을 event라고 정했다면 그 안에서 event.target을 읽을 수 있습니다. event라는 전역 변수가 자동으로 만들어진다고 이해해서는 안 됩니다. 매개변수를 통해 받은 값을 읽는 것입니다.\u003c/p>\n\u003ch3>브라우저의 사용자 입력과 코드의 직접 전달\u003c/h3>\n\u003cp>사용자의 클릭을 처리하는 일은 일반적으로 현재 실행 중인 자바스크립트 작업이 끝난 뒤 브라우저가 다음 작업으로 진행합니다. 하지만 이벤트 핸들러가 언제나 나중에 호출되는 것은 아닙니다. 코드에서 \u003ccode>dispatchEvent\u003c/code>를 호출하면 그 호출 안에서 관련 핸들러가 실행되고, 처리가 끝나야 다음 줄로 넘어갑니다. 이런 실행을 \u003cstrong>동기 실행\u003c/strong>이라고 합니다.\u003c/p>\n\u003cp>예를 들어 “준비됨”이라는 자체 이벤트를 만들고 전달할 수도 있습니다. 직접 전달한 이벤트는 사용자가 실제로 조작했다는 사실과 같지 않으며, 일반적으로 사용자 입력의 모든 기본 동작을 재현하지도 않습니다. 이벤트를 전달하는 기능과 입력 장치를 흉내 내는 기능을 같은 것으로 생각하지 않는 것이 좋습니다.\u003c/p>\n\u003ch3>문서 안에서 내려갔다 올라오는 경로\u003c/h3>\n\u003cp>버튼 안의 span에서 클릭이 시작되면 이벤트는 해당 요소만의 일이 아닙니다. 대상의 조상에서 대상 쪽으로 내려가는 \u003cstrong>캡처 단계\u003c/strong>, 대상 자체에서 처리하는 단계, 조상 쪽으로 올라가는 \u003cstrong>버블 단계\u003c/strong>로 전달될 수 있습니다. 부모에 기본 방식으로 등록한 click 리스너는 버블 단계에서 호출됩니다. 캡처 시점에 받으려면 등록할 때 capture 옵션을 true로 지정합니다.\u003c/p>\n\u003cp>이 예에서 \u003ccode>target\u003c/code>은 이벤트의 출발 대상인 span이고, \u003ccode>currentTarget\u003c/code>은 지금 실행하는 핸들러가 등록된 요소입니다. 같은 이벤트라도 버튼 핸들러에서는 currentTarget이 버튼, 부모 핸들러에서는 부모입니다. 모든 이벤트가 버블링하는 것은 아니므로 이 경로는 이벤트 종류의 특성과 함께 이해해야 합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"reading-code\">\n\u003ch2>작은 코드에서 호출 시점 읽기\u003c/h2>\n\u003cp>아래는 이미 찾은 button 요소에 notice라는 자체 이벤트를 연결하는 짧은 코드입니다. notice는 예제를 위해 정한 이름이며 버튼의 기본 동작과는 관계가 없습니다.\u003c/p>\n\u003cpre>\u003ccode>function handleNotice(event) {\n  console.log(\"B\", event.type);\n}\nbutton.addEventListener(\"notice\", handleNotice);\nconsole.log(\"A\");\nbutton.dispatchEvent(new Event(\"notice\"));\nconsole.log(\"C\");\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>\u003ccode>function handleNotice(event)\u003c/code>는 함수를 정의합니다. 아직 로그를 출력하지 않으며, 나중에 받은 객체를 event라는 이름으로 읽도록 준비합니다.\u003c/li>\n\u003cli>함수 안의 console.log는 호출될 때만 실행됩니다. 여기서는 B와 이벤트 종류를 출력하는 처리입니다.\u003c/li>\n\u003cli>addEventListener는 함수 자체를 등록합니다. 함수 정의와 등록만 끝난 시점에도 B는 출력되지 않습니다.\u003c/li>\n\u003cli>첫 console.log가 A를 출력합니다. 그다음 new Event는 notice라는 종류의 객체를 만들고 dispatchEvent가 버튼에 전달합니다.\u003c/li>\n\u003cli>전달 도중 핸들러가 호출되어 B와 notice가 출력됩니다. dispatchEvent가 반환한 뒤 마지막 줄이 C를 출력하므로 순서는 A → B → C입니다.\u003c/li>\n\u003c/ol>\n\u003cp>연결이 필요 없어지면 같은 요소에서 같은 종류와 함수로 \u003ccode>removeEventListener(\"notice\", handleNotice)\u003c/code>를 호출합니다. 본문이 같은 새 함수를 만들면 다른 함수 객체이므로 기존 연결을 지우지 못합니다. 캡처로 등록했다면 해제할 때도 같은 capture 값을 사용해야 합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"comparison\">\n\u003ch2>이벤트 전달과 기본 동작을 구분하기\u003c/h2>\n\u003cp>브라우저는 요소에 따라 기본 동작을 제공합니다. 링크의 이동, 폼 제출, 체크박스의 선택 변경 등이 그 예입니다. 이벤트를 받아 실행하는 우리 코드와 이러한 기본 동작은 별개의 부분입니다. 취소 가능한 기본 동작을 막는 \u003ccode>preventDefault\u003c/code>는 이벤트가 부모에 전달되는 것을 막지 않습니다.\u003c/p>\n\u003cp>반대로 \u003ccode>stopPropagation\u003c/code>은 다음 요소로 이벤트가 전파되는 것을 멈춥니다. 폼의 submit 전파를 멈추어도 그 자체로 기본 제출을 취소하지는 않습니다. 이미 실행된 조상의 캡처 핸들러를 되돌리지도 않습니다. “부모가 알지 못하게 한다”와 “브라우저가 원래 하려던 일을 하지 않게 한다”를 구분하면 두 메서드의 역할이 분명해집니다.\u003c/p>\n\u003cp>input, change, submit도 서로 다른 사실을 전달합니다. 텍스트 입력의 input은 사용자 편집으로 값이 바뀌는 동안 발생합니다. change는 값의 변경이 확정될 때 발생하며, 텍스트 입력에서는 값을 바꾼 뒤 포커스를 옮길 때 관찰할 수 있습니다. 체크박스의 change는 선택을 바꾸는 순간 발생합니다. submit은 개별 입력의 변화가 아니라 폼 제출의 시도를 뜻합니다.\u003c/p>\n\u003cp>프로그램에서 value나 checked만 대입하면 input이나 change가 자동으로 발생하지 않습니다. 값이 바뀌었다는 사실과 특정 이벤트가 발생했다는 사실은 같은 조건이 아니기 때문입니다. 화면을 갱신할 목적이라면 필요한 함수를 직접 호출할 수 있으며, 이벤트를 일부러 만들어 보내야 하는 것은 아닙니다.\u003c/p>\n\u003c/section>\n\u003csection id=\"live-example\">\u003ch2>이벤트의 네 가지 질문을 따로 실험하기\u003c/h2>\n\u003cp>언제 호출되는가, 어디로 전달되는가, 기본 동작을 취소하는가, 어떤 변화가 이벤트를 만드는가를 나눠서 봅니다. 한 예제의 조작은 다른 예제의 기록을 바꾸지 않습니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-dispatch\">1. 호출 순서\u003c/a> · \u003ca href=\"#sample-propagation\">2. 전달 경로\u003c/a> · \u003ca href=\"#sample-submit\">3. 기본 동작\u003c/a> · \u003ca href=\"#sample-input-change\">4. 입력과 확정\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-dispatch\" aria-labelledby=\"dispatch-title\">\n\u003cp class=\"sample-meta\">예제 4-1 · 등록과 실행 시점\u003c/p>\u003ch3 id=\"dispatch-title\">dispatchEvent 뒤의 코드는 언제 실행될까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> A, B, C 중 무엇이 먼저 기록될까요? “이벤트는 항상 나중에 실행된다”는 설명으로 맞힐 수 있을까요?\u003c/p>\n\u003cpre>\u003ccode>button.addEventListener(\"notice\", () => log(\"B\"));\nlog(\"A\");\nbutton.dispatchEvent(new Event(\"notice\"));\nlog(\"C\");\u003c/code>\u003c/pre>\n\u003cbutton id=\"dispatch-notice\" type=\"button\">notice 이벤트 전달\u003c/button>\u003cpre id=\"dispatch-result\" role=\"status\">아직 전달하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> A → B → C입니다. 등록만으로 B가 실행되지는 않지만 dispatchEvent가 호출되면 핸들러 실행을 마친 뒤 다음 줄로 갑니다. 버튼을 누를 때마다 로그를 새로 만듭니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-propagation\" aria-labelledby=\"bubble-title\">\n\u003cp class=\"sample-meta\">예제 4-2 · 전달 경로와 대상\u003c/p>\u003ch3 id=\"bubble-title\">하나의 클릭을 세 위치에서 읽기\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> 안쪽 글자를 누르면 target도 리스너 위치마다 바뀔까요? 전파를 멈추면 부모의 캡처 기록도 사라질까요?\u003c/p>\n\u003cpre>\u003ccode>parent.addEventListener(\"click\", log, { capture: true });\nbutton.addEventListener(\"click\", log);\nparent.addEventListener(\"click\", log);\u003c/code>\u003c/pre>\n\u003clabel class=\"control\" for=\"stop-bubbling\">\u003cinput id=\"stop-bubbling\" type=\"checkbox\">버튼에서 stopPropagation() 실행하기\u003c/label>\n\u003cdiv id=\"event-zone\">\u003cbutton id=\"nested-button\" type=\"button\">버튼 영역\u003cspan id=\"event-label\">안쪽 글자(span)\u003c/span>\u003c/button>\u003c/div>\n\u003cp>마우스로 안쪽 글자를 눌러본 다음, Tab으로 버튼에 이동해 Enter나 Space로도 실행해보세요.\u003c/p>\n\u003cbutton id=\"clear-log\" type=\"button\">전파 실험 초기화\u003c/button>\n\u003cpre id=\"event-log\" aria-label=\"클릭 이벤트 로그\">아직 클릭하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 부모 캡처 → 버튼 → 부모 버블 순서입니다. 글자를 직접 누르면 target은 계속 span이고 currentTarget은 리스너가 연결된 요소를 가리킵니다. 키보드로 버튼을 활성화하면 target은 버튼입니다. 전파를 멈추면 마지막 부모 버블 기록만 없어집니다. 매 클릭의 로그를 새로 표시합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-submit\" aria-labelledby=\"form-title\">\n\u003cp class=\"sample-meta\">예제 4-3 · 기본 동작과 전파의 차이\u003c/p>\u003ch3 id=\"form-title\">제출을 취소해도 부모가 알 수 있을까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> preventDefault를 호출하면 submit이 부모에게도 전달되지 않을까요?\u003c/p>\n\u003cpre>\u003ccode>form.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  show(input.value);\n});\u003c/code>\u003c/pre>\n\u003cform id=\"message-form\" class=\"stack\">\n\u003clabel class=\"stack\" for=\"message\">제출할 문구\u003cinput id=\"message\" name=\"message\" type=\"text\" value=\"안녕하세요\" autocomplete=\"off\">\u003c/label>\n\u003cdiv class=\"row\">\u003cbutton type=\"submit\" class=\"primary\">문구 제출\u003c/button>\u003cbutton id=\"reset-submit\" type=\"button\">제출 실험 초기화\u003c/button>\u003c/div>\n\u003c/form>\n\u003cp id=\"submit-result\" role=\"status\">아직 제출하지 않았습니다.\u003c/p>\n\u003cp id=\"submit-parent\">부모에서 받은 submit: 0회\u003c/p>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 페이지는 이동하지 않지만 부모의 submit 횟수는 증가합니다. 문구 입력창에서 Enter를 눌러도 같은 처리가 실행됩니다. submit을 처리하면 입력 수단마다 로직을 반복하지 않아도 됩니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-input-change\" aria-labelledby=\"change-title\">\n\u003cp class=\"sample-meta\">예제 4-4 · 값 변경과 이벤트 발생\u003c/p>\u003ch3 id=\"change-title\">입력 중, 입력 확정, 코드 대입 비교\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> 한 글자를 입력한 순간과 Tab으로 나간 순간은 같은 이벤트일까요? 코드로 value를 바꾸면 어떤 이벤트가 생길까요?\u003c/p>\n\u003cpre>\u003ccode>input.addEventListener(\"input\", record);\ninput.addEventListener(\"change\", record);\ninput.value = \"코드에서 넣은 값\"; // 이벤트를 보내지는 않음\u003c/code>\u003c/pre>\n\u003clabel class=\"stack\" for=\"typing-input\">직접 입력할 문구\u003cinput id=\"typing-input\" type=\"text\" value=\"\" autocomplete=\"off\">\u003c/label>\n\u003cdiv class=\"row\">\u003cbutton id=\"assign-value\" type=\"button\">코드로 value 대입\u003c/button>\u003cbutton id=\"reset-input-events\" type=\"button\">입력 실험 초기화\u003c/button>\u003c/div>\n\u003cpre id=\"input-event-log\" aria-label=\"입력 이벤트 기록\">input: 0회 · change: 0회\u003c/pre>\n\u003cp id=\"assignment-notice\" role=\"status\">아직 코드로 대입하지 않았습니다.\u003c/p>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 직접 편집하는 동안 input이 발생하고, 값을 바꾼 뒤 포커스를 옮기면 change가 발생합니다. 코드 대입 자체는 둘 다 발생시키지 않습니다. 다만 입력을 마치고 버튼으로 이동할 때 생긴 change와 버튼의 대입은 별개입니다. 한글 입력은 조합 과정에 따라 input 횟수가 다를 수 있습니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 JavaScript 전체 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cp class=\"muted\">개념 참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/dispatchEvent\">MDN · 이벤트의 직접 전달\u003c/a> · \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Element/input_event\">MDN · 입력 이벤트\u003c/a> · \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Event/preventDefault\">MDN · 기본 동작 취소\u003c/a>.\u003c/p>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 이벤트 전파를 한 번 더 추적하기\u003c/summary>\u003cp>예제 4-2에서 부모의 캡처 리스너 등록을 찾아 \u003ccode>{ capture: true }\u003c/code>를 제거해보세요. 순서가 어떻게 바뀌는지 설명해보세요. 같은 대상에 같은 이벤트 종류와 같은 함수 객체를 같은 capture 값으로 다시 등록하면 중복 등록되지 않는다는 점도 함께 확인할 수 있습니다.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../03-dom-update/\">← 이전 · DOM 내용과 속성\u003c/a>\u003ca href=\"../05-dom-create/\">다음 · 문서 구조 만들기 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>\n","04-events/main.js":"// 4-1. 직접 전달하는 이벤트는 dispatchEvent 호출 안에서 처리됩니다.\n{\n  const button = document.querySelector(\"#dispatch-notice\");\n  const result = document.querySelector(\"#dispatch-result\");\n  let steps = [];\n  function log(step) {\n    steps.push(step);\n  }\n  button.addEventListener(\"notice\", () => log(\"B\"));\n  button.addEventListener(\"click\", () => {\n    steps = [];\n    log(\"A\");\n    button.dispatchEvent(new Event(\"notice\"));\n    log(\"C\");\n    result.textContent = steps.join(\" → \");\n  });\n}\n\n// 4-2. 같은 이벤트의 target과 currentTarget을 단계마다 읽습니다.\n{\n  const button = document.querySelector(\"#nested-button\");\n  const parent = document.querySelector(\"#event-zone\");\n  const stopBubbling = document.querySelector(\"#stop-bubbling\");\n  const result = document.querySelector(\"#event-log\");\n  function log(event) {\n    const phase = event.currentTarget === button\n      ? \"버튼\"\n      : event.eventPhase === Event.CAPTURING_PHASE ? \"부모 캡처\" : \"부모 버블\";\n    result.textContent += `${phase} | target: #${event.target.id} | currentTarget: #${event.currentTarget.id}\\n`;\n  }\n  // 캡처가 먼저 도착하므로 지난 클릭의 기록은 여기에서 비웁니다.\n  parent.addEventListener(\"click\", () => { result.textContent = \"\"; }, { capture: true });\n  parent.addEventListener(\"click\", log, { capture: true });\n  button.addEventListener(\"click\", (event) => {\n    log(event);\n    if (stopBubbling.checked) {\n      event.stopPropagation();\n      result.textContent += \"→ 버튼에서 이후 전파를 멈췄습니다.\\n\";\n    }\n  });\n  parent.addEventListener(\"click\", log);\n  document.querySelector(\"#clear-log\").addEventListener(\"click\", () => {\n    stopBubbling.checked = false;\n    result.textContent = \"아직 클릭하지 않았습니다.\";\n  });\n}\n\n// 4-3. 기본 제출을 취소해도 submit은 부모로 전달됩니다.\n{\n  const form = document.querySelector(\"#message-form\");\n  const input = document.querySelector(\"#message\");\n  const result = document.querySelector(\"#submit-result\");\n  const parentResult = document.querySelector(\"#submit-parent\");\n  let submits = 0;\n  let parentSubmits = 0;\n  form.addEventListener(\"submit\", (event) => {\n    event.preventDefault();\n    submits += 1;\n    result.textContent = `submit ${submits}회 · \"${input.value}\"를 읽었습니다. 페이지는 이동하지 않습니다.`;\n  });\n  document.querySelector(\"#sample-submit\").addEventListener(\"submit\", (event) => {\n    parentSubmits += 1;\n    parentResult.textContent = `부모에서 받은 submit: ${parentSubmits}회 · defaultPrevented: ${event.defaultPrevented}`;\n  });\n  document.querySelector(\"#reset-submit\").addEventListener(\"click\", () => {\n    form.reset();\n    submits = 0;\n    parentSubmits = 0;\n    result.textContent = \"아직 제출하지 않았습니다.\";\n    parentResult.textContent = \"부모에서 받은 submit: 0회\";\n  });\n}\n\n// 4-4. 사용자 편집과 프로그램 대입은 서로 다른 경로입니다.\n{\n  const input = document.querySelector(\"#typing-input\");\n  const result = document.querySelector(\"#input-event-log\");\n  const notice = document.querySelector(\"#assignment-notice\");\n  let inputs = 0;\n  let changes = 0;\n  function record(event) {\n    if (event.type === \"input\") inputs += 1;\n    if (event.type === \"change\") changes += 1;\n    result.textContent = `input: ${inputs}회 · change: ${changes}회\\n마지막 이벤트: ${event.type}\\n그때의 value: ${input.value}`;\n  }\n  input.addEventListener(\"input\", record);\n  input.addEventListener(\"change\", record);\n  document.querySelector(\"#assign-value\").addEventListener(\"click\", () => {\n    const before = `input ${inputs}회 / change ${changes}회`;\n    input.value = \"코드에서 넣은 값\";\n    notice.textContent = `대입 직전: ${before} → 대입 직후: input ${inputs}회 / change ${changes}회. 이벤트 횟수는 그대로입니다.`;\n  });\n  document.querySelector(\"#reset-input-events\").addEventListener(\"click\", () => {\n    input.value = \"\";\n    inputs = 0;\n    changes = 0;\n    result.textContent = \"input: 0회 · change: 0회\";\n    notice.textContent = \"아직 코드로 대입하지 않았습니다.\";\n  });\n}\n","05-dom-create/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>5장 · DOM 트리의 생성과 변경\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">5장 · DOM 트리의 생성과 변경\u003c/p>\u003ch1>요소 객체는 어떻게\u003cbr>화면의 일부가 될까요?\u003c/h1>\u003cp class=\"intro\">요소를 만드는 일과 문서에 붙이는 일은 별개의 과정입니다. 요소가 가진 정체성과 부모·자식 관계를 이해하면, 목록을 조립하고 이동하고 제거하는 코드의 의미를 읽을 수 있습니다.\u003c/p>\u003c/header>\n\u003caside class=\"learning-goals\" aria-label=\"이 장의 학습 목표\">\u003cstrong>이 장을 읽고 설명할 수 있는 것\u003c/strong>\u003cul>\u003cli>요소를 만드는 일과 문서에 연결하는 일의 차이\u003c/li>\u003cli>같은 객체를 이동하는 것과 별개 객체를 복제하는 것의 차이\u003c/li>\u003cli>동적으로 만든 항목의 이벤트와 삭제 후 포커스를 관리하는 방법\u003c/li>\u003c/ul>\u003c/aside>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003col>\u003cli>\u003ca href=\"#definition\">정의\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#purpose\">왜 필요한가\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#mechanism\">작동 원리\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#reading-code\">작은 코드 읽기\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#comparison\">개념 구분\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#live-example\">실행 예제\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n\u003cnav class=\"sample-links\" aria-label=\"작은 예제로 바로 이동\">\u003ca href=\"#sample-create-connect\">5-1 생성과 연결\u003c/a>\u003ca href=\"#sample-create-identity\">5-2 이동과 복제\u003c/a>\u003ca href=\"#sample-create-delegation\">5-3 동적 목록과 위임\u003c/a>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"definition\">\n\u003ch2>노드 객체와 문서의 연결은 별개의 개념입니다\u003c/h2>\n\u003cp>DOM은 문서를 객체들의 관계로 표현합니다. 이 구조에 참여하는 객체를 \u003cstrong>노드\u003c/strong>라고 하며, 요소와 텍스트는 서로 다른 종류의 노드입니다. li 요소를 만든다는 것은 메모리에 그 요소를 나타내는 객체를 만든다는 뜻입니다. 객체를 만들었다는 사실만으로 현재 문서의 목록에 항목이 하나 생기는 것은 아닙니다.\u003c/p>\n\u003cp>문서의 구조를 이루는 것은 객체의 존재뿐 아니라 객체 사이의 \u003cstrong>부모·자식 관계\u003c/strong>입니다. 어느 ul의 자식으로 li를 연결하면 그 li가 해당 목록에 속하게 됩니다. 연결하기 전의 li는 이미 속성과 자식을 가질 수 있지만, 아직 화면의 문서와 연결되지 않았습니다. 이를 문서에서 분리된 상태라고 생각하면 됩니다.\u003c/p>\n\u003cp>문서에 연결되는 것과 실제 화면에 보이는 것도 완전히 같은 말은 아닙니다. 브라우저는 DOM과 CSS 등을 바탕으로 요소의 크기와 위치를 계산하고 화면을 그립니다. 이 과정을 \u003cstrong>렌더링\u003c/strong>이라고 합니다. 문서에 연결되어 있어도 숨김 스타일이 적용되면 보이지 않을 수 있고, DOM 변경 직후 자바스크립트에서 구조를 읽을 수 있다는 사실이 그 순간 화면 그리기까지 끝났다는 뜻은 아닙니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"purpose\">\n\u003ch2>객체를 만든 뒤 연결하는 방식이 필요한 이유\u003c/h2>\n\u003cp>HTML 파일에는 처음부터 알고 있는 구조를 선언할 수 있습니다. 하지만 사용자가 새 주제를 입력할 때마다 항목이 늘어나는 화면은 나중에 문서 구조를 바꾸어야 합니다. 자바스크립트가 새 객체를 만들고 기존 부모에 연결하면, 처음 HTML에 없던 항목도 문서에 추가할 수 있습니다.\u003c/p>\n\u003cp>생성과 연결을 나누면 화면에 붙이기 전에 작은 구조를 조립할 수 있습니다. 목록 항목을 위한 li를 만들고, 이름을 보여줄 span과 삭제할 button을 그 안에 넣은 다음 완성한 li를 목록에 붙이는 방식입니다. 이 순서는 어떤 요소가 무엇을 포함하는지 코드에 드러나게 합니다. 데이터가 준비되지 않은 반쪽 구조를 여러 위치에서 고치는 대신 한 항목을 구성하는 책임을 한 함수로 모을 수도 있습니다.\u003c/p>\n\u003cp>이 단계에서 중요한 것은 API 이름을 많이 기억하는 일이 아니라, 각 문장이 객체를 만드는지, 내용을 바꾸는지, 연결 관계를 바꾸는지 구분하는 일입니다. 화면에 보이지 않는 문제가 생겨도 객체 생성의 실패인지, 연결 누락인지, 스타일의 문제인지 나누어 살펴볼 수 있기 때문입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"mechanism\">\n\u003ch2>문서 구조를 조립하는 실행 흐름\u003c/h2>\n\u003cp>\u003ccode>document.createElement(\"li\")\u003c/code>는 li 요소 객체를 반환합니다. 변수에 담으면 그 변수가 객체를 가리키며, textContent 같은 속성을 바꾸어 내용을 채울 수 있습니다. 부모의 \u003ccode>append\u003c/code>에 요소를 전달하면 부모의 마지막 자식으로 연결됩니다. append는 새 객체를 만드는 명령이 아니라 이미 있는 객체의 위치를 정하는 명령입니다.\u003c/p>\n\u003cp>목록 예제는 입력값에서 앞뒤 공백을 제거하고 비어 있지 않은지 확인한 다음 요소를 만듭니다. 사용자에게 보여줄 문구는 span의 textContent에 넣습니다. 삭제 버튼은 button으로 만들고 type을 button으로 지정합니다. 이 버튼의 의미는 목록 항목 삭제이며, 폼 안에 놓이더라도 원치 않는 제출을 시작하지 않도록 역할을 분명히 하는 것입니다.\u003c/p>\n\u003cp>그다음 이름과 버튼을 li에 연결하고, li를 ul에 연결합니다. 이때부터 문서의 검색으로 새 항목을 찾을 수 있습니다. 마지막으로 항목 수 안내를 갱신하고 입력창을 비웁니다. 자식 요소의 개수가 변했다고 별도의 안내 문구까지 자동으로 바뀌는 것은 아니므로, 구조 변경과 안내 갱신을 순서대로 실행합니다.\u003c/p>\n\u003ch3>부모가 자식의 행동을 관리하는 방식\u003c/h3>\n\u003cp>항목을 만들 때마다 삭제 버튼에 함수를 연결할 수도 있습니다. 여기서는 목록 부모에 click 리스너를 한 번 연결하고, 자식에서 올라온 클릭을 처리합니다. 이벤트의 버블링을 이용해 여러 자식의 처리를 부모에게 맡기는 방식을 \u003cstrong>이벤트 위임\u003c/strong>이라고 합니다. 부모 리스너는 새 자식이 추가되기 전부터 존재하므로, 나중에 생긴 버튼도 같은 규칙으로 처리할 수 있습니다.\u003c/p>\n\u003cp>부모가 모든 클릭을 삭제로 처리하면 안 됩니다. 실제로 누른 대상인 event.target에서 삭제 버튼을 찾아야 합니다. 버튼 안에 span이나 아이콘이 들어갈 수 있으므로, target 자체부터 조상 방향으로 조건에 맞는 요소를 찾는 \u003ccode>closest\u003c/code>를 사용합니다. 찾은 버튼이 현재 목록 안에 있는지 확인한 뒤 그 버튼이 속한 li를 제거합니다. 위임은 자식별 등록을 줄여주지만, 처리할 대상을 정확히 판별하는 책임을 부모에 둡니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"reading-code\">\n\u003ch2>네 줄로 보는 생성과 연결\u003c/h2>\n\u003cp>아래 코드에서 list는 이미 문서에 있는 ul 요소를 가리킨다고 가정합니다. 문자 “DOM 익히기”가 곧바로 화면에 나타나는 것이 아니라, 객체의 내용이 된 다음 문서에 연결됩니다.\u003c/p>\n\u003cpre>\u003ccode>const item = document.createElement(\"li\");\nitem.textContent = \"DOM 익히기\";\nlist.append(item);\nitem.remove();\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>첫 줄은 새 요소 객체를 만듭니다. item은 그 객체를 가리키는 변수이고, 아직 list와 부모·자식 관계가 없습니다.\u003c/li>\n\u003cli>둘째 줄은 객체의 내용을 텍스트로 채웁니다. 요소 안에 텍스트 노드가 생기지만 item 자체는 여전히 문서 밖에 있습니다.\u003c/li>\n\u003cli>셋째 줄은 item을 list의 마지막 자식으로 연결합니다. 이 뒤에 list.children을 읽으면 추가된 항목이 포함됩니다.\u003c/li>\n\u003cli>넷째 줄은 item을 부모에서 떼어냅니다. item 변수는 여전히 같은 객체를 가리키며, 내용도 읽을 수 있습니다. 다시 append하면 그 객체를 다시 연결할 수 있습니다.\u003c/li>\n\u003c/ol>\n\u003cp>위 네 줄을 한 번에 실행하면 추가 직후 제거되므로 사용자에게 중간 상태가 보이지 않을 수 있습니다. 자바스크립트는 연결과 제거를 모두 수행했지만, 브라우저가 화면을 그릴 때는 이미 제거된 구조를 볼 수 있기 때문입니다. 문서 구조가 바뀐 순서와 사용자가 눈으로 본 프레임을 같은 것으로 생각하지 않는 것이 중요합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"comparison\">\n\u003ch2>같은 모양, 같은 객체, 복사된 객체\u003c/h2>\n\u003cp>내용이 똑같은 li 두 개도 각각 createElement로 만들었다면 서로 다른 객체입니다. 반대로 하나의 item을 여러 변수에 담아도 객체가 복제되지는 않습니다. 두 변수가 같은 대상을 가리킬 뿐입니다. 객체가 바로 그 객체라는 성질을 \u003cstrong>정체성\u003c/strong>이라고 하며, DOM을 다룰 때 위치나 모양과 구분해야 합니다.\u003c/p>\n\u003cp>같은 요소를 다른 부모에 append하면 기존 자리에서 빠져 새 자리로 이동합니다. 같은 부모에 다시 append하면 맨 뒤로 이동합니다. 한 객체가 문서의 두 위치에 동시에 놓일 수는 없습니다. 여러 항목을 만들려는 반복문에서 요소 하나만 만들어 계속 붙이면, 항목 수가 늘지 않는 이유도 여기에 있습니다. 이동은 객체 자체를 유지하므로 그 객체에 직접 연결한 이벤트 리스너도 유지됩니다.\u003c/p>\n\u003cp>별개의 복사본이 필요하면 \u003ccode>cloneNode\u003c/code>를 사용할 수 있습니다. true를 전달하면 자식까지 복사하며 복사본은 원본과 별도의 객체입니다. 원본을 바꾸어도 복사본이 자동으로 따라 바뀌지는 않습니다. 속성도 복사되므로 id가 있다면 같은 문서에서 중복되지 않게 바꾸어야 합니다. addEventListener로 등록한 리스너는 복사되지 않습니다. 다만 부모에 위임한 이벤트는 복사본도 부모 안에 들어오면 같은 규칙으로 처리할 수 있습니다.\u003c/p>\n\u003ch3>텍스트를 넣는 일과 HTML을 해석하는 일\u003c/h3>\n\u003cp>textContent는 문자열을 글자로 넣습니다. 사용자가 \u003ccode>&lt;strong&gt;안녕&lt;/strong&gt;\u003c/code>이라고 입력해도 strong 요소를 만들지 않고 꺾쇠까지 표시합니다. 반면 HTML로 해석해서 넣는 방식은 문자열을 구조로 바꿉니다. 사용자가 입력한 이름처럼 내용만 필요한 경우에는 textContent를 사용하면 입력이 의도하지 않은 문서 구조가 되는 일을 피할 수 있습니다.\u003c/p>\n\u003cp>textContent를 부모 li에 대입하면 기존 자식이 텍스트로 교체된다는 점도 기억해야 합니다. 이름과 삭제 버튼을 이미 붙인 뒤 li.textContent를 바꾸면 버튼도 사라집니다. 항목의 이름만 바꾸려면 이름을 맡은 span의 내용을 수정해야 합니다. 어떤 객체의 어느 부분을 바꾸는지가 결과를 결정합니다.\u003c/p>\n\u003ch3>현재 구조와 예전에 검색한 목록\u003c/h3>\n\u003cp>\u003ccode>querySelectorAll\u003c/code>은 검색한 시점의 결과를 담은 정적인 NodeList를 반환합니다. 나중에 항목을 추가해도 전에 얻어둔 목록의 길이는 늘지 않습니다. 반면 부모의 children은 현재 자식 요소의 변화를 반영하는 목록입니다. 어떤 컬렉션을 읽는지에 따라 “항목 수”의 기준 시점이 달라집니다. 현재 개수가 필요하면 다시 검색하거나 현재 children을 읽어야 합니다.\u003c/p>\n\u003c/section>\n\u003csection id=\"live-example\">\u003ch2>작은 예제 · 생성, 연결, 행동을 차례로 나누기\u003c/h2>\u003cp>먼저 객체 하나의 연결을 관찰하고, 이동과 복제를 비교한 뒤, 마지막 예제에서 목록 만들기와 이벤트 위임을 조합합니다. 세 예제의 데이터는 서로 독립적입니다.\u003c/p>\n\u003csection class=\"demo sample\" id=\"sample-create-connect\" aria-labelledby=\"connect-title\">\n\u003cp class=\"sample-meta\">예제 5-1 · 객체와 문서의 관계 · createElement / append / remove\u003c/p>\u003ch3 id=\"connect-title\">만든 요소는 언제 문서에 나타날까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 이 예제는 시작할 때 li 객체를 하나 만들었습니다. 아직 아래 목록이 비어 있는 이유는 무엇일까요?\u003c/p>\n\u003cul id=\"connection-list\" aria-label=\"요소를 붙일 목록\">\u003c/ul>\n\u003cdiv class=\"row\">\u003cbutton id=\"connect-node\" type=\"button\">같은 요소 연결하기\u003c/button>\u003cbutton id=\"detach-node\" type=\"button\">요소 떼어내기\u003c/button>\u003c/div>\n\u003cpre id=\"connection-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>const item = document.createElement(\"li\");\nitem.textContent = \"연결을 기다리는 항목\";\nlist.append(item);\nitem.remove();\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 처음에는 isConnected가 false이고, 연결하면 true, 떼어내면 다시 false입니다. 떼어낸 뒤에도 변수에 남은 객체의 글자를 읽을 수 있습니다. 여러 번 연결해도 같은 객체이므로 항목은 1개입니다. 두 버튼으로 언제든 같은 실험을 반복할 수 있습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-create-identity\" aria-labelledby=\"identity-title\">\n\u003cp class=\"sample-meta\">예제 5-2 · 객체의 정체성 · 이동 / 복제\u003c/p>\u003ch3 id=\"identity-title\">다른 목록에 붙이면 이동할까요, 늘어날까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 왼쪽에 있는 원본을 오른쪽에 append하면 총 항목 수가 늘어날까요? cloneNode로 복사한 뒤 붙이면 어떨까요?\u003c/p>\n\u003cdiv class=\"two-views\">\u003cdiv>\u003ch4>왼쪽 목록\u003c/h4>\u003cul id=\"identity-left\">\u003cli>원본 항목\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch4>오른쪽 목록\u003c/h4>\u003cul id=\"identity-right\">\u003c/ul>\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton id=\"move-node\" type=\"button\">원본을 오른쪽으로 이동\u003c/button>\u003cbutton id=\"clone-node\" type=\"button\">원본 복사본을 오른쪽에 추가\u003c/button>\u003cbutton id=\"reset-identity\" type=\"button\">원본 하나로 다시 시작\u003c/button>\u003c/div>\n\u003cpre id=\"identity-result\" role=\"status\">\u003c/pre>\n\u003cpre>\u003ccode>right.append(original); // 원본의 위치만 변경\nconst copy = original.cloneNode(true);\nright.append(copy); // 별개 객체를 추가\noriginal === copy; // false\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 이동만 하면 전체 1개, 첫 복제 후에는 2개가 됩니다. 글자와 모양이 같아도 복사본은 다른 객체입니다. 이 원본에는 id가 없습니다. id가 있는 요소를 복제한다면 문서에서 중복되지 않도록 바꾸어야 하며, addEventListener로 등록한 함수도 자동 복사되지 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-create-delegation\" aria-labelledby=\"list-title\">\n\u003cp class=\"sample-meta\">예제 5-3 · 개념 조합 · 생성 + 연결 + 이벤트 위임\u003c/p>\u003ch3 id=\"list-title\">나중에 생긴 버튼의 클릭은 누가 받을까요?\u003c/h3>\n\u003cp class=\"prediction\">예상하기: 삭제 리스너는 목록에 한 번만 등록했습니다. 새 주제를 추가해도 그 항목의 삭제 버튼이 동작할까요?\u003c/p>\n\u003cform id=\"task-form\" class=\"stack\">\u003clabel for=\"task-input\">추가할 주제\u003c/label>\u003cdiv class=\"row\">\u003cinput id=\"task-input\" type=\"text\" placeholder=\"예: classList 사용해보기\" maxlength=\"100\" required>\u003cbutton class=\"primary\" type=\"submit\">추가\u003c/button>\u003cbutton id=\"reset-tasks\" type=\"button\">처음 두 항목으로 되돌리기\u003c/button>\u003c/div>\u003c/form>\n\u003cul id=\"task-list\" class=\"task-list\">\u003c/ul>\u003cp id=\"task-status\" role=\"status\">\u003c/p>\n\u003cpre>\u003ccode>list.addEventListener(\"click\", (event) =&gt; {\n  if (!(event.target instanceof Element)) return;\n  const button = event.target.closest(\"button[data-action='remove']\");\n  if (!button || !list.contains(button)) return;\n  // 버튼이 속한 항목을 찾고, 다음 포커스를 정한 뒤 제거합니다.\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과:\u003c/strong> 새 항목도 같은 부모를 통해 삭제됩니다. 글자 부분을 누르면 삭제되지 않습니다. 삭제 버튼에는 주제 이름을 포함한 접근 가능한 이름이 있습니다. 키보드로 삭제하면 다음 항목, 없으면 이전 항목의 삭제 버튼으로 이동하며, 목록이 비면 입력으로 돌아갑니다.\u003c/p>\n\u003cp>실행 순서: 주제를 입력하고 Enter → 새 항목의 삭제 버튼까지 Tab → Enter로 삭제 → 포커스가 이어지는 위치 확인. 입력한 태그 모양의 문자열도 문서 구조가 아닌 글자로 표시됩니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 실행 코드 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cp class=\"muted\">개념 참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/appendChild\">노드 연결과 이동\u003c/a> · \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/cloneNode\">노드 복제\u003c/a> · \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent\">텍스트 내용\u003c/a>.\u003c/p>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 같은 객체를 맨 앞으로 옮기기\u003c/summary>\u003cp>코드 보기에서 이동 버튼을 하나 추가하고, 버튼을 누르면 list.lastElementChild를 list.prepend로 전달하도록 수정 후 실행하세요. 마지막 항목이 맨 앞으로 가도 개수는 그대로입니다.\u003c/p>\u003cp>목록이 비었을 때 lastElementChild는 null이므로 먼저 검사합니다. 이 연습의 목적은 새 항목을 만드는 것이 아니라 이미 있는 객체의 부모 안 위치를 바꾸는 과정을 확인하는 것입니다.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../04-events/\">← 이전 · 이벤트\u003c/a>\u003ca href=\"../06-state-render/\">다음 · 상태와 화면 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>\n","05-dom-create/main.js":"// 예제 5-1 · 문서에 연결되지 않은 객체도 값을 가집니다.\nconst connectionList = document.querySelector(\"#connection-list\");\nconst detachedItem = document.createElement(\"li\");\ndetachedItem.textContent = \"연결을 기다리는 항목\";\nfunction describeConnection() {\n  document.querySelector(\"#connection-result\").textContent = JSON.stringify({\n    \"item.isConnected\": detachedItem.isConnected,\n    \"item.parentElement\": detachedItem.parentElement?.tagName ?? null,\n    \"item.textContent\": detachedItem.textContent,\n    \"목록의 요소 수\": connectionList.children.length,\n  }, null, 2);\n}\ndocument.querySelector(\"#connect-node\").addEventListener(\"click\", () => {\n  connectionList.append(detachedItem);\n  describeConnection();\n});\ndocument.querySelector(\"#detach-node\").addEventListener(\"click\", () => {\n  detachedItem.remove();\n  describeConnection();\n});\ndescribeConnection();\n\n// 예제 5-2 · 이동은 같은 객체를, 복제는 새 객체를 사용합니다.\nconst left = document.querySelector(\"#identity-left\");\nconst right = document.querySelector(\"#identity-right\");\nconst original = left.querySelector(\"li\");\nlet identityMessage = \"처음에는 왼쪽에 원본 하나만 있습니다.\";\nfunction describeIdentity() {\n  document.querySelector(\"#identity-result\").textContent =\n    `${identityMessage}\\n왼쪽: ${left.children.length}개 / 오른쪽: ${right.children.length}개\\n전체: ${left.children.length + right.children.length}개\\n원본의 부모: ${original.parentElement.id}`;\n}\ndocument.querySelector(\"#move-node\").addEventListener(\"click\", () => {\n  right.append(original);\n  identityMessage = \"같은 원본을 오른쪽 목록의 마지막으로 이동했습니다.\";\n  describeIdentity();\n});\ndocument.querySelector(\"#clone-node\").addEventListener(\"click\", () => {\n  const copy = original.cloneNode(true);\n  right.append(copy);\n  identityMessage = `복사본을 추가했습니다. original === copy: ${original === copy}`;\n  describeIdentity();\n});\ndocument.querySelector(\"#reset-identity\").addEventListener(\"click\", () => {\n  left.replaceChildren(original);\n  right.replaceChildren();\n  identityMessage = \"같은 원본 하나를 왼쪽으로 되돌리고 복사본을 제거했습니다.\";\n  describeIdentity();\n});\ndescribeIdentity();\n\n// 예제 5-3 · 생성과 연결을 한 항목을 만드는 함수로 모읍니다.\nconst form = document.querySelector(\"#task-form\");\nconst taskInput = document.querySelector(\"#task-input\");\nconst list = document.querySelector(\"#task-list\");\nconst taskStatus = document.querySelector(\"#task-status\");\nconst initialTopics = [\"DOM 구조 읽기\", \"요소 직접 만들기\"];\n\nfunction updateCount(message) {\n  taskStatus.textContent = `${message} 현재 ${list.children.length}개입니다.`;\n}\nfunction addTask(text) {\n  const item = document.createElement(\"li\");\n  const label = document.createElement(\"span\");\n  const removeButton = document.createElement(\"button\");\n  label.textContent = text;\n  removeButton.type = \"button\";\n  removeButton.textContent = \"삭제\";\n  removeButton.dataset.action = \"remove\";\n  removeButton.setAttribute(\"aria-label\", `${text} 삭제`);\n  item.append(label, removeButton);\n  list.append(item);\n}\nfunction resetTasks() {\n  list.replaceChildren();\n  for (const topic of initialTopics) addTask(topic);\n  updateCount(\"처음 두 항목입니다.\");\n}\nform.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  const text = taskInput.value.trim();\n  if (text === \"\") {\n    taskStatus.textContent = \"공백이 아닌 주제를 입력하세요.\";\n    taskInput.focus();\n    return;\n  }\n  addTask(text);\n  taskInput.value = \"\";\n  taskInput.focus();\n  updateCount(`${text} 주제를 추가했습니다.`);\n});\n// 부모에 한 번 등록한 리스너가 나중에 추가한 자식의 클릭도 받습니다.\nlist.addEventListener(\"click\", (event) => {\n  if (!(event.target instanceof Element)) return;\n  const removeButton = event.target.closest(\"button[data-action='remove']\");\n  if (!removeButton || !list.contains(removeButton)) return;\n  const item = removeButton.closest(\"li\");\n  const text = item.querySelector(\"span\").textContent;\n  // 포커스된 요소가 사라지기 전에 다음으로 이어갈 대상을 정합니다.\n  const neighbor = item.nextElementSibling ?? item.previousElementSibling;\n  const nextFocus = neighbor?.querySelector(\"button\") ?? taskInput;\n  item.remove();\n  nextFocus.focus();\n  updateCount(`${text} 주제를 삭제했습니다.`);\n});\ndocument.querySelector(\"#reset-tasks\").addEventListener(\"click\", resetTasks);\nresetTasks();\n","06-state-render/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>6장 · 상태와 화면의 연결\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">6장 · 상태와 화면의 연결\u003c/p>\u003ch1>데이터와 화면은\u003cbr>어떻게 일치할까요?\u003c/h1>\u003cp class=\"intro\">화면에 나타내는 사실을 어디에 저장하고, 어떤 코드가 그 사실을 DOM에 반영하는지 살펴봅니다. 상태와 파생값, 갱신 함수, 값을 결정하는 주체를 차례로 구분합니다.\u003c/p>\u003c/header>\n\u003csection class=\"learning-goals\" aria-labelledby=\"learning-goals-title\">\u003ch2 id=\"learning-goals-title\">상태를 설계할 때 먼저 정할 것\u003c/h2>\u003cul>\u003cli>어떤 값이 원본 상태이고 어떤 값이 계산된 표현인지 정합니다.\u003c/li>\u003cli>메모리의 값과 DOM의 값을 구분하고 둘을 연결하는 코드를 찾습니다.\u003c/li>\u003cli>여러 입력 경로가 같은 변경 함수를 거치도록 구성합니다.\u003c/li>\u003c/ul>\u003c/section>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003col>\u003cli>\u003ca href=\"#definition\">정의\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#purpose\">왜 필요한가\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#mechanism\">작동 원리\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#reading-code\">작은 코드 읽기\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#comparison\">개념 구분\u003c/a>\u003c/li>\u003cli>\u003ca href=\"#live-example\">실행 예제\u003c/a>\u003c/li>\u003c/ol>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"definition\">\n\u003ch2>상태는 프로그램이 기억하는 현재의 사실입니다\u003c/h2>\n\u003cp>알림이 켜져 있는지, 어떤 탭을 선택했는지, 입력한 문장이 무엇인지처럼 프로그램이 현재 기억해야 하는 값을 \u003cstrong>상태\u003c/strong>라고 부릅니다. 특별한 객체 종류나 예약어의 이름은 아닙니다. 불리언 하나, 문자열 하나, 여러 값을 담은 객체 모두 상태를 표현하는 데 쓸 수 있습니다. 중요한 것은 값의 문법보다 그 값이 어떤 사실의 기준이 되는지입니다.\u003c/p>\n\u003cp>이 장에서 기억할 사실은 알림의 선택 여부 하나입니다. 이를 \u003ccode>{ checked: false }\u003c/code>라는 객체에 담고 state라는 변수로 가리킵니다. false는 알림을 끄겠다는 현재 상태입니다. 객체에 checked라는 속성을 정한 것도, 변수를 state라고 부른 것도 작성자의 선택입니다. 브라우저가 그 이름을 보고 체크박스와 자동으로 연결하지는 않습니다.\u003c/p>\n\u003cp>한 사실을 여러 방식으로 표현할 수 있습니다. checked가 true이면 체크 표시를 켜고, “켜짐”이라는 문구를 보여주고, data-state에 checked라는 문자열을 쓸 수 있습니다. 원본 값에서 계산할 수 있는 이런 값을 \u003cstrong>파생값\u003c/strong>이라고 합니다. 파생값은 별개의 사용자 선택이 아니라 이미 가진 사실을 다른 형태로 표현한 것입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"purpose\">\n\u003ch2>무엇을 원본으로 삼을지 정해야 하는 이유\u003c/h2>\n\u003cp>체크 여부와 “켜짐” 문구를 각각 별도 변수에 저장하면 두 값을 함께 바꿔야 합니다. 한쪽을 빠뜨리면 checked는 false인데 문구는 “켜짐”일 수 있습니다. 같은 사실을 중복 저장해서 서로 어긋나는 문제가 생긴 것입니다. 기준값 하나를 정하고 표시할 문구를 그때그때 계산하면 함께 맞춰야 할 원본의 수가 줄어듭니다.\u003c/p>\n\u003cp>원본은 언제나 자바스크립트 객체여야 하는 것은 아닙니다. 간단한 폼에서는 사용자가 입력한 DOM의 현재 값을 제출할 때 읽는 것으로 충분할 수도 있습니다. 이 장은 여러 요소가 같은 선택 여부를 보여주고, 사용자 입력과 코드 양쪽에서 값을 바꾸기 때문에 자바스크립트의 state를 기준으로 삼습니다. 화면이 어떤 요구를 갖는지에 따라 상태를 둘 위치를 결정하는 것입니다.\u003c/p>\n\u003cp>이 결정을 해두면 문제가 생겼을 때 비교할 기준이 있습니다. 체크 표시와 안내가 다르면 state가 무엇인지 먼저 확인하고, 각각의 DOM이 그 값에서 계산되었는지 추적할 수 있습니다. 여러 표시 중 눈에 보이는 것 하나를 임의로 믿는 대신, 어떤 값이 최종 결정권을 가지는지 코드에 드러내는 셈입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"mechanism\">\n\u003ch2>자바스크립트 메모리와 DOM의 값 연결하기\u003c/h2>\n\u003cp>\u003ccode>state.checked\u003c/code>와 \u003ccode>input.checked\u003c/code>는 서로 다른 객체의 속성입니다. 앞의 것은 우리가 만든 일반 객체의 값이고, 뒤의 것은 브라우저가 제공하는 입력 요소의 현재 선택 값입니다. 둘의 속성 이름이 같거나 처음 값이 같아도 서로 연결되지는 않습니다. 하나를 대입한다고 다른 객체의 속성이 자동으로 바뀌는 규칙이 자바스크립트에 생기는 것은 아닙니다.\u003c/p>\n\u003cp>연결하려면 한 값을 읽고 다른 위치에 쓰는 코드를 실행해야 합니다. \u003ccode>input.checked = state.checked\u003c/code>가 바로 그 연결입니다. 같은 시점에 안내 문구와 data-state도 갱신해야 하므로, 이 작업들을 하나의 함수에 모읍니다. 이 예제에서는 그 함수에 \u003cstrong>render\u003c/strong>라는 이름을 붙였습니다. “현재 상태를 DOM으로 표현한다”는 역할을 드러내기 위한 이름입니다.\u003c/p>\n\u003cp>render를 정의하는 것만으로 실행되지는 않습니다. 처음 화면을 맞출 때 한 번 호출하고, 상태를 변경한 뒤 다시 호출합니다. 값을 바꾸는 코드와 화면에 반영하는 코드를 순서대로 실행하는 함수가 \u003ccode>setChecked\u003c/code>입니다. 이 함수는 새 값을 받아 state를 갱신하고 render를 호출합니다. 상태를 바꾸는 모든 경로가 여기를 지나도록 하면 표시 갱신을 빠뜨릴 가능성이 줄어듭니다.\u003c/p>\n\u003ch3>입력은 들어오고, 표시 값은 한 방향으로 나갑니다\u003c/h3>\n\u003cp>사용자가 체크박스를 조작하면 브라우저가 먼저 input.checked를 바꾸고 change 이벤트를 알립니다. 리스너는 실제 변경 결과를 읽어 setChecked에 전달합니다. “코드로 켜기” 버튼은 사용자의 체크박스 조작을 흉내 내지 않고 같은 함수에 true를 전달합니다. 출발점은 달라도 이후의 상태 변경과 화면 반영 과정은 같습니다.\u003c/p>\n\u003cp>이 구조의 흐름은 \u003cstrong>입력 또는 명령 → 상태 변경 → 파생값 계산 → DOM 반영\u003c/strong>입니다. 표시할 값을 여러 곳에서 각자 결정하지 않고 기준 상태에서 화면 쪽으로 전달하므로 단방향 갱신이라고 설명할 수 있습니다. 사용자 입력은 DOM에서 읽어 들어올 수 있지만, 최종 표시를 결정하는 방향은 기준 상태에서 각 표시 요소로 향합니다.\u003c/p>\n\u003cp>change를 받을 때는 무조건 이전 state의 반대로 뒤집는 대신 input.checked를 읽습니다. 브라우저가 이미 바꾼 결과를 받아들이는 것이기 때문입니다. 별도의 “반대로 바꾸기” 버튼을 만든다면 그때는 state를 기준으로 다음 값을 계산할 수 있습니다. 발생한 결과를 받아들이는 일과 새로운 변경을 명령하는 일을 구분해야 합니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"reading-code\">\n\u003ch2>변경 함수와 표시 함수를 한 줄씩 읽기\u003c/h2>\n\u003cp>아래 코드는 문서에서 input과 summary 요소를 이미 찾았다고 가정합니다. 값 저장과 DOM 반영이라는 두 책임을 최소한의 문장으로 표현했습니다.\u003c/p>\n\u003cpre>\u003ccode>let checked = false;\nfunction render() {\n  input.checked = checked;\n  summary.textContent = checked ? \"켜짐\" : \"꺼짐\";\n}\nfunction setChecked(next) {\n  checked = next;\n  render();\n}\nrender();\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\n\u003cli>첫 줄은 알림의 현재 상태를 false로 정합니다. 이 변수는 자바스크립트의 값이며 아직 체크박스에 쓰지 않았습니다.\u003c/li>\n\u003cli>render의 첫 대입문은 상태를 입력 요소의 현재 선택 값에 씁니다. 둘째 대입문은 같은 상태에서 문구를 계산해 텍스트로 씁니다.\u003c/li>\n\u003cli>setChecked의 매개변수 next는 새로 결정할 값을 받습니다. checked에 그 값을 저장한 뒤 render를 호출하므로 데이터 변경 다음에 표시 갱신이 이어집니다.\u003c/li>\n\u003cli>마지막 render 호출은 처음 화면을 맞춥니다. 함수 정의가 두 개 있다는 사실만으로 초기 표시가 준비되지는 않기 때문에 명시적으로 호출합니다.\u003c/li>\n\u003c/ol>\n\u003cp>예제 화면의 실제 코드는 checked 하나 대신 state 객체를 사용하고 data-state와 JSON 표시도 함께 갱신합니다. 원리는 같습니다. render를 updateView로 이름만 바꾸어도 모든 호출 위치를 함께 고치면 같은 동작을 합니다. 브라우저가 제공하는 특별한 상태 감지 명령이 아니라 우리가 만든 함수이기 때문입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"concept\" id=\"comparison\">\n\u003ch2>값의 변경, 이벤트, 화면 그리기를 구분하기\u003c/h2>\n\u003cp>프로그램에서 input.checked를 대입해도 change 이벤트는 자동 발생하지 않습니다. 따라서 render 안에서 체크 값을 쓰는 것이 다시 change를 만들고, 그 change가 setChecked를 호출하는 반복으로 이어지지는 않습니다. 프로그램 변경은 필요한 변경 함수를 직접 호출하면 됩니다. DOM 속성을 바꾸는 것과 이벤트를 전달하는 것은 서로 다른 동작입니다.\u003c/p>\n\u003cp>반대로 render 호출을 빼면 사용자 조작으로 체크 표시만 바뀌는 상황이 생깁니다. 브라우저의 기본 동작은 남아 있기 때문입니다. 이벤트 리스너가 메모리의 state를 갱신해도 안내 문구나 JSON은 마지막으로 기록한 텍스트를 유지합니다. 화면의 JSON 문자열은 객체 자체가 아니라 객체를 읽어 만든 표시라는 점에서 역시 파생값입니다.\u003c/p>\n\u003cp>실행 예제의 render 횟수는 이 함수가 몇 번 호출되었는지 세는 학습용 값입니다. 브라우저가 실제로 화면을 몇 번 그렸는지 나타내지는 않습니다. 같은 상태를 다시 설정해도 현재 코드에서는 render가 다시 호출됩니다. 표시 내용은 그대로인데 횟수가 증가할 수 있는 이유입니다. 함수 실행과 브라우저의 렌더링 과정을 같은 사건으로 보면 이 차이를 설명하기 어렵습니다.\u003c/p>\n\u003ch3>값을 소유한다는 것과 외부에서 제어한다는 것\u003c/h3>\n\u003cp>상태를 \u003cstrong>소유한다\u003c/strong>는 말은 그 값을 어디에 저장하며 누가 최종 변경을 결정하는지를 뜻합니다. 지금은 예제의 setChecked가 내부 state를 직접 바꿉니다. 하지만 여러 설정을 한 번에 저장하는 화면이라면 바깥의 설정 객체가 전체 값을 소유하고, 각 입력은 그 값을 보여주는 역할만 맡을 수도 있습니다.\u003c/p>\n\u003cp>이때 입력은 “true로 바꾸고 싶다”는 요청을 바깥 코드에 알립니다. 바깥 코드는 요청을 받아 자신의 값을 갱신하거나, 조건에 따라 기존 값을 유지한 뒤 최종 값을 다시 입력에 전달합니다. 이런 관계를 \u003cstrong>외부 제어\u003c/strong>라고 이해할 수 있습니다. 어떤 프레임워크의 전용 기능이 아니라, 값을 결정하는 주체와 값을 표시하는 주체 사이에 세운 약속입니다.\u003c/p>\n\u003cp>내부와 외부 양쪽에서 같은 상태를 독립적으로 결정하면 어느 쪽이 맞는지 충돌할 수 있습니다. 재사용 가능한 구성으로 발전시킬 때는 현재 값이 들어오는 통로와 변경 요청이 나가는 통로를 먼저 정해야 합니다. 이 장의 변경 함수와 표시 함수를 분리한 경험은 그 통로를 구분하는 출발점이 됩니다.\u003c/p>\n\u003c/section>\n\u003csection id=\"live-example\">\u003ch2>연결의 단계를 나누어 확인하기\u003c/h2>\n\u003cp>먼저 자동 연결이 없다는 사실을 확인하고, 하나의 값에서 여러 표현을 계산한 뒤, 두 작업을 하나의 변경 함수로 연결합니다. 세 예제는 서로 다른 데이터를 사용합니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-memory-dom\">1. 메모리와 DOM\u003c/a> · \u003ca href=\"#sample-derived-values\">2. 원본과 파생값\u003c/a> · \u003ca href=\"#sample-state-render\">3. 변경 경로 모으기\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-memory-dom\" aria-labelledby=\"memory-title\">\n\u003cp class=\"sample-meta\">예제 6-1 · 두 객체의 값은 자동으로 연결되지 않음\u003c/p>\u003ch3 id=\"memory-title\">메모리의 값만 바꾸면 화면은 어떨까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> state.checked를 true로 바꾸면 아래 “화면의 알림” 문구도 바로 켜짐이 될까요?\u003c/p>\n\u003cpre>\u003ccode>const state = { checked: false };\nstate.checked = true; // 메모리만 변경\n// 아래 줄을 실행해야 표시가 바뀝니다.\nview.textContent = state.checked ? \"켜짐\" : \"꺼짐\";\u003c/code>\u003c/pre>\n\u003cdiv class=\"row\">\u003cbutton id=\"change-memory\" type=\"button\">1. 메모리의 상태만 켜기\u003c/button>\u003cbutton id=\"render-memory\" type=\"button\">2. 상태를 DOM에 반영\u003c/button>\u003cbutton id=\"reset-memory\" type=\"button\">메모리 실험 초기화\u003c/button>\u003c/div>\n\u003cp>화면의 알림: \u003cstrong id=\"manual-view\">꺼짐\u003c/strong>\u003c/p>\n\u003cp id=\"memory-result\" role=\"status\">메모리 checked: false · 마지막으로 쓴 화면: 꺼짐\u003c/p>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 1번만 누르면 메모리는 true지만 화면의 알림은 꺼짐입니다. 2번을 눌러야 켜짐으로 바뀝니다. 아래 관찰 문구는 현재 값을 읽어 알려주는 실험 도구이며, 실제 알림 표시는 \u003ccode>#manual-view\u003c/code>입니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-derived-values\" aria-labelledby=\"derived-title\">\n\u003cp class=\"sample-meta\">예제 6-2 · 원본은 하나, 표현은 여러 개\u003c/p>\u003ch3 id=\"derived-title\">세 값을 따로 기억할 필요가 있을까요?\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> checked 하나만 알면 안내 문구, CSS용 상태 이름, JSON 표현을 모두 계산할 수 있을까요?\u003c/p>\n\u003cpre>\u003ccode>const summary = checked ? \"켜짐\" : \"꺼짐\";\nconst dataState = checked ? \"checked\" : \"unchecked\";\nconst json = JSON.stringify({ checked });\u003c/code>\u003c/pre>\n\u003cdiv class=\"row\">\u003cbutton id=\"derive-true\" type=\"button\">true에서 계산\u003c/button>\u003cbutton id=\"derive-false\" type=\"button\">false에서 계산\u003c/button>\u003c/div>\n\u003cpre id=\"derived-result\" role=\"status\">아직 계산하지 않았습니다.\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> true는 “켜짐”, “checked”, {\"checked\":true}로 표현됩니다. false는 “꺼짐”, “unchecked”, {\"checked\":false}로 표현됩니다. 이 세 표현을 별개의 원본으로 저장하지 않으면 서로 어긋날 가능성을 줄일 수 있습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-state-render\" aria-labelledby=\"demo-title\">\n\u003cp class=\"sample-meta\">예제 6-3 · 입력 → 상태 변경 → DOM 반영\u003c/p>\u003ch3 id=\"demo-title\">입력 경로가 달라도 같은 상태 변경\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>예상하기:\u003c/strong> 체크박스를 직접 바꾸는 경우와 코드로 켜기 버튼을 누르는 경우가 같은 화면을 만들려면 어떤 처리를 공유해야 할까요?\u003c/p>\n\u003cpre>\u003ccode>function setChecked(checked) {\n  state = { checked };\n  render();\n}\ninput.addEventListener(\"change\", (event) => {\n  setChecked(event.currentTarget.checked);\n});\u003c/code>\u003c/pre>\n\u003clabel class=\"control\" for=\"notifications\">\u003cinput id=\"notifications\" type=\"checkbox\">이메일 알림\u003c/label>\n\u003cdiv class=\"row\">\u003cbutton id=\"turn-on\" type=\"button\">코드로 켜기\u003c/button>\u003cbutton id=\"turn-off\" type=\"button\">코드로 끄기\u003c/button>\u003cbutton id=\"reset-render\" type=\"button\">연결 실험 초기화\u003c/button>\u003c/div>\n\u003cdiv role=\"status\">\u003cp>알림: \u003cspan id=\"summary\" class=\"status\">\u003c/span>\u003c/p>\u003cpre id=\"state-view\">\u003c/pre>\u003cp>render 호출: \u003cspan id=\"render-count\">0\u003c/span>회\u003c/p>\u003c/div>\n\u003cp class=\"expected\">\u003cstrong>확인할 결과:\u003c/strong> 어느 입력 경로든 체크 표시, 문구, JSON이 함께 바뀝니다. 이미 켜진 상태에서 다시 코드로 켜기를 눌러도 render 호출은 증가합니다. 이 수는 함수 호출 횟수이며 브라우저의 실제 paint 횟수가 아닙니다. 초기화하면 초기 render 1회부터 다시 셉니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 JavaScript 전체 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 연결 함수 한 줄의 역할 확인하기\u003c/summary>\u003cp>예제 6-3의 setChecked 안에 있는 render 호출만 잠시 주석 처리한 뒤 실행하세요. 체크박스 직접 조작과 “코드로 켜기” 버튼을 각각 사용하고, 어떤 표시가 바뀌는지 비교합니다.\u003c/p>\u003cp>체크박스 직접 조작은 브라우저가 먼저 DOM을 바꾸지만 프로그램 버튼은 상태만 바꿉니다. 안내와 JSON은 두 경우 모두 갱신되지 않습니다. 마지막으로 render 호출을 복구해 각 입력 경로가 다시 같은 표시를 만드는 것을 확인하세요.\u003c/p>\u003c/details>\n\u003cnav aria-label=\"장 이동\">\u003ca href=\"../05-dom-create/\">← 이전 · 문서 구조 만들기\u003c/a>\u003ca href=\"../09-browser-runtime/\">다음 · 브라우저 실행 순서 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>\n","06-state-render/main.js":"// 6-1. 일반 객체와 DOM 요소는 서로 다른 객체입니다.\n{\n  const state = { checked: false };\n  const view = document.querySelector(\"#manual-view\");\n  const result = document.querySelector(\"#memory-result\");\n  // 학습용 관찰 문구만 갱신합니다. 실제 알림 표시 view는 바꾸지 않습니다.\n  function inspect() {\n    result.textContent = `메모리 checked: ${state.checked} · 마지막으로 쓴 화면: ${view.textContent}`;\n  }\n  document.querySelector(\"#change-memory\").addEventListener(\"click\", () => {\n    state.checked = true;\n    inspect();\n  });\n  document.querySelector(\"#render-memory\").addEventListener(\"click\", () => {\n    view.textContent = state.checked ? \"켜짐\" : \"꺼짐\";\n    inspect();\n  });\n  document.querySelector(\"#reset-memory\").addEventListener(\"click\", () => {\n    state.checked = false;\n    view.textContent = \"꺼짐\";\n    inspect();\n  });\n}\n\n// 6-2. 파생값은 하나의 원본에서 필요할 때 계산합니다.\n{\n  const result = document.querySelector(\"#derived-result\");\n  function derive(checked) {\n    const summary = checked ? \"켜짐\" : \"꺼짐\";\n    const dataState = checked ? \"checked\" : \"unchecked\";\n    const json = JSON.stringify({ checked });\n    result.textContent = `원본 checked: ${checked}\\n안내 문구: ${summary}\\nCSS용 상태: ${dataState}\\nJSON 표현: ${json}`;\n  }\n  document.querySelector(\"#derive-true\").addEventListener(\"click\", () => derive(true));\n  document.querySelector(\"#derive-false\").addEventListener(\"click\", () => derive(false));\n}\n\n// 6-3. 모든 변경이 같은 함수에서 상태 저장과 DOM 반영을 수행합니다.\n{\n  const input = document.querySelector(\"#notifications\");\n  const summary = document.querySelector(\"#summary\");\n  const stateView = document.querySelector(\"#state-view\");\n  const renderCount = document.querySelector(\"#render-count\");\n  let state = { checked: false };\n  let renders = 0;\n\n  // render는 우리가 정한 이름입니다. 호출할 때만 아래 코드가 실행됩니다.\n  function render() {\n    renders += 1;\n    input.checked = state.checked;\n    input.dataset.state = state.checked ? \"checked\" : \"unchecked\";\n    summary.textContent = state.checked ? \"켜짐\" : \"꺼짐\";\n    stateView.textContent = JSON.stringify(state, null, 2);\n    renderCount.textContent = String(renders);\n  }\n  function setChecked(checked) {\n    state = { checked };\n    render(); // 실험: 이 줄을 주석 처리하면 어떤 일이 생길까요?\n  }\n  input.addEventListener(\"change\", (event) => {\n    setChecked(event.currentTarget.checked);\n  });\n  document.querySelector(\"#turn-on\").addEventListener(\"click\", () => setChecked(true));\n  document.querySelector(\"#turn-off\").addEventListener(\"click\", () => setChecked(false));\n  document.querySelector(\"#reset-render\").addEventListener(\"click\", () => {\n    renders = 0;\n    setChecked(false);\n  });\n  render(); // 처음 화면도 직접 한 번 반영합니다.\n}\n","09-browser-runtime/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>7장 · 브라우저의 실행 순서\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">7장 · 브라우저의 실행 순서\u003c/p>\u003ch1>코드가 실행되는 시간과\u003cbr>화면이 바뀌는 시간\u003c/h1>\u003cp class=\"intro\">JavaScript가 코드를 실행하는 방식과 브라우저가 그 실행을 배치하는 방식을 구분하면, 이벤트와 DOM의 동작을 시간 순서대로 이해할 수 있습니다.\u003c/p>\u003c/header>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#engine\">엔진과 브라우저\u003c/a>\u003ca href=\"#stack\">동기 실행과 호출 스택\u003c/a>\u003ca href=\"#queues\">예약된 실행의 순서\u003c/a>\u003ca href=\"#rendering\">DOM과 화면 갱신\u003c/a>\u003ca href=\"#confusions\">혼동하기 쉬운 경계\u003c/a>\u003ca href=\"#observation\">동작 예제\u003c/a>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"engine\">\u003ch2>JavaScript 엔진과 브라우저는 역할이 다릅니다\u003c/h2>\n\u003cp>\u003cstrong>JavaScript 엔진\u003c/strong>은 JavaScript 코드를 해석하고 실행하는 프로그램입니다. 숫자를 더하거나 함수를 호출하고 객체의 값을 읽는 일은 엔진이 담당합니다. \u003cstrong>브라우저\u003c/strong>는 엔진을 포함하면서 문서 표시, 사용자 입력, 네트워크, 타이머 같은 기능도 제공합니다. 둘을 구분해야 “코드를 잠시 멈춘다”와 “다른 일을 예약한다”의 차이를 설명할 수 있습니다.\u003c/p>\n\u003cp>예를 들어 \u003ccode>setTimeout\u003c/code>은 JavaScript 문법이 아니라 브라우저 등이 실행 환경에 제공하는 API입니다. 엔진이 이 함수를 호출하면 브라우저는 타이머를 등록하고, 현재 코드는 다음 줄로 진행합니다. 타이머를 기다리는 동안 함수 본문이 그 줄에서 잠들어 있는 것이 아닙니다. 나중에 실행할 함수는 따로 보관되었다가 실행 가능한 시점에 호출됩니다.\u003c/p>\n\u003cp>DOM도 같은 구분에 속합니다. JavaScript 엔진은 일반적인 객체와 함수의 규칙에 따라 \u003ccode>document.querySelector()\u003c/code>를 호출하지만, 실제 문서와 요소를 제공하는 쪽은 브라우저입니다. 따라서 브라우저 밖의 JavaScript 환경에 항상 document가 있는 것은 아닙니다. 브라우저의 실행 순서를 배우는 것은 언어 문법에 더해 이 실행 환경의 규칙을 배우는 일입니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"stack\">\u003ch2>동기 실행은 호출한 자리에서 끝날 때까지 진행됩니다\u003c/h2>\n\u003cp>\u003cstrong>동기 실행\u003c/strong>은 한 작업의 실행이 끝나야 다음 코드로 진행하는 방식입니다. 어떤 함수가 다른 함수를 직접 호출하면, 호출한 함수의 다음 줄로 넘어가기 전에 새로 호출된 함수가 먼저 끝납니다. 이 호출 관계와 돌아갈 위치를 관리하는 구조를 \u003cstrong>호출 스택(call stack)\u003c/strong>이라고 합니다.\u003c/p>\n\u003cpre>\u003ccode>function inner() { console.log(\"안쪽\"); }\nfunction outer() {\n  inner();\n  console.log(\"바깥쪽 계속\");\n}\nouter();\u003c/code>\u003c/pre>\n\u003cp>여기서는 outer가 실행되다가 inner를 호출합니다. 스택 위에 inner의 실행이 쌓이고, inner가 끝나면 스택에서 빠지면서 outer로 돌아옵니다. 그래서 “안쪽”을 출력한 다음 “바깥쪽 계속”을 출력합니다. 함수를 새로 만들거나 여러 파일로 나누는 것만으로 실행이 병렬이 되지는 않습니다.\u003c/p>\n\u003cp>\u003cstrong>콜백(callback)\u003c/strong>은 다른 코드가 호출하도록 전달하는 함수입니다. 콜백이라는 이름은 함수의 역할을 설명하며, 실행 시점까지 뜻하지는 않습니다. 배열의 \u003ccode>forEach\u003c/code>는 항목을 순회하면서 콜백을 동기적으로 호출합니다. 반면 타이머에 넘긴 콜백은 나중에 호출됩니다. “함수를 전달했다”와 “비동기 실행을 예약했다”는 서로 구분해서 읽어야 합니다.\u003c/p>\n\u003cp>이벤트 리스너에도 이 차이가 있습니다. \u003ccode>button.addEventListener(\"click\", handleClick)\u003c/code>은 함수를 \u003cstrong>등록\u003c/strong>합니다. 이 줄에서 handleClick의 본문은 실행되지 않습니다. 이후 클릭이 발생하면 브라우저가 등록된 함수를 \u003cstrong>호출\u003c/strong>합니다. 등록 시점의 코드 흐름과 이벤트가 발생한 시점의 코드 흐름은 같은 실행의 연속이 아닙니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"queues\">\u003ch2>브라우저는 실행할 일을 예약하고 순서에 맞춰 꺼냅니다\u003c/h2>\n\u003cp>브라우저의 메인 스레드는 JavaScript 실행과 화면 갱신 등 여러 일을 함께 담당합니다. 어떤 일을 언제 실행할지 조율하는 구조를 \u003cstrong>이벤트 루프(event loop)\u003c/strong>라고 합니다. 클릭 처리나 준비된 타이머 콜백처럼 실행할 작업은 \u003cstrong>task\u003c/strong>로 다뤄집니다. 현재 실행 중인 동기 코드를 다른 타이머 콜백이 갑자기 끊고 들어오는 방식으로 이해하면 안 됩니다.\u003c/p>\n\u003cp>\u003cstrong>microtask\u003c/strong>는 특정 시점에 우선 처리하는 별도의 대기 작업입니다. Promise의 then 콜백이 대표적입니다. 브라우저는 JavaScript 호출 스택이 비고 정해진 \u003cstrong>microtask 체크포인트\u003c/strong>에 도달하면 대기 중인 microtask들을 처리합니다. 보통 한 task가 끝나는 시점이 여기에 포함됩니다. 따라서 “각 JavaScript 문장 사이에 끼어드는 작은 작업”은 아닙니다.\u003c/p>\n\u003cp>다음 코드는 하나의 클릭 콜백 안에서 실행한다고 생각해보세요. 타이머를 먼저 등록하더라도 Promise 콜백이 먼저 실행되는 이유를 각 줄의 역할로 설명할 수 있습니다.\u003c/p>\n\u003cpre>\u003ccode>console.log(\"시작\");\nsetTimeout(() =&gt; console.log(\"타이머\"), 0);\nPromise.resolve().then(() =&gt; console.log(\"Promise\"));\nconsole.log(\"끝\");\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>첫 줄은 현재 동기 실행 안에서 “시작”을 출력합니다.\u003c/li>\u003cli>둘째 줄은 타이머 콜백을 예약합니다. 콜백 본문을 지금 실행하지 않으므로 다음 줄로 진행합니다.\u003c/li>\u003cli>셋째 줄은 이미 이행된 Promise에 반응할 콜백을 등록합니다. 이미 결과가 있어도 then 콜백은 즉시 호출되지 않고 microtask로 예약됩니다.\u003c/li>\u003cli>넷째 줄은 같은 동기 실행의 일부이므로 “끝”을 출력합니다. 이후 이 예제에서는 Promise microtask를 처리하고 나서 타이머 task를 처리합니다.\u003c/li>\u003c/ol>\n\u003cp>이 코드의 출력은 “시작 → 끝 → Promise → 타이머”입니다. \u003ccode>setTimeout(fn, 0)\u003c/code>의 0은 “함수를 지금 호출한다”거나 “정확히 0밀리초 뒤 실행한다”는 약속이 아닙니다. 지연 시간이 지난 뒤 실행할 수 있게 된다는 뜻에 가깝고, 실제 실행 시점은 현재 작업과 브라우저의 스케줄링에 영향을 받습니다.\u003c/p>\n\u003cp>microtask 처리 중에 새로운 microtask를 추가하면 같은 체크포인트에서 이어서 처리될 수 있습니다. 이 때문에 microtask를 끝없이 추가하면 다음 task나 화면 갱신이 늦어질 수 있습니다. 예약 기능은 실행 순서를 조율하는 수단이지, 많은 계산을 자동으로 다른 스레드에 나눠주는 장치가 아닙니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"rendering\">\u003ch2>DOM 변경은 객체의 변경이고, 화면 갱신은 그 결과를 보여주는 일입니다\u003c/h2>\n\u003cp>DOM에 값을 대입하면 문서 객체는 즉시 바뀝니다. 바로 다음 줄에서 같은 요소를 읽으면 새 값을 얻습니다. 그러나 새 값을 읽었다는 사실만으로 사용자가 그 모습을 화면에서 봤다고 말할 수는 없습니다. 브라우저는 문서와 스타일을 바탕으로 화면을 갱신하는 과정도 별도로 수행합니다.\u003c/p>\n\u003cpre>\u003ccode>label.textContent = \"첫 번째\";\nconsole.log(label.textContent);\nlabel.textContent = \"두 번째\";\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>첫 줄은 DOM 요소의 내용을 “첫 번째”로 변경합니다.\u003c/li>\u003cli>둘째 줄은 그 객체의 현재 값을 읽으므로 “첫 번째”를 출력합니다.\u003c/li>\u003cli>셋째 줄은 같은 요소를 다시 변경합니다. 브라우저가 중간 모습을 표시할 기회를 갖지 않았다면 사용자는 마지막 값인 “두 번째”만 보게 됩니다.\u003c/li>\u003c/ol>\n\u003cp>화면을 갱신할 때 브라우저는 필요한 스타일을 계산하고, 요소의 크기와 위치를 정하는 \u003cstrong>layout\u003c/strong>을 수행하고, 시각적인 결과를 그리는 \u003cstrong>paint\u003c/strong> 등을 처리합니다. 모든 DOM 변경이 매번 전체 layout과 paint를 일으키는 것은 아닙니다. 변경의 종류에 따라 필요한 작업이 다르고, 브라우저는 여러 변경을 모아 처리할 수도 있습니다.\u003c/p>\n\u003cp>긴 동기 계산은 메인 스레드가 화면을 갱신하거나 입력을 처리할 기회를 늦춥니다. “처리 중”이라는 문구를 대입한 직후 오래 걸리는 반복문을 실행하면, 계산이 끝날 때까지 그 문구가 눈에 보이지 않을 수도 있습니다. DOM 객체를 바꿨다는 사실과 브라우저가 실제로 화면을 그릴 기회를 가졌다는 사실을 나눠 생각해야 합니다.\u003c/p>\n\u003cp>\u003ccode>requestAnimationFrame\u003c/code>은 다음 화면 갱신의 paint 전에 호출될 콜백을 예약하는 API입니다. 애니메이션의 위치나 크기를 화면 갱신 주기에 맞춰 바꿀 때 사용합니다. 이미 paint가 끝났다는 알림은 아니며, 비활성 탭에서는 호출이 줄거나 멈출 수 있습니다. 타이머와의 상대 순서나 고정된 호출 간격을 모든 상황에서 보장한다고 생각하지 마세요.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"confusions\">\u003ch2>기다려야 하는 조건을 먼저 정해야 합니다\u003c/h2>\n\u003cp>코드가 너무 일찍 실행된 것 같다고 해서 모든 문제에 타이머를 붙이면 원인을 가리기 쉽습니다. HTML 파싱이 끝나 요소가 만들어지기를 기다리는 일, 현재 콜백 이후 상태를 처리하는 일, 화면 갱신에 맞춰 값을 바꾸는 일은 각각 다른 요구입니다. 필요한 조건을 먼저 말로 설명한 뒤 defer, 이벤트, microtask, 타이머, requestAnimationFrame 중 어떤 방식이 맞는지 선택해야 합니다.\u003c/p>\n\u003cp>또한 “나중에 실행”은 그때도 같은 화면이 존재한다는 보장이 아닙니다. 예약 후 사용자가 화면을 닫았거나 다른 상태로 이동했을 수 있습니다. 아래 두 번째 예제는 실행 번호를 기억해 오래된 예약이 최신 로그를 덮어쓰지 않게 합니다. 이런 수명 관리가 컴포넌트의 연결 해제와 예약 작업 정리로 이어집니다.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"observation\">\u003ch2>설명한 순서를 실제 문서에서 관찰하기\u003c/h2>\u003cp>첫 예제는 동기 호출, Promise, 타이머의 순서를 기록합니다. 두 번째 예제는 DOM의 중간값을 로그로 남기고 현재 화면의 값과 비교합니다. 로그가 어떤 시점의 값을 읽었는지에 초점을 맞춰 보세요.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-execution-order\">7-1 · 실행 순서\u003c/a>\u003ca href=\"#sample-dom-paint\">7-2 · DOM과 화면\u003c/a>\u003c/div>\n\u003csection class=\"demo sample stack\" id=\"sample-execution-order\" aria-labelledby=\"order-title\">\u003ch3 id=\"order-title\">7-1 · 동기 실행과 예약된 실행\u003c/h3>\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> setTimeout을 Promise보다 먼저 적으면 타이머가 먼저 실행될까요?\u003c/p>\u003cpre>\u003ccode>log(\"시작\");\nsetTimeout(() =&gt; log(\"타이머\"), 0);\nPromise.resolve().then(() =&gt; log(\"Promise\"));\nlog(\"끝\");\u003c/code>\u003c/pre>\u003cbutton id=\"run-order\" type=\"button\" class=\"primary\">실행 순서 확인\u003c/button>\u003cpre id=\"order-log\" aria-live=\"polite\">아직 실행하지 않았습니다.\u003c/pre>\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 동기 코드(1, 2, 3) → Promise(4) → 타이머(5) 순서입니다. 0ms는 현재 실행을 중단하라는 뜻이 아닙니다. 실행할 때마다 로그를 비우므로 반복해서 비교할 수 있습니다.\u003c/p>\u003c/section>\n\u003csection class=\"demo sample stack\" id=\"sample-dom-paint\" aria-labelledby=\"dom-title\">\u003ch3 id=\"dom-title\">7-2 · DOM 객체의 값과 화면의 값\u003c/h3>\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 두 번 대입하면 화면에도 중간값이 각각 보일까요?\u003c/p>\u003cpre>\u003ccode>element.textContent = \"첫 번째 값\";\nconsole.log(element.textContent);\nelement.textContent = \"두 번째 값\";\n// DOM은 즉시 바뀌지만 paint가 대입마다 발생하지는 않습니다.\u003c/code>\u003c/pre>\u003cbutton id=\"run-dom\" type=\"button\">DOM 변경 순서 확인\u003c/button>\u003cp>현재 표시: \u003cspan id=\"dom-value\" class=\"status\">시작값\u003c/span>\u003c/p>\u003cpre id=\"dom-log\" aria-live=\"polite\">아직 실행하지 않았습니다.\u003c/pre>\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 로그에는 중간값이 남지만 최종 문구는 “microtask에서 바꾼 값”입니다. requestAnimationFrame의 로그는 paint 완료의 증거가 아니라 갱신 전 콜백의 기록입니다. 화면을 그릴 기회는 브라우저가 정합니다.\u003c/p>\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 JavaScript 전체 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 동기 콜백 하나를 추가해보기\u003c/summary>\u003cp>첫 예제의 \u003ccode>doNow()\u003c/code> 호출 아래에 \u003ccode>[\"가\", \"나\"].forEach(value =&gt; log(value))\u003c/code>를 추가하고 수정한 코드를 실행해보세요. forEach 콜백은 동기적으로 실행되므로 두 글자는 Promise 로그보다 먼저 기록됩니다. 함수가 콜백으로 전달되었다는 사실과 비동기 예약 여부를 구분할 수 있으면 충분합니다.\u003c/p>\u003c/details>\n\u003cp class=\"muted\">공식 참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTML_DOM_API/Microtask_guide\">MDN · microtask\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/setTimeout\">MDN · setTimeout\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/Window/requestAnimationFrame\">MDN · requestAnimationFrame\u003c/a>\u003c/p>\n\u003cnav>\u003ca href=\"../06-state-render/\">← 이전 · 데이터와 화면\u003c/a>\u003ca href=\"../10-focus-forms/\">다음 · 폼과 포커스 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>\n","09-browser-runtime/main.js":"const runOrder = document.querySelector(\"#run-order\");\nconst orderLog = document.querySelector(\"#order-log\");\nconst runDom = document.querySelector(\"#run-dom\");\nconst domValue = document.querySelector(\"#dom-value\");\nconst domLog = document.querySelector(\"#dom-log\");\nlet domRun = 0;\nlet orderRunning = false;\n\nrunOrder.addEventListener(\"click\", () => {\n  if (orderRunning) return;\n  orderRunning = true;\n  orderLog.textContent = \"\";\n  runOrder.setAttribute(\"aria-disabled\", \"true\");\n  const lines = [];\n  function log(message) {\n    lines.push(message);\n    orderLog.textContent = lines.join(\"\\n\");\n  }\n\n  log(\"1. 클릭 콜백 시작 · 동기 실행\");\n  setTimeout(() => {\n    log(\"5. setTimeout 콜백 · 나중의 task\");\n    orderRunning = false;\n    runOrder.removeAttribute(\"aria-disabled\");\n  }, 0);\n  Promise.resolve().then(() => {\n    log(\"4. Promise.then 콜백 · microtask\");\n  });\n  function doNow() {\n    log(\"2. 직접 호출한 함수 · 동기 실행\");\n  }\n  doNow();\n  log(\"3. 클릭 콜백 끝 · 동기 실행\");\n});\n\nrunDom.addEventListener(\"click\", () => {\n  // 연속으로 실행하면 이전 실행의 화면 갱신 로그는 무시합니다.\n  const currentRun = ++domRun;\n  const lines = [];\n  function log(message) {\n    lines.push(message);\n    domLog.textContent = lines.join(\"\\n\");\n  }\n\n  domValue.textContent = \"첫 번째 값\";\n  log(`첫 대입 직후 읽기: ${domValue.textContent}`);\n  domValue.textContent = \"두 번째 값\";\n  log(`두 번째 대입 직후 읽기: ${domValue.textContent}`);\n  Promise.resolve().then(() => {\n    if (currentRun !== domRun) return;\n    domValue.textContent = \"microtask에서 바꾼 값\";\n    log(`microtask에서 읽기: ${domValue.textContent}`);\n  });\n  requestAnimationFrame(() => {\n    if (currentRun !== domRun) return;\n    log(\"requestAnimationFrame: 다음 화면 갱신의 paint 전에 콜백 실행\");\n  });\n});\n","10-focus-forms/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>8장 · 폼과 포커스의 기본 계약\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003cstyle>#focus-title:focus { outline: 3px solid var(--accent); outline-offset: 6px; } .focus-lab input:disabled { color: var(--muted); background: var(--code); } .focus-lab input[readonly] { background: var(--soft); }\u003c/style>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\" class=\"focus-lab\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">8장 · 폼과 포커스의 기본 계약\u003c/p>\u003ch1>HTML 요소가 제공하는\u003cbr>입력과 이동의 규칙\u003c/h1>\u003cp class=\"intro\">폼 요소는 화면에 그려진 모양 이상의 기능을 갖습니다. 브라우저가 제공하는 의미, 키보드 조작, 포커스, 데이터 수집 규칙을 이해하면 직접 구현할 동작의 경계가 보입니다.\u003c/p>\u003c/header>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#native\">네이티브 요소의 의미\u003c/a>\u003ca href=\"#focus\">포커스와 이동 순서\u003c/a>\u003ca href=\"#form-data\">폼 데이터의 구성\u003c/a>\u003ca href=\"#defaults\">현재 값과 기본값\u003c/a>\u003ca href=\"#semantics\">키보드와 접근성\u003c/a>\u003ca href=\"#observation\">동작 예제\u003c/a>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"native\">\u003ch2>네이티브 요소는 브라우저가 제공하는 동작의 묶음입니다\u003c/h2>\n\u003cp>\u003cstrong>네이티브 HTML 요소\u003c/strong>는 button, input, form처럼 브라우저가 의미와 기본 동작을 알고 있는 요소입니다. button을 사용하면 단지 버튼 모양의 영역이 생기는 데 그치지 않습니다. 브라우저는 그것이 활성화할 수 있는 조작임을 알고, 지원하는 키보드 입력으로 클릭을 발생시키며, 접근성 정보를 통해 보조 기술에도 그 역할을 전달합니다.\u003c/p>\n\u003cp>반대로 일반 div에 클릭 리스너를 달면 마우스 클릭에는 반응할 수 있지만, 그 요소가 자동으로 키보드 조작 가능한 버튼이 되는 것은 아닙니다. 포커스 가능 여부, 키보드 활성화, 비활성 상태의 처리 등을 별도로 고려해야 합니다. 따라서 입력과 조작을 만들 때는 필요한 기능을 이미 갖춘 요소를 출발점으로 삼는 것이 유리합니다.\u003c/p>\n\u003cp>이 기본 동작을 일종의 \u003cstrong>브라우저 계약\u003c/strong>으로 볼 수 있습니다. 개발자가 올바른 요소와 속성을 선언하면 브라우저가 정해진 규칙을 수행합니다. checkbox의 레이블을 클릭하면 선택이 바뀌고, submit 버튼은 자신이 속한 폼의 제출을 시도합니다. JavaScript가 맡을 일은 이 계약에 없는 추가 동작을 연결하거나, 필요한 경우 기본 동작을 명시적으로 취소하는 것입니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"focus\">\u003ch2>포커스는 키보드 입력을 받을 위치입니다\u003c/h2>\n\u003cp>\u003cstrong>포커스(focus)\u003c/strong>는 현재 키보드 입력을 받을 요소가 어디인지 나타내는 브라우저 상태입니다. 입력창에 포커스가 있으면 글자를 입력할 수 있고, 버튼에 포커스가 있으면 해당 버튼을 키보드로 활성화할 수 있습니다. 마우스가 올라간 위치와 포커스는 다를 수 있습니다.\u003c/p>\n\u003cp>\u003cstrong>선택(selection)\u003c/strong>도 포커스와 다릅니다. 텍스트 입력에서는 한 입력창이 포커스를 가진 상태에서 그 안의 일부 글자를 선택할 수 있습니다. 선택된 탭을 표시하는 데이터 역시 별도의 컴포넌트 상태입니다. 어떤 탭에 포커스가 있다고 해서 그 탭의 패널을 반드시 즉시 선택해야 하는 것은 아닙니다. 포커스의 위치와 제품이 표현하는 선택 상태를 한 값으로 취급하면 키보드 동작을 설계하기 어려워집니다.\u003c/p>\n\u003cp>현재 문서에서 포커스를 가진 요소는 \u003ccode>document.activeElement\u003c/code>로 읽습니다. 다른 프레임이나 Shadow DOM이 관여하면 어느 문서의 activeElement를 읽는지도 중요합니다. 이 교재를 한 파일 화면에서 읽는 경우, 예제 안의 document는 실습 프레임의 문서를 뜻합니다.\u003c/p>\n\u003cpre>\u003ccode>const input = document.querySelector(\"#nickname\");\ninput.focus();\nconsole.log(document.activeElement === input);\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>첫 줄은 이름 입력 요소를 찾아 변수에 보관합니다. 이 단계는 요소를 찾을 뿐 포커스를 이동하지 않습니다.\u003c/li>\u003cli>둘째 줄은 그 요소로 포커스 이동을 요청합니다. 대상이 포커스를 받을 수 있는 상태여야 실제로 이동합니다.\u003c/li>\u003cli>셋째 줄은 문서의 현재 포커스 요소와 찾은 입력이 같은 객체인지 비교합니다. 이 예제의 활성 입력에서는 true가 됩니다.\u003c/li>\u003c/ol>\n\u003cp>\u003cstrong>순차 포커스 이동\u003c/strong>은 Tab이나 Shift+Tab으로 문서 안의 대상을 차례로 이동하는 방식입니다. \u003ccode>focus()\u003c/code>로 특정 대상을 지정하는 프로그램 이동과는 구분됩니다. \u003ccode>tabindex=\"0\"\u003c/code>은 일반적인 문서 순서의 Tab 이동에 포함하고, \u003ccode>tabindex=\"-1\"\u003c/code>은 Tab 순서에는 추가하지 않으면서 프로그램으로 포커스를 줄 수 있게 합니다.\u003c/p>\n\u003cp>예를 들어 새 화면의 제목은 사용자가 Tab을 누를 때마다 들를 조작 대상은 아니지만, 화면이 바뀌었음을 알리려고 한 번 포커스를 옮길 수 있습니다. 이런 경우 제목에 -1을 사용합니다. 양수 tabindex로 순서를 강제로 재배열하기보다 문서 자체의 순서를 자연스럽게 구성하세요. 기본적인 순차 이동에는 브라우저와 운영체제의 키보드 탐색 설정도 영향을 줍니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"form-data\">\u003ch2>폼은 이름을 가진 입력들의 현재 값을 수집합니다\u003c/h2>\n\u003cp>\u003cstrong>폼(form)\u003c/strong>은 관련된 입력과 제출 동작을 묶는 HTML 구조입니다. 폼의 데이터를 수집할 때는 화면에 보이는 모든 문자열을 긁어오는 것이 아니라, 각 폼 요소가 데이터에 포함될 조건을 충족하는지 확인합니다. 이를 이해해야 사용자에게 보이는 입력과 실제로 읽히는 데이터가 다른 이유를 찾을 수 있습니다.\u003c/p>\n\u003cp>\u003ccode>id\u003c/code>는 요소를 찾거나 label의 for와 연결하는 식별자입니다. \u003ccode>name\u003c/code>은 폼 데이터에서 사용하는 항목 이름입니다. 입력에 id만 있고 name이 없으면 선택자로 찾을 수는 있어도 FormData 항목에는 포함되지 않습니다. 두 속성의 문자열을 같게 쓸 수는 있지만 역할까지 같은 것은 아닙니다.\u003c/p>\n\u003cpre>\u003ccode>form.addEventListener(\"submit\", (event) =&gt; {\n  event.preventDefault();\n  const data = new FormData(form);\n  const entries = [...data.entries()];\n  console.log(entries);\n});\u003c/code>\u003c/pre>\n\u003col class=\"line-explanation\">\u003cli>첫 줄은 폼의 submit 이벤트가 발생했을 때 호출할 함수를 등록합니다. 버튼 클릭뿐 아니라 지원되는 키보드 제출 경로도 이 이벤트로 모을 수 있습니다.\u003c/li>\u003cli>둘째 줄은 이 예제에서 실제 데이터 전송과 페이지 이동이 일어나지 않도록 기본 제출을 취소합니다.\u003c/li>\u003cli>셋째 줄은 현재 폼을 기준으로 이름과 값의 묶음인 FormData 객체를 만듭니다. 객체를 만드는 것만으로 서버에 전송되지는 않습니다.\u003c/li>\u003cli>넷째 줄은 항목들을 배열로 펼칩니다. 같은 name이 여러 번 나타나더라도 각각 보존합니다.\u003c/li>\u003cli>다섯째 줄은 수집된 결과를 확인합니다. 이 배열을 객체로 바로 바꾸면 중복 키의 앞선 값이 덮어써질 수 있습니다.\u003c/li>\u003c/ol>\n\u003cp>데이터에 포함될 조건에는 활성 상태도 들어갑니다. \u003ccode>disabled\u003c/code>인 입력은 일반적으로 포커스를 받지 않고 폼 데이터에서도 제외됩니다. \u003ccode>readonly\u003c/code>인 일반 텍스트 입력은 사용자가 수정할 수 없지만 포커스를 받고 값을 선택할 수 있으며 데이터에도 포함됩니다. 둘은 단지 회색으로 보이게 하는 두 가지 스타일이 아닙니다.\u003c/p>\n\u003cp>readonly는 모든 폼 요소에 공통으로 적용되는 속성이 아닙니다. 체크박스에 붙여도 텍스트 입력과 같은 편집 제한을 만들 수 없습니다. 체크박스의 데이터 포함 규칙도 별도로 알아야 합니다. 선택되어 있을 때만 name과 value가 항목으로 들어가며, 해제하면 일반적인 폼 데이터에서 그 항목 자체가 빠집니다. 자동으로 false라는 문자열을 보내는 것은 아닙니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"defaults\">\u003ch2>현재 값과 돌아갈 기본값은 서로 다른 정보입니다\u003c/h2>\n\u003cp>텍스트 입력의 \u003ccode>value\u003c/code>는 현재 문자열이고 \u003ccode>defaultValue\u003c/code>는 기본 문자열입니다. checkbox의 \u003ccode>checked\u003c/code>는 현재 선택 상태이며 \u003ccode>defaultChecked\u003c/code>는 기본 선택 상태입니다. 사용자가 입력을 바꾸면 현재 값은 바뀌어도 기본값은 그대로 남을 수 있습니다.\u003c/p>\n\u003cp>폼의 \u003cstrong>reset\u003c/strong>은 각 입력을 이 기본값으로 돌리는 동작입니다. 모든 값을 빈 문자열이나 false로 지우는 기능은 아닙니다. HTML에서 이름의 기본값이 “민지”이고 알림이 checked로 선언되어 있다면 reset 후에도 이름과 켜진 알림이 남습니다. defaultValue를 코드로 바꾸면 이후 되돌아갈 기본값도 달라집니다.\u003c/p>\n\u003cp>reset 이벤트는 브라우저가 입력에 기본값을 적용하기 전에 발생합니다. 따라서 이벤트 리스너 안에서 바로 value를 읽으면 초기화 전 값일 수 있습니다. 아래 예제는 그 값을 먼저 기록하고, 다음 task에서 기본 동작이 끝난 값을 다시 읽습니다. reset이 취소되었는지도 확인합니다. 이는 모든 이벤트에 무조건 타이머가 필요하다는 뜻이 아니라, 이 이벤트와 기본 동작의 순서를 고려한 연결입니다.\u003c/p>\n\u003cp>reset은 disabled 같은 모든 속성을 처음 상태로 복구하는 기능도 아닙니다. 입력 값의 초기화와 컴포넌트 전체 설정의 초기화를 따로 설계해야 합니다. 또한 required 입력이 비어 있는 경우처럼 기본 검증에 실패하면 브라우저가 제출을 막아 submit 이벤트까지 도달하지 않을 수 있습니다. 버튼은 눌렸는데 제출 코드가 실행되지 않을 때는 검증 상태도 확인해야 합니다.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"semantics\">\u003ch2>접근성 의미와 실제 동작을 함께 제공해야 합니다\u003c/h2>\n\u003cp>\u003cstrong>시맨틱 의미\u003c/strong>는 요소가 어떤 역할을 갖는지 나타내는 정보입니다. button, checkbox 같은 네이티브 요소는 브라우저가 역할과 기본 동작을 함께 알고 있습니다. \u003cstrong>ARIA\u003c/strong>는 역할이나 상태 같은 접근성 정보를 추가로 표현하는 속성 체계입니다. 하지만 ARIA 속성이 키보드 동작이나 폼 규칙을 대신 구현해주지는 않습니다.\u003c/p>\n\u003cp>예를 들어 \u003ccode>aria-disabled=\"true\"\u003c/code>는 비활성 상태라는 의미를 전달하지만, native disabled처럼 클릭을 막거나 폼 데이터에서 값을 빼주지는 않습니다. 마찬가지로 tabindex는 포커스 가능 여부에 관여할 뿐 일반 div를 Enter와 Space로 활성화되는 버튼으로 바꾸지 않습니다. 의미, 포커스, 키보드 처리, 상태 변경은 서로 연결해야 할 별개의 책임입니다.\u003c/p>\n\u003cp>헤드리스 컴포넌트에서도 먼저 기본 요소가 이미 제공하는 책임을 확인해야 합니다. 그다음 Tabs의 방향키 이동이나 Dialog를 닫은 뒤 원래 버튼으로 돌아가는 동작처럼 추가로 필요한 규칙을 설계합니다. 포커스를 이동할 때는 대상이 문서에 존재하는지, 숨김이나 disabled 상태인지, 다른 코드가 다시 포커스를 옮기고 있는지도 함께 확인합니다.\u003c/p>\n\u003c/section>\n\n\u003csection id=\"observation\">\u003ch2>하나의 규칙씩 확인하는 예제\u003c/h2>\n\u003cp>포커스, 데이터 수집, 초기화는 각각 다른 브라우저 기능입니다. 아래 예제는 서로 다른 입력을 사용하므로 앞 예제의 조작이 다음 결과에 영향을 주지 않습니다.\u003c/p>\n\u003cdiv class=\"sample-links\">\u003ca href=\"#sample-focus\">8-1 · 포커스\u003c/a>\u003ca href=\"#sample-form-data\">8-2 · 폼 데이터\u003c/a>\u003ca href=\"#sample-form-reset\">8-3 · 초기화\u003c/a>\u003c/div>\n\u003csection class=\"demo sample\" id=\"sample-focus\" aria-labelledby=\"focus-sample-title\">\n\u003ch3 id=\"focus-sample-title\">8-1 · Tab 순서와 프로그램으로 옮기는 포커스\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 제목에 포커스를 보낼 수 있다면 Tab으로도 그 제목에 멈출까요?\u003c/p>\n\u003cdiv class=\"stack\">\u003ch4 id=\"focus-title\" tabindex=\"-1\">프로필 입력 영역\u003c/h4>\n\u003clabel for=\"focus-name-input\">연습용 이름\u003c/label>\u003cinput id=\"focus-name-input\" type=\"text\" value=\"민지\">\n\u003cdiv class=\"row\">\u003cbutton id=\"focus-name\" type=\"button\">이름으로 포커스 이동\u003c/button>\u003cbutton id=\"focus-heading\" type=\"button\">제목으로 포커스 이동\u003c/button>\u003c/div>\n\u003cp>현재 문서의 포커스: \u003cspan id=\"focus-result\" class=\"status\">\u003c/span>\u003c/p>\u003c/div>\n\u003cpre>\u003ccode>heading.tabIndex = -1;\nheading.focus();\n// document.activeElement === heading\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 제목 이동 버튼을 누르면 제목에 테두리가 나타납니다. 제목의 tabindex=\"-1\"은 프로그램으로 이동할 수 있게 하지만 일반 Tab 순서에는 넣지 않습니다. 제목에서 Tab을 누르면 다음 입력으로 이동합니다. 포커스 표시는 시각 관찰용이며 매 이동을 별도로 읽어주지 않습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-form-data\" aria-labelledby=\"data-sample-title\">\n\u003ch3 id=\"data-sample-title\">8-2 · 화면의 입력과 제출되는 데이터는 다릅니다\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> readonly, disabled, name 없음 중 어떤 입력이 FormData에 들어갈까요?\u003c/p>\n\u003cform id=\"profile-form\" class=\"stack\">\n\u003clabel class=\"stack\" for=\"nickname\">이름 · 수정 가능\u003cinput id=\"nickname\" name=\"nickname\" type=\"text\" value=\"민지\" required autocomplete=\"off\">\u003c/label>\n\u003clabel class=\"stack\" for=\"account\">계정 · readonly\u003cinput id=\"account\" name=\"account\" type=\"text\" value=\"learner-001\" readonly>\u003c/label>\n\u003clabel class=\"stack\" for=\"plan\">플랜 · disabled\u003cinput id=\"plan\" name=\"plan\" type=\"text\" value=\"basic\" disabled>\u003c/label>\n\u003clabel class=\"stack\" for=\"memo\">메모 · name 없음\u003cinput id=\"memo\" type=\"text\" value=\"화면에서만 읽는 메모\" autocomplete=\"off\">\u003c/label>\n\u003clabel class=\"control\" for=\"news\">\u003cinput id=\"news\" name=\"news\" type=\"checkbox\" value=\"email\" checked>이메일 소식 받기\u003c/label>\n\u003cbutton type=\"submit\">폼 값 읽기\u003c/button>\u003c/form>\n\u003cpre id=\"form-result\" aria-live=\"polite\">아직 폼 값을 읽지 않았습니다.\u003c/pre>\n\u003cpre>\u003ccode>form.addEventListener(\"submit\", (event) =&gt; {\n  event.preventDefault();\n  const entries = [...new FormData(form).entries()];\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 처음에는 nickname, account, news만 포함됩니다. readonly는 포함되지만 disabled와 name 없는 입력은 제외됩니다. 알림을 해제하고 다시 읽으면 news 항목 자체가 사라집니다. 이름을 비우면 required 검증이 제출을 막으므로 이전 결과가 남습니다.\u003c/p>\n\u003c/section>\n\u003csection class=\"demo sample\" id=\"sample-form-reset\" aria-labelledby=\"reset-sample-title\">\n\u003ch3 id=\"reset-sample-title\">8-3 · reset은 빈 값이 아니라 기본값으로 돌아갑니다\u003c/h3>\n\u003cp class=\"prediction\">\u003cstrong>먼저 예상하기.\u003c/strong> 이름과 체크를 바꾼 뒤 초기화하면 빈 이름과 꺼진 체크가 될까요?\u003c/p>\n\u003cform id=\"reset-form\" class=\"stack\">\n\u003clabel class=\"stack\" for=\"reset-name\">이름 · 기본값 민지\u003cinput id=\"reset-name\" type=\"text\" value=\"민지\">\u003c/label>\n\u003clabel class=\"control\" for=\"reset-news\">\u003cinput id=\"reset-news\" type=\"checkbox\" checked>알림 · 기본값 켜짐\u003c/label>\n\u003cbutton type=\"reset\">이 예제의 기본값으로 초기화\u003c/button>\u003c/form>\n\u003cpre id=\"reset-result\" aria-live=\"polite\">이름과 체크를 바꾼 뒤 초기화해보세요.\u003c/pre>\n\u003cpre>\u003ccode>form.addEventListener(\"reset\", (event) =&gt; {\n  // 이 자리에서는 아직 이전 값일 수 있습니다.\n  setTimeout(() =&gt; {\n    if (!event.defaultPrevented) readCurrentValues();\n  }, 0);\n});\u003c/code>\u003c/pre>\n\u003cp class=\"expected\">\u003cstrong>관찰할 결과.\u003c/strong> 이름은 “민지”, 체크는 true로 돌아옵니다. 로그의 첫 줄은 reset 이벤트 안의 값, 둘째 줄은 기본 동작 이후 값입니다. 현재값(value, checked)과 기본값(defaultValue, defaultChecked)이 서로 다른 정보이기 때문입니다.\u003c/p>\n\u003c/section>\n\u003cp>\u003ca href=\"main.js\">이 장의 JavaScript 전체 읽기\u003c/a>\u003c/p>\u003c/section>\n\u003cdetails class=\"optional-practice\">\u003csummary>선택 연습 · 표시된 값과 제출되는 값을 연결해보기\u003c/summary>\u003cp>메모 입력에 \u003ccode>name=\"memo\"\u003c/code>를 추가하고 플랜의 disabled를 제거한 뒤 수정한 코드를 실행해보세요. 두 값 모두 FormData에 포함됩니다. 이 변화는 새로운 JavaScript 처리 없이 HTML 속성만 바꾸어 얻은 결과입니다. 브라우저가 담당하는 데이터 수집 규칙을 설명할 수 있으면 충분합니다.\u003c/p>\u003c/details>\n\u003cp class=\"muted\">공식 참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement/focus\">MDN · focus\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Global_attributes/tabindex\">MDN · tabindex\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Attributes/disabled\">MDN · disabled\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/API/HTMLFormElement/reset\">MDN · reset\u003c/a>\u003c/p>\n\u003cnav>\u003ca href=\"../09-browser-runtime/\">← 이전 · 브라우저 실행 순서\u003c/a>\u003ca href=\"../11-accessibility/\">다음 · 접근성의 의미와 동작 →\u003c/a>\u003c/nav>\n\u003c/main>\u003c/body>\u003c/html>","10-focus-forms/main.js":"// 8-1 · 포커스는 문서의 상태입니다. 매 이동을 live region으로 알리지 않습니다.\nconst focusResult = document.querySelector(\"#focus-result\");\nfunction describeFocus() {\n  const active = document.activeElement;\n  focusResult.textContent = active\n    ? `${active.tagName.toLowerCase()}${active.id ? `#${active.id}` : \"\"}`\n    : \"없음\";\n}\ndocument.addEventListener(\"focusin\", describeFocus);\ndocument.querySelector(\"#focus-name\").addEventListener(\"click\", () => {\n  document.querySelector(\"#focus-name-input\").focus();\n});\ndocument.querySelector(\"#focus-heading\").addEventListener(\"click\", () => {\n  document.querySelector(\"#focus-title\").focus();\n});\ndescribeFocus();\n\n// 8-2 · FormData는 저장소가 아니라 폼의 현재 값을 읽습니다.\nconst profileForm = document.querySelector(\"#profile-form\");\nprofileForm.addEventListener(\"submit\", (event) => {\n  event.preventDefault();\n  document.querySelector(\"#form-result\").textContent = JSON.stringify(\n    [...new FormData(profileForm).entries()], null, 2,\n  );\n});\n\n// 8-3 · 이 폼은 앞 예제와 입력 및 초기화 상태를 공유하지 않습니다.\nconst resetForm = document.querySelector(\"#reset-form\");\nconst resetName = document.querySelector(\"#reset-name\");\nconst resetNews = document.querySelector(\"#reset-news\");\nconst resetResult = document.querySelector(\"#reset-result\");\nlet resetTimer;\nresetForm.addEventListener(\"reset\", (event) => {\n  const before = `reset 이벤트 안: value=${resetName.value}, checked=${resetNews.checked}`;\n  resetResult.textContent = before;\n  clearTimeout(resetTimer);\n  resetTimer = setTimeout(() => {\n    if (event.defaultPrevented) return;\n    resetResult.textContent = `${before}\\n기본 reset 후: value=${resetName.value}, checked=${resetNews.checked}`;\n  }, 0);\n});\n","11-accessibility/index.html":"\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>9장 · 의미와 동작을 함께 전달하는 접근성\u003c/title>\u003clink rel=\"stylesheet\" href=\"../styles.css\">\u003cscript defer src=\"main.js\">\u003c/script>\u003c/head>\n\u003cbody>\u003ca class=\"skip-link\" href=\"#main-content\">본문으로 건너뛰기\u003c/a>\u003cmain id=\"main-content\" tabindex=\"-1\">\n\u003cheader>\u003ca href=\"../\">차례\u003c/a>\u003cp class=\"eyebrow\">9장 · 의미와 동작을 함께 전달하는 접근성\u003c/p>\u003ch1>화면의 변화가\u003cbr>모든 사용자에게 전달되려면\u003c/h1>\u003cp class=\"intro\">요소가 보인다는 것, 키보드로 조작된다는 것, 보조 기술에 의미가 전달된다는 것은 서로 연결되지만 같은 일이 아닙니다. DOM을 바꿀 때 함께 지켜야 할 이름, 역할, 상태와 포커스의 관계를 살펴봅니다.\u003c/p>\u003c/header>\n\n\u003csection class=\"learning-goals\" aria-labelledby=\"goals-title\">\u003ch2 id=\"goals-title\">이 장에서 이해할 세 가지\u003c/h2>\u003cul>\u003cli>DOM 트리와 접근성 트리가 왜 일대일로 같지 않은지 설명합니다.\u003c/li>\u003cli>기본 HTML이 제공하는 동작과 ARIA가 표현하는 정보를 구분합니다.\u003c/li>\u003cli>화면, 접근성 상태, 키보드 포커스를 함께 확인합니다.\u003c/li>\u003c/ul>\u003cp>먼저 읽기: \u003ca href=\"../02-dom/\">2장 · DOM 객체\u003c/a>, \u003ca href=\"../10-focus-forms/\">8장 · 폼과 포커스\u003c/a>\u003c/p>\u003c/section>\n\u003cnav class=\"chapter-toc\" aria-label=\"이 장의 읽기 순서\">\u003ca href=\"#accessibility-tree\">DOM과 접근성 트리\u003c/a>\u003ca href=\"#name-role-state\">이름·역할·상태\u003c/a>\u003ca href=\"#native-and-aria\">HTML과 ARIA의 책임\u003c/a>\u003ca href=\"#focus-and-feedback\">포커스와 변화 알림\u003c/a>\u003ca href=\"#observation\">네 가지 작은 예제\u003c/a>\u003ca href=\"#manual-check\">직접 확인하는 방법\u003c/a>\u003c/nav>\n\n\u003csection class=\"concept\" id=\"accessibility-tree\">\u003ch2>같은 문서에서 화면과 접근성 정보를 만듭니다\u003c/h2>\n\u003cp>DOM은 문서의 요소와 텍스트를 객체로 표현합니다. 브라우저는 이 문서의 의미와 표시 상태 등을 바탕으로 보조 기술이 이용할 \u003cstrong>접근성 트리(accessibility tree)\u003c/strong>도 구성합니다. 스크린 리더는 화면의 픽셀을 순서대로 읽는 도구가 아닙니다. 브라우저와 운영체제가 제공하는 접근성 정보를 통해 제목, 링크, 버튼 같은 대상을 탐색하고 알립니다.\u003c/p>\n\u003cfigure class=\"concept-figure\">\u003cfigcaption>하나의 문서에서 이어지는 두 가지 표현 · 개념을 위한 단순화\u003c/figcaption>\u003cdiv class=\"flow\">\u003cspan>HTML\u003c/span> → \u003cspan>DOM + 스타일 + 의미\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan>시각적 배치와 그리기\u003c/span> → \u003cspan>화면\u003c/span>\u003c/div>\u003cdiv class=\"flow\">\u003cspan>이름·역할·상태 구성\u003c/span> → \u003cspan>접근성 API\u003c/span> → \u003cspan>보조 기술\u003c/span>\u003c/div>\u003cp>두 트리의 노드가 항상 일대일로 대응하지는 않습니다. 실제 정보는 브라우저 개발자 도구의 접근성 패널에서 확인합니다.\u003c/p>\u003c/figure>\n\u003cp>예를 들어 배치용 요소가 별도의 의미 있는 대상으로 노출되지 않을 수 있습니다. 일반적인 \u003ccode>hidden\u003c/code> 요소는 화면과 접근성 트리에서 제외됩니다. 반면 \u003ccode>aria-hidden=\"true\"\u003c/code>는 접근성 정보에서 숨기려는 선언이며 화면 표시나 키보드 포커스를 막는 기능이 아닙니다. 포커스를 받을 수 있는 조작이나 그 조상을 aria-hidden으로 숨기면 조작은 남아 있는데 의미를 찾기 어려운 상황이 생길 수 있습니다.\u003c/p>\n\u003cp class=\"muted\">참고: \u003ca href=\"https://developer.mozilla.org/en-US/docs/Glossary/Accessibility_tree\">MDN · 접근성 트리\u003c/a>, \u003ca href=\"https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-hidden\">MDN · aria-hidden\u003c/a>\u003c/p>\n\u003c/section>\n\n\u003csection class=\"concept\" id=\"name-role-state\">\u003ch2>이름은 무엇인지, 역할은 어떤 종류인지, 상태는 지금 어떤지 설명합니다\u003c/h2>\n\u003cp>\u003cstrong>접근 가능한 이름\u003c/strong>은 같은 화면의 여러 조작을 구별하는 이름입니다. “이메일 소식 받기”라는 체크박스라면 이름은 “이메일 소식 받기”, 역할은 checkbox, 상태는 선택됨 또는 선택 안 됨입니다. 색이 초록으로 바뀌었다는 사실만으로 이 세 가지 정보가 모두 전달되지는 않습니다.\u003c/p>\n\u003ctable>\u003ccaption>정보의 종류와 HTML로 표현하는 방법\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">정보\u003c/th>\u003cth scope=\"col\">답하는 질문\u003c/th>\u003cth scope=\"col\">예\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">이름\u003c/th>\u003ctd>어떤 조작인가?\u003c/td>\u003ctd>버튼 안의 글자, 입력과 연결한 label\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">역할\u003c/th>\u003ctd>어떤 종류의 요소인가?\u003c/td>\u003ctd>button, input type=\"checkbox\"의 기본 의미\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">상태\u003c/th>\u003ctd>지금 어떤 상황인가?\u003c/td>\u003ctd>checkbox의 checked, 펼침 버튼의 aria-expanded\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">설명\u003c/th>\u003ctd>추가로 알아야 할 내용은?
